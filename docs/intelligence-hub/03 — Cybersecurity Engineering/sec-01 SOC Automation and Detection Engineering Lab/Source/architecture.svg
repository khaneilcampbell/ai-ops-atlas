<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Helvetica Neue, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>

  <!-- isolated lab boundary -->
  <rect x="24" y="40" width="1152" height="300" rx="10" fill="#F3F5FB" stroke="#8FA0CC" stroke-dasharray="6 5"/>
  <text x="44" y="70" font-size="15" font-weight="600" fill="#1E3A8A" letter-spacing="1.5">ISOLATED LAB · VIRTUALBOX HOST-ONLY NETWORK</text>

  <!-- Kali -->
  <rect x="56" y="110" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="80" y="146" font-size="20" font-weight="700" fill="#111827">Kali Linux VM</text>
  <text x="80" y="172" font-size="15" fill="#4B5563">Attacker · 10.10.10.20</text>
  <text x="80" y="212" font-size="14" fill="#111827" font-family="Menlo, DejaVu Sans Mono, monospace">smbclient loop</text>
  <text x="80" y="234" font-size="14" fill="#4B5563">wrong password, repeated</text>

  <!-- Windows -->
  <rect x="440" y="110" width="290" height="150" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="464" y="146" font-size="20" font-weight="700" fill="#111827">Windows 11 VM</text>
  <text x="464" y="172" font-size="15" fill="#4B5563">Target · 10.10.10.10</text>
  <text x="464" y="208" font-size="14" fill="#111827">Security log: EventCode 4625</text>
  <text x="464" y="232" font-size="14" fill="#111827">Splunk Universal Forwarder</text>

  <!-- Splunk -->
  <rect x="864" y="110" width="280" height="150" rx="8" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.5"/>
  <text x="888" y="146" font-size="20" font-weight="700" fill="#111827">Splunk Enterprise</text>
  <text x="888" y="172" font-size="15" fill="#4B5563">Indexer · localhost* · index=main</text>
  <text x="888" y="208" font-size="14" fill="#111827">SPL threshold detection</text>
  <text x="888" y="232" font-size="14" fill="#111827">≥ 10 failures / 5 min</text>

  <!-- arrows lab -->
  <line x1="306" y1="185" x2="436" y2="185" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="318" y="174" font-size="13" fill="#4B5563">SMB logons</text>
  <line x1="730" y1="185" x2="860" y2="185" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="742" y="174" font-size="13" fill="#4B5563">forwarded</text>
  <text x="742" y="208" font-size="13" fill="#4B5563">events</text>

  <!-- automation -->
  <rect x="864" y="400" width="280" height="120" rx="8" fill="#0B1533"/>
  <text x="888" y="436" font-size="20" font-weight="700" fill="#FFFFFF">soc_automation.py</text>
  <text x="888" y="462" font-size="14" fill="#C7D2EC">Python 3 · requests</text>
  <text x="888" y="488" font-size="14" fill="#C7D2EC">auth → search job → results</text>

  <rect x="440" y="400" width="290" height="120" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="464" y="436" font-size="20" font-weight="700" fill="#111827">Case note</text>
  <text x="464" y="462" font-size="14" fill="#4B5563" font-family="Menlo, DejaVu Sans Mono, monospace">notes/soc_case_&lt;time&gt;.md</text>
  <text x="464" y="488" font-size="14" fill="#4B5563">one section per alert</text>

  <line x1="1004" y1="260" x2="1004" y2="396" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1016" y="320" font-size="13" fill="#1E3A8A" font-weight="600">REST API</text>
  <text x="1016" y="338" font-size="13" fill="#1E3A8A">localhost:8089</text>
  <line x1="864" y1="460" x2="734" y2="460" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="748" y="448" font-size="13" fill="#4B5563">writes</text>

  <text x="56" y="440" font-size="14" fill="#4B5563">Lab host: MacBook Pro, macOS,</text>
  <text x="56" y="462" font-size="14" fill="#4B5563">VirtualBox 7.2.6 (per WALKTHROUGH.md)</text>
  <text x="56" y="484" font-size="13" fill="#6B7280">* host inferred from localhost URLs</text>
  <text x="56" y="548" font-size="13" fill="#6B7280">Source: README.md and WALKTHROUGH.md, docs/portfolio-review</text>
</svg>
