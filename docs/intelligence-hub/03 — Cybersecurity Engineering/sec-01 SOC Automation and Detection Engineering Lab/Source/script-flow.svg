<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Helvetica Neue, Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/>
    </marker>
  </defs>
  <rect width="1200" height="330" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1E3A8A" letter-spacing="1.5">SOC_AUTOMATION.PY · REQUEST FLOW</text>

  <g font-size="14">
    <rect x="24" y="60" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
    <text x="40" y="88" font-size="17" font-weight="700" fill="#111827">0 · Check env</text>
    <text x="40" y="114" fill="#4B5563">SPLUNK_USER and</text>
    <text x="40" y="134" fill="#4B5563">SPLUNK_PASS set?</text>
    <text x="40" y="164" fill="#B42318">no → exit with message</text>

    <rect x="260" y="60" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
    <text x="276" y="88" font-size="17" font-weight="700" fill="#111827">1 · Authenticate</text>
    <text x="276" y="114" fill="#4B5563" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="11.5">POST /services/auth/login</text>
    <text x="276" y="138" fill="#4B5563">returns sessionKey</text>

    <rect x="506" y="60" width="220" height="120" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
    <text x="522" y="88" font-size="17" font-weight="700" fill="#111827">2 · Run search</text>
    <text x="522" y="114" fill="#4B5563" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="11.5">POST /services/search/jobs</text>
    <text x="522" y="138" fill="#4B5563">exec_mode=blocking</text>
    <text x="522" y="160" fill="#4B5563">returns sid</text>

    <rect x="762" y="60" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
    <text x="778" y="88" font-size="17" font-weight="700" fill="#111827">3 · Fetch results</text>
    <text x="778" y="114" fill="#4B5563" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="11.5">GET …/jobs/{sid}/results</text>
    <text x="778" y="138" fill="#4B5563">JSON, count=0 (all)</text>
    <text x="778" y="164" fill="#B42318">0 rows → stop, no note</text>

    <rect x="998" y="60" width="178" height="120" rx="8" fill="#0B1533"/>
    <text x="1014" y="88" font-size="17" font-weight="700" fill="#FFFFFF">4 · Write note</text>
    <text x="1014" y="114" fill="#C7D2EC">Markdown file in</text>
    <text x="1014" y="134" fill="#C7D2EC" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="12.5">notes/</text>
    <text x="1014" y="158" fill="#C7D2EC">+ console summary</text>
  </g>
  <line x1="224" y1="120" x2="256" y2="120" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="120" x2="502" y2="120" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <line x1="726" y1="120" x2="758" y2="120" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <line x1="962" y1="120" x2="994" y2="120" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>

  <rect x="260" y="214" width="702" height="84" rx="8" fill="#FEF3F2" stroke="#F04438" stroke-dasharray="5 4"/>
  <text x="280" y="244" font-size="15" font-weight="700" fill="#B42318">Error handling wraps steps 1 to 4</text>
  <text x="280" y="270" font-size="14" fill="#4B5563">ConnectionError, HTTPError, KeyError and any other Exception are caught and printed as</text>
  <text x="280" y="290" font-size="14" fill="#4B5563">one-line messages. The script still exits with status 0 in those cases.</text>
  <text x="24" y="320" font-size="12.5" fill="#6B7280">Source: soc_automation.py at commit ba1347a (docs/portfolio-review), identical to main</text>
</svg>
