name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types, unit tests, build, secret scan, Flow export check
        run: npm run ci
      - name: Local database
        run: npx wrangler d1 migrations apply benjaire-dashboard --local
      - name: Start the Worker locally
        # The local Access bypass works only on localhost and only with this
        # file, which exists only inside the CI runner.
        run: |
          printf 'ALLOW_LOCAL_DEV=true\nDEV_EMAIL=ci@localhost\n' > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/me && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA) and layout, light and dark, desktop and phone
        run: npm run test:a11y
