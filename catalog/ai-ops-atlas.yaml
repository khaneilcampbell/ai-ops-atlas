  # Building operators (2026-11-12): one scheduled, model-free check per building that reports to
  # the live feed. Its report is what turns the Data Intelligence Center green (catalog/workspace/workspace.yaml `agents`). GET requests only.
  - id: dataset-census
    name: Dataset Census
    purpose: Counts the data Atlas reads every 3 hours. Parses the catalog (projects, agents, repositories) and checks each catalog repository on GitHub for its last push, then reports how many are fresh or stale to the live feed for the Data Intelligence Center.
    framework: GitHub Actions (Python, standard library)
    owned_by: atlas-health-monitor            # owning agent, added at Khaneil's request 2026-11-13
    runtime: GitHub-hosted runner
    status: active
    trigger: Every 3 hours, or by hand
    source: ops/building-agents/agents.py
    observe:
      agent_feed: true
    alerts:
      failures: true
      report_within: 7h
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: public repository metadata read'
      - 'ATLAS_FEED_TOKEN: add-only reports to /api/hooks/agents'
    registry:
      title: "Atlas · Data Freshness Count"
      category: data
      subcategory: Data inventory
      classification:
        type: D
        confidence: verified
        evidence: ops/building-agents/agents.py census; no AI model
      mission:
        problem: Atlas is only as current as the catalog and repositories it reads; stale data should be visible.
        outcomes:
          - The Data Intelligence Center shows how many catalog repositories are fresh or stale
          - Counts refresh every 3 hours
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks:
          - Parse the catalog projects, agents and repositories
          - Read each repository's last push
          - Report fresh and stale counts to the live feed
        tools:
          - GitHub Actions
          - Python standard library
          - Atlas live feed
        inputs:
          - catalog/*.yaml
          - GitHub repository metadata
        outputs:
          - Live feed report for the Data Intelligence Center
        dependencies:
          - catalog/*.yaml on main
          - GitHub repository metadata
          - Atlas live feed
        limitations:
          - Every 3 hours, so counts can lag a merge
          - Counts what the catalog says; it does not prove an agent is running
          - No AI model, so it cannot judge content; it only follows its fixed rules
      goals:
        objective: The Data Intelligence Center shows how many catalog repositories are fresh or stale
        review_frequency: Monthly
        kpis:
          - name: Run success rate
            kind: reliability
            target: At least 95% of runs succeed
            target_value: 95
            direction: min
            basis: A failed check leaves its building's status stale
            measure: run_success_rate
          - name: Report freshness
            kind: reliability
            target: A report at least every 3 hours
            basis: Cron 10 */3 * * * in building-agents.yml
      execution:
        trigger_type: scheduled
        environment: GitHub-hosted runner
      governance:
        autonomy: 1
        autonomy_note: Reads and reports only.
        risk: low
        credential_owner: Khaneil (ATLAS_FEED_TOKEN repository secret; GITHUB_TOKEN is per run)
      cost:
        budget: No model calls. GitHub Actions minutes on a public repository.

      docs:
        technical: .github/workflows/building-agents.yml
        runbook: docs/runbooks/ai-ops-atlas.md#building-operators
        last_review: 2026-11-17
  - id: atlas-data-inventory
    name: Atlas Data Inventory
    purpose: >-
      Keeps one organized list of everything on the Atlas map: every building (active, planned,
      retired or a vacant lot), which agents work in which building, and the cars, trucks, planes,
      boats, trains and people. After every merge a GitHub Action writes atlas-inventory.json to the
      atlas-inventory branch; every morning an n8n workflow reads it and rewrites the Buildings,
      Agents by Building, Map Objects and Inventory Summary tabs of the Atlas Agent Registry sheet.
    framework: n8n + GitHub Actions (Node, no model)
    owned_by: atlas-health-monitor            # owning agent, added at Khaneil's request 2026-11-13
    runtime: n8n Cloud
    status: active
    trigger: Daily at 7:20am New York time (n8n, published 2026-11-13), after the Map inventory GitHub Action writes atlas-inventory.json on each merge
    source: src/inventory/mapInventory.ts
    last_run: 2026-11-16T12:00:31Z
    history:
      - at: 2026-11-17
        event: 'At Khaneil''s OK: moved to 7:20am, a 30 second pause before the Map Objects rewrite, and up to 5 retries on each sheet write'
      - at: 2026-11-16
        event: 'Daily run failed at Write Map Objects: Google Sheets write quota per minute exceeded (n8n exec 730); Flow Error Alerts emailed ops'
      - at: 2026-11-13
        event: Published in n8n (version "Settings and groups"); daily schedule live
      - at: 2026-11-13
        event: Designed with Khaneil; placed in the Data Intelligence Center beside Dataset Census
    links:
      - label: n8n workflow
        url: https://khancam15.app.n8n.cloud/workflow/Hua0wdGB5WSDjSGB
      - label: Registry sheet
        url: https://docs.google.com/spreadsheets/d/1OcCD-k4ob_9lwpiQN3CazE7mkgQz0ExCzqLtHXrPAQA/edit
    permissions:
      - 'GitHub Actions token: pushes atlas-inventory.json to the atlas-inventory branch only'
      - 'GitHub: public read of atlas-inventory.json, no key'
      - 'Google Sheets: writes the inventory tabs of the Atlas Agent Registry sheet only'
    registry:
      title: "Atlas · Map Inventory Sheet"
      category: data
      subcategory: Data inventory
      classification:
        type: D
        confidence: verified
        evidence: src/inventory/mapInventory.ts reads the catalog and the map's own plans; the n8n workflow copies rows with no AI model
      mission:
        problem: Nobody had one list of everything on the Atlas map (buildings, agents per building, vehicles and people), so drift went unnoticed.
        outcomes:
          - The registry sheet's inventory tabs match main every morning
          - Retired buildings and vacant lots stay listed
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks:
          - Write atlas-inventory.json after each merge (GitHub Action)
          - Read it and the Registry tab every morning
          - Rewrite the Buildings, Agents by Building, Map Objects and Inventory Summary tabs
        tools:
          - GitHub Actions
          - Scheduled workflow
          - Google Sheets
        inputs:
          - atlas-inventory.json on the atlas-inventory branch
          - Registry tab of the Atlas Agent Registry sheet
        outputs:
          - Buildings, Agents by Building, Map Objects and Inventory Summary tabs
        dependencies:
          - Map inventory GitHub Action (atlas-inventory.json)
          - Atlas Agent Registry Google Sheet
          - agent-registry-sync
        limitations:
          - Google Sheets allows only so many writes per minute; it pauses 30 seconds and retries up to 5 times
          - Daily, so the sheet can lag a merge by up to a day
          - Successful runs are not saved in n8n, so only failures show there
      goals:
        objective: Keep the map inventory in the registry sheet current every day.
        review_frequency: Monthly
        kpis:
          - name: Run success rate
            kind: reliability
            target: At least 95% of runs succeed
            target_value: 95
            direction: min
            basis: A failed run leaves yesterday's inventory in the sheet
          - name: Inventory age
            kind: reliability
            target: Sheet tabs no more than 1 day behind main
            basis: Daily 7am schedule; the GitHub Action runs on every merge
      execution:
        trigger_type: scheduled
        environment: n8n
      governance:
        autonomy: 1
        autonomy_note: Reads and reports only.
        risk: low
        credential_owner: Khaneil (n8n Google Sheets credential; GitHub Actions token per run)
      cost:
        budget: No model calls. About 30 n8n runs a month and a few GitHub Actions minutes per merge.
      docs:
        runbook: docs/runbooks/ai-ops-atlas.md#atlas-data-inventory
        known_issues:
          - 2026-11-16 run hit the Google Sheets write-per-minute quota at Write Map Objects (fixed 2026-11-17 with a later start, a pause and retries)
          - Successful runs are not saved in n8n, so only failures show in its Executions
        improvements:
          - Save successful runs, or report each run to the Atlas feed, so Atlas can show its last success
        last_review: 2026-11-17

