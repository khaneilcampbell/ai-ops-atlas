# AI Ops Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: ai-ops-atlas
  name: AI Ops Atlas
  summary: This app. A read-only desktop command center for agents, projects and repositories.
  status: active
  repository: khaneilcampbell/ai-ops-atlas
  tags: [tauri, react, dashboard]

agents:
  - id: atlas-ci
    name: Atlas CI
    purpose: Runs frontend and Rust tests, and builds the macOS app on request.
    framework: GitHub Actions
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual
    source: .github/workflows/ci.yml
    observe:
      github_workflow: ci.yml
    last_run: null
    registry:
      title: Atlas Continuous Integration
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/ci.yml runs lint, tests, Rust checks and dependency audits; no AI model
      mission:
        problem: Keeps main releasable now that branch protection requires green checks.
        outcomes: [Every pull request is linted, tested and audited before merge]
        beneficiaries: [KC, Atlas contributors]
      responsibilities:
        tasks: [Lint and test the frontend, Build the web bundle, "Rust fmt, clippy and tests", npm and cargo dependency audits, Optional macOS app bundle on manual dispatch]
        tools: [GitHub Actions, npm, cargo]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request, macOS app artifact when requested]
      goals:
        objective: Block merges that break the app.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        risk: low
        audit_log: GitHub Actions run history
        credential_owner: KC (GitHub repository settings)

  - id: repo-intelligence
    name: Repository Intelligence Agent
    purpose: Reads one selected repository from GitHub (read-only) and asks Claude for a structured health report with verified facts kept separate from AI recommendations.
    framework: Claude API (Messages, structured output)
    model: claude-sonnet-5-5 by default; haiku-5-5 quick, opus-5-5 deep
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Manual from a repository's panel; optional schedule, off by default
    source: src-tauri/src/intel/mod.rs
    observe:
      atlas_intel: true
    last_run: null
    registry:
      title: Repository Intelligence Analyst
      category: data
      subcategory: Repository intelligence
      classification:
        type: A
        confidence: verified
        evidence: src-tauri/src/intel sends collected repository facts to Claude and validates a structured report
      mission:
        problem: Repository health is spread across commits, CI, issues and alerts; this condenses it for one repository at a time.
        outcomes: [A health report with verified facts kept separate from AI recommendations]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Collect repository facts from GitHub read-only, Ask Claude for a structured assessment, Validate citations and drop ungrounded claims]
        tools: [GitHub REST API (read-only), Anthropic Messages API]
        inputs: [One selected repository, GitHub token from Keychain, Anthropic API key from Keychain]
        outputs: [Saved report shown in the Intel view]
        limitations: [Reads one repository per run, Sends repository data to Anthropic when run]
      goals:
        objective: Accurate, grounded repository reports within the spending limits.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from the app's run log
          - name: Average run duration
            kind: quality
            measure: avg_duration_minutes
            basis: Observed from the app's run log
          - name: Spend this month
            kind: cost
            target: Within the monthly budget set in Intel settings
            measure: month_spend_usd
            basis: Budget and spend come from the app's settings and run log
      execution:
        trigger_type: manual
        schedule: Optional, off by default; runs only while the app is open
        environment: Inside the desktop app (Rust side)
        stages: [Collect facts, Estimate cost and check budget, Call Claude, Validate output, Save report]
      governance:
        autonomy: 1
        autonomy_note: Writes nothing to GitHub; produces recommendations only.
        data_sensitivity: internal
        approval: Each run is started by KC, or by a schedule KC consented to
        credential_owner: KC (macOS Keychain)
        risk: low
        audit_log: Per-run trace in the app's run log
      cost:
        budget: Per-run and monthly limits in Intel settings
      docs:
        technical: docs/repository-intelligence.md
