# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: ai-ops-atlas
  name: Atlas Command Center
  organization: Atlas
  former_names: [Atlas HQ]
  summary: This app. A desktop command center for agents, projects and repositories. Read-only, except one approval-required action that is off by default.
  status: active
  repository: khaneilcampbell/ai-ops-atlas
  tags: [tauri, react, dashboard]
  district: ai-operations
  module: atlas-command-center

agents:
  - id: atlas-ci
    name: Atlas CI
    purpose: Runs frontend and Rust tests and dependency audits on every pull request and push. Validated pushes to main build the macOS app; Khaneil approves protected signing before a separate job publishes the update.
    framework: GitHub Actions
    owned_by: atlas-release-manager            # owning agent, added at Khaneil's request 2026-11-13
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual; the dependency audit also runs daily on main
    source: .github/workflows/ci.yml
    observe:
      github_workflow: ci.yml
    links:
      - label: 'GitHub workflow: Advisory watch (daily dependency audit on main)'
        url: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/.github/workflows/advisory-watch.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read for the test and audit jobs'
      - 'GITHUB_TOKEN: contents write only in the artifact-only publishing job, to publish the main-build release'
      - 'Protected macos-signing environment only: TAURI_SIGNING_PRIVATE_KEY, MACOS_SIGNING_CERT, MACOS_SIGNING_CERT_PASSWORD'
    registry:
      title: "Atlas · Test and Release Build"
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/ci.yml runs lint, tests, Rust checks and dependency audits; no AI model
      mission:
        problem: Keeps main releasable now that branch protection requires green checks.
        outcomes: ["Every pull request is linted, tested and audited before merge"]
        beneficiaries: [Khaneil, Atlas contributors]
      responsibilities:
        tasks:
          - Lint and test the frontend
          - Build the web bundle
          - Rust fmt, clippy and tests
          - npm and cargo dependency audits
          - Build validated main changes, request protected signing approval, then publish
        tools: [GitHub Actions, npm, cargo]
        inputs: [Pushes and pull requests]
        outputs:
          - Check results on the pull request
          - Signed macOS app on main-build after approval; unsigned artifact for manual branch builds
        dependencies:
          - GitHub Actions runners
          - TAURI_SIGNING_PRIVATE_KEY repository secret
          - Protected release environment (Khaneil approves)
        limitations:
          - Pull requests do not build the macOS app; that runs only on main or by hand
          - A signed update ships only after Khaneil approves the release environment
          - Cannot judge whether a change looks right; visual checks cover that separately
      goals:
        objective: Block merges that break the app.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; target proposed 2026-11-17 from production history, Khaneil can change it
            target: At least 90% of runs succeed
        review_frequency: Monthly
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 2
        data_sensitivity: public
        risk: medium
        audit_log: GitHub Actions run history
        approval: Khaneil approves the macos-signing environment for each main build
        credential_owner: Khaneil (protected GitHub macos-signing environment)
        kill_switch: 'Reject the waiting "Sign validated main build" deployment in the Actions run: nothing is signed or published without that approval. To stop every build, disable the CI workflow in Actions. A bad update is undone by reverting its pull request; never edit latest.json. See docs/runbooks/stop-and-rollback.md#merging-and-signing-in-atlas.'
      docs:
        technical: README.md
        runbook: docs/runbooks/ai-ops-atlas.md#atlas-ci
        known_issues:
          - Signed updates require manual environment approval; older or equal versions are rejected
          - codeql.yml and release.yml also run in this repository but are not in the catalog
        improvements:
          - Add codeql.yml and release.yml to the catalog
          - Agree a run success target for the KPI
        last_review: 2026-10-29

  - id: repo-intelligence
    name: Repository Intelligence Agent
    purpose: Reads one selected repository from GitHub (read-only) and asks Claude for a structured health report with verified facts kept separate from AI recommendations.
    framework: Claude API (Messages, structured output)
    model: claude-sonnet-5-5 by default; haiku-5-5 quick, opus-5-5 deep
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Manual from a repository's panel; optional schedule, off by default
    source: src-tauri/src/intel/mod.rs
    observe:
      atlas_intel: true
    last_run: null
    permissions:
      - 'GitHub REST API: GET only, allowlisted paths, the selected repository only'
      - Anthropic Messages API (key in the macOS Keychain)
      - Reads and writes JSON files in the app data folder
    registry:
      identity:
        display_name: Samuel Asante
        accent: "#C026D3"
        intro: "Pick one repository and I read it from GitHub, read-only, then ask Claude for a health report. Verified facts stay separate from recommendations, and I drop any claim I can't cite. If nothing changed, I reuse the last report."
        voice: "Facts first, then cited recommendations with their confidence."
        appearance: "Ghanaian man in his early 30s, dark skin, short two-strand twists, thin wire-frame glasses, burgundy quarter-zip over a white t-shirt"
        portrait:
          path: agents/repo-intelligence.webp
          model: gpt_image_2_6
          job_id: bfe4e2a7-7f0f-4c9b-9a8e-30704a9f9465
          prompt_version: 2
          generated_at: 2026-11-18
      title: Repository Intelligence Analyst
      category: data
      subcategory: Repository intelligence
      classification:
        type: A
        confidence: verified
        evidence: src-tauri/src/intel sends collected repository facts to Claude and validates a structured report
      mission:
        problem: Repository health is spread across commits, CI, issues and alerts; this condenses it for one repository at a time.
        outcomes: [A health report with verified facts kept separate from AI recommendations]
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Collect repository facts from GitHub read-only, Ask Claude for a structured assessment with its fixed instructions cached, Reuse the last assessment when the repository data is unchanged, Validate citations and drop ungrounded claims]
        tools: [GitHub REST API (read-only), Anthropic Messages API]
        inputs: [One selected repository, GitHub token from Keychain, Anthropic API key from Keychain]
        outputs: [Saved report shown in the Intel view]
        limitations: [Reads one repository per run, Sends repository data to Anthropic when run]
        dependencies:
          - GitHub REST API (read-only token in Keychain)
          - Anthropic API key in Keychain
      goals:
        objective: Accurate, grounded repository reports within the spending limits.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from the app's run log
            target: At least 90% of runs succeed
          - name: Average run duration
            kind: quality
            measure: avg_duration_minutes
            basis: Observed from the app's run log
            target: Under 3 minutes per report
          - name: Spend this month
            kind: cost
            target: Within the monthly budget set in Intel settings
            measure: month_spend_usd
            basis: Budget and spend come from the app's settings and run log
        review_frequency: Monthly
      execution:
        trigger_type: manual
        schedule: Optional, off by default; runs only while the app is open
        environment: Inside the desktop app (Rust side)
        stages: [Collect facts, Estimate cost and check budget, Call Claude, Validate output, Save report]
      governance:
        autonomy: 1
        autonomy_note: Writes nothing to GitHub; produces recommendations only.
        data_sensitivity: internal
        approval: Each run is started by Khaneil, or by a schedule Khaneil consented to
        credential_owner: Khaneil (macOS Keychain)
        risk: low
        audit_log: Per-run trace in the app's run log
      cost:
        budget: Per-run and monthly limits in Intel settings
      docs:
        technical: docs/repository-intelligence.md
        runbook: docs/runbooks/ai-ops-atlas.md#repository-intelligence
        known_issues:
          - The schedule runs only while the app is open
          - Only manifests at the repository root are read, so monorepos get a thinner stack picture
          - Only the latest report per repository is kept, and run history keeps the latest 300 runs
          - Costs are estimates from hand-entered prices; the Anthropic Console has billed figures
        improvements:
          - A launchd worker so scheduled runs happen while the app is closed
          - Batch scheduled runs through the Message Batches API at half price
          - A Rust agent trait so the next agent reuses the queue, budgets and traces
        last_review: 2026-10-28

  - id: atlas-engineering-review
    name: Senior Engineering Reviewer
    purpose: Reviews the whole ecosystem at once (every catalog repository, its CI, dependencies and security settings, and the agents with their autonomy levels) and returns a scorecard, top risks, ranked recommendations and suggested tools. Recommends only.
    framework: Claude API (Messages, structured output)
    model: claude-sonnet-5-5 by default; haiku-5-5 quick, opus-5-5 deep
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Run review button in Intel → Engineering review; optional weekly schedule, off by default
    source: src-tauri/src/intel/review.rs
    observe:
      atlas_intel: true
      atlas_intel_runs: ecosystem
    last_run: null
    permissions: [GitHub read-only (GET through the app's allowlist), Anthropic API key from Keychain]
    registry:
      identity:
        display_name: Margaret Lindqvist
        accent: "#475569"
        intro: "I review the whole ecosystem at once: every catalog repository's CI, dependencies and security settings, and each agent's autonomy, then return a scorecard and ranked recommendations. I recommend only and change nothing."
        voice: "Scorecard and top risks first; direct and ranked."
        appearance: "Swedish woman in her late 50s, fair skin with natural fine lines, short silver pixie cut, tortoiseshell glasses, black fine-knit turtleneck under a grey wool blazer"
        portrait:
          path: agents/atlas-engineering-review.webp
          model: gpt_image_2_6
          job_id: ddf918d0-1502-4812-bfb0-d149395e964e
          prompt_version: 2
          generated_at: 2026-11-18
      title: Senior Engineering Reviewer
      category: engineering
      subcategory: Architecture and security review
      classification:
        type: A
        confidence: verified
        evidence: src-tauri/src/intel/review.rs sends catalog and repository facts to Claude in one request and validates a structured review
      mission:
        problem: Risks and gaps repeat across repositories and agents, and reviewing each repository alone misses the patterns.
        outcomes: [A ranked list of improvements across the ecosystem, with verified facts kept separate from Claude's recommendations]
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Gather facts for every catalog repository, reusing saved Repository Intelligence reports, Check Dependabot config, CODEOWNERS, branch rules and workflow files, Reuse the last review without calling Claude when only daily activity such as commit counts and push dates changed, Ask Claude for one structured review with its instructions and catalog cached, Validate citations and drop invented repositories or agents]
        tools: [GitHub REST API (read-only), Anthropic Messages API]
        inputs: [The Atlas catalog, Saved repository reports, GitHub token from Keychain, Anthropic API key from Keychain]
        outputs: [Saved review shown in Intel → Engineering review]
        limitations: [Recommends only and changes nothing, Reads at most 30 repositories and 6 workflow files each, Sends catalog and repository facts to Anthropic when run]
        dependencies:
          - repo-intelligence
          - GitHub REST API (read-only token in Keychain)
          - Anthropic API key in Keychain
      goals:
        objective: Grounded, proportionate recommendations within the spending limits.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from the app's run log
            target: At least 90% of runs succeed
          - name: Spend this month
            kind: cost
            target: Within the monthly budget shared with Repository Intelligence
            measure: month_spend_usd
            basis: Budget and spend come from the app's settings and run log
        review_frequency: Monthly
      execution:
        trigger_type: manual
        schedule: Optional weekly, off by default; runs only while the app is open
        environment: Inside the desktop app (Rust side)
        stages: [Gather repository facts, Run deterministic checks, Estimate cost and check budget, Call Claude, Validate output, Save review]
      governance:
        autonomy: 1
        autonomy_note: Writes nothing to GitHub or anywhere else; produces recommendations only.
        data_sensitivity: internal
        approval: Each run is started by Khaneil, or by a weekly schedule Khaneil consented to
        credential_owner: Khaneil (macOS Keychain)
        risk: low
        audit_log: Per-run trace in the app's run log
      cost:
        budget: Own per-run cap ($0.60 default) and the shared monthly budget in Intel settings
      docs:
        technical: docs/engineering-review.md
        runbook: docs/runbooks/ai-ops-atlas.md#senior-engineering-reviewer
        known_issues:
          - The schedule runs only while the app is open, using the catalog as it was at the last manual review
          - Reads at most 30 repositories and 6 workflow files each
          - Classic branch protection usually needs admin access, so it often shows as not assessed
        improvements:
          - Run scheduled reviews from the same launchd worker proposed for Repository Intelligence
        last_review: 2026-10-28

  - id: atlas-rerun-failed
    name: Re-run Failed Jobs
    purpose: Re-runs the failed jobs of a failed GitHub Actions run, only on repositories Khaneil has switched on and only after Khaneil approves each run in a native macOS dialog.
    framework: Atlas desktop action (Rust)
    owned_by: atlas-release-manager            # owning agent, added at Khaneil's request 2026-11-13
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Manual button next to a failed run; off by default
    source: src-tauri/src/actions/rerun.rs
    last_run: null
    permissions: [Actions write on repositories selected in the token and in Settings]
    registry:
      title: "Atlas · Re-run Failed CI Jobs"
      category: engineering
      subcategory: CI/CD operations
      classification:
        type: C
        confidence: verified
        evidence: src-tauri/src/actions sends one fixed request (rerun-failed-jobs) after pre-flight checks and native approval; no AI model
      mission:
        problem: Flaky CI failures need a re-run, which otherwise means leaving Atlas for GitHub.
        outcomes: [A failed run can be retried from Atlas with an audit record of who did it and what GitHub answered]
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Re-read the run and refuse if it is unfinished, not failed, re-run already or older than 30 days, Ask for approval in a native dialog, Log the attempt and the result, Send one re-run request with no retries]
        tools: [GitHub REST API (one write endpoint), macOS Keychain, macOS dialog]
        inputs: [A failed run Khaneil chose, Actions token from Keychain, Repository list in Settings]
        outputs: [A new run attempt on GitHub, Audit records in the Activity Center]
        limitations: [Off by default, Desktop only, At most one re-run per run every 10 minutes and 10 an hour]
        dependencies:
          - Actions token in Keychain
          - Repository list in Settings
      goals:
        objective: Retry flaky failures safely, with every write approved and recorded.
        review_frequency: Quarterly
        kpis:
          - name: Approved before sending
            kind: quality
            target: 100% of re-runs approved in the macOS dialog
            basis: Every write is approved and logged
          - name: Refusals explained
            kind: quality
            target: Every refused re-run shows its reason in the Activity Center
            basis: Nothing is sent when a rule refuses
      execution:
        trigger_type: manual
        environment: Inside the desktop app (Rust side)
        stages: [Check switch and token, Re-read the run, Native approval, Audit, Send once, Audit result]
      governance:
        autonomy: 2
        autonomy_note: Prepares the re-run; nothing is sent until Khaneil approves that specific run.
        data_sensitivity: internal
        approval: Native macOS confirmation for every re-run
        credential_owner: Khaneil (separate fine-grained token in the macOS Keychain)
        risk: medium
        audit_log: audit.jsonl in the app data folder, shown in the Activity Center
        kill_switch: 'Switch Re-run failed jobs off in Atlas Settings (it is off by default).'
        caps: 'One re-run per run every 10 minutes and 10 an hour, each approved in a macOS dialog.'
      docs:
        technical: docs/actions.md
        runbook: docs/runbooks/ai-ops-atlas.md#re-run-failed-jobs
        known_issues:
          - No KPI is defined yet
          - Re-running a main run of ai-ops-atlas ci.yml publishes a release, so that repository should not be ticked
        improvements:
          - Measure approved re-runs that ended green, from audit.jsonl
        last_review: 2026-10-28

  - id: atlas-merge-pr
    name: Merge Pull Request
    purpose: Merges a pull request from Atlas only when GitHub reports it ready (open, not a draft, no changes requested, mergeable and clean, every required check green), on repositories Khaneil has switched on, after Khaneil approves it in a native macOS dialog and with Touch ID.
    framework: Atlas desktop action (Rust)
    owned_by: atlas-release-manager            # owning agent, added at Khaneil's request 2026-11-13
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Manual Merge button in a repository's PRs tab; off by default
    source: src-tauri/src/actions/merge.rs
    last_run: null
    permissions: [Pull requests and Contents write on one repository per token, for repositories ticked in Settings]
    registry:
      title: "Atlas · Merge Approved Pull Request"
      category: engineering
      subcategory: Code review and release
      classification:
        type: C
        confidence: verified
        evidence: src-tauri/src/actions/merge.rs sends one fixed request (squash merge pinned to the approved head commit) after read-only readiness checks, native approval and Touch ID; no AI model
      mission:
        problem: Merging a reviewed, green pull request otherwise means leaving Atlas for GitHub.
        outcomes: [A ready pull request can be merged from Atlas with an audit record of who merged what and what GitHub answered]
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Re-read the pull request, reviews, checks and base branch rules and refuse unless GitHub reports it ready, Ask for approval in a native dialog, Ask for Touch ID, Log the attempt and the result, Send one squash merge pinned to the head commit with no retries]
        tools: [GitHub REST API (one write endpoint), macOS Keychain, macOS dialog, Touch ID]
        inputs: [An open pull request Khaneil chose, That repository's merge token from Keychain, Repository list in Settings]
        outputs: [A merged pull request on GitHub, Audit records in the Activity Center]
        limitations: [Off by default, Desktop only, Never on the website or iPhone, No override of checks or reviews, Never proposed or approved automatically, At most one merge per pull request every 10 minutes and 5 an hour]
        dependencies:
          - Per-repository merge token in Keychain
          - Touch ID
          - github-merge-flow
      goals:
        objective: Merge ready pull requests safely, with every merge approved by Khaneil and recorded.
        review_frequency: Quarterly
        kpis:
          - name: Merges approved
            kind: quality
            target: 100% of merges confirmed in the dialog and with Touch ID
            basis: Merges are irreversible
          - name: Merges of unready pull requests
            kind: quality
            target: Zero
            basis: GitHub must report the pull request ready before anything is sent
      execution:
        trigger_type: manual
        environment: Inside the desktop app (Rust side)
        stages: [Check switch and token, Re-read pull request reviews checks and rules, Native approval, Touch ID, Audit, Send once, Audit result]
      governance:
        autonomy: 2
        autonomy_note: Stays at level 2 permanently. Merges are irreversible, so nothing proposes, queues or approves them; Khaneil presses Merge and confirms every one.
        data_sensitivity: internal
        approval: Native macOS confirmation and Touch ID for every merge
        credential_owner: Khaneil (one fine-grained token per repository in the macOS Keychain)
        kill_switch: 'Untick Merge pull requests in Atlas Settings → Actions (off by default), or untick the repository or remove its merge token there; revoking the token on GitHub also stops it. See docs/runbooks/stop-and-rollback.md#merging-and-signing-in-atlas.'
        risk: high
        audit_log: audit.jsonl in the app data folder, shown in the Activity Center
      docs:
        technical: docs/actions.md
        runbook: docs/runbooks/ai-ops-atlas.md#merge-pull-request
        known_issues:
          - No KPI is defined yet
          - Squash merge only; a repository with squash merging off answers 405
          - A base branch with no required checks is always refused
        improvements:
          - Count merges and refusals by reason from audit.jsonl
        last_review: 2026-10-28

  - id: atlas-executive
    name: Atlas Executive
    purpose: >-
      Central orchestrator in Atlas Headquarters. Takes a goal Khaneil writes in Mission Control, turns it into a checked plan from a fixed template, assigns each task to a registered agent by capability, health, workload and reliability, dispatches outside work through one n8n workflow, and marks the goal complete only after Atlas itself verifies the result. Bounded: at most 8 tasks, 5 open goals, 10 dispatches a day and a $1 default budget per goal; level 4 actions (publish, spend, send, merge, delete) always wait for Khaneil.
    model: None of its own; research tasks use claude-sonnet-5-5 inside the n8n dispatch workflow
    framework: Atlas server engine (Cloudflare Pages Functions + PostgreSQL) + n8n dispatch
    owned_by: agent-operations-lead            # same owner as Atlas Step Runner, the other goal-to-n8n bridge
    runtime: Atlas web site functions; n8n Cloud for dispatched tasks
    status: paused
    trigger: 'Goal from Khaneil in Mission Control, once its n8n workflows are published; both are drafts today (Atlas · Executive Dispatch, Atlas · Executive Schedule every 30 minutes)'
    source: server/executive/engine.ts
    links:
      - label: 'n8n workflow: Atlas · Executive Dispatch (draft, runs dispatched tasks)'
        url: https://khancam15.app.n8n.cloud/workflow/uNF4qBQDwVb37ygb
      - label: 'n8n workflow: Atlas · Executive Schedule (draft, reconciles every 30 minutes)'
        url: https://khancam15.app.n8n.cloud/workflow/J1bzNxcwUTPC9yw9
    last_run: null
    permissions:
      - Create goals, plans and tasks in the Atlas database
      - File approval requests (cannot approve its own)
      - Call the n8n Atlas · Executive Dispatch webhook with the bridge key
    history:
      - at: 2026-11-22
        event: Built. Needs migration 0002 on the Atlas database and the two n8n workflows published before its first real run
    registry:
      title: Central AI Orchestrator
      version: 1.0.0
      tier: central
      category: engineering
      subcategory: Orchestration
      automation_category: intelligence
      classification:
        type: B
        confidence: verified
        evidence: Atlas's own taxonomy makes this AI-assisted, not an AI agent yet. The engine itself is deterministic (template plans, rule-based agent choice, code-checked results); the only model call is the research step inside n8n Atlas · Executive Dispatch. Server engine in server/executive/, state in atlas.exec_* tables (db/migrations/0002_executive.sql), tests in server/executive/executive.test.ts
      mission:
        problem: Goals need several agents working in order, and nothing tied a goal to the agents, runs, costs and checked results behind it.
        outcomes:
          - Each goal has a checked plan, assigned agents and a visible state
          - A goal completes only when Atlas verified its result
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks: [Check goals and plans, Assign registered agents, Dispatch approved work to n8n, Verify results, Report blocked work and costs]
        tools: [Atlas database, Agent Registry]
        dependencies: [benjaire-product-lab-research]
        outputs: [Goal timeline, Verified opportunity report, Approval requests]
        inputs:
          - Goals Khaneil writes in Mission Control
          - Agent Registry on main
          - Results posted back by n8n
        limitations:
          - Plans come from fixed templates only; today one template, an opportunity report
          - Never publishes, spends, sends, merges or deletes on its own
          - Stops dispatching while the emergency stop is on
      goals:
        objective: Turn a goal into verified results without skipping a check or going over budget.
        review_frequency: Monthly
        kpis:
          - name: Goals completed with verified results
            kind: quality
            target: Every completed goal passed verification
            basis: The engine refuses completion without it
          - name: Budget overruns
            kind: cost
            target: Zero goals over budget
            basis: Budget is reserved before each dispatch
      execution:
        trigger_type: manual
        environment: Atlas web site functions and n8n Cloud
        stages: [Validate goal, Plan from template, Check plan, Create tasks, Assign agents, Authorize, Dispatch, Monitor, Verify, Complete]
      governance:
        autonomy: 2
        autonomy_note: Level 2 Safe Execution by default. Budgeted research runs without asking; anything that publishes, spends or changes an outside system waits for Khaneil's approval.
        risk: medium
        credential_owner: Khaneil (n8n bridge keys, Anthropic key in n8n)
      cost:
        budget: $1 per goal by default (at most $5), 10 dispatches a day, one task per agent at a time.
      docs:
        technical: docs/executive-agent.md
        runbook: docs/runbooks/ai-ops-atlas.md#atlas-executive
        last_review: 2026-11-22
  - id: atlas-production-coordinator
    name: Atlas Production Coordinator
    purpose: >-
      Owns the road from a merged change to Khaneil's installed update. It runs GitHub · Pull Request Merge Lanes, which sorts every open pull request into one lane and names the next move, and works with the Release Coordinator, the n8n chat agent Khaneil asks about releases. On request it prioritizes production issues, finds review and CI bottlenecks and recommends the shortest safe path, reusing valid check results and keeping web deployment apart from the Mac update. Never bypasses required checks, merges, or deploys; Khaneil still says "merge". Also coordinates a manual supplied-draft handoff through quality review, version-bound approval and local release preparation; that hosted workflow is fixture-only.
    office_floor: 3
    model: None of its own; Merge Flow keeps its own Claude brief and cap, manual reviews use Claude Code on request
    framework: Atlas owning agent + manual Python handoff + Claude Code review on request
    runtime: Local deterministic runner; manually dispatched fixture on GitHub Actions
    status: idle
    trigger: Explicit user request only; no schedule
    source: ops/benjaire-production/team.py
    observe:
      github_workflow: benjaire-production.yml
    last_run: null
    permissions: [Read supplied evidence, Produce a review report]
    history:
      - at: 2026-11-14
        event: Took over Merge Flow and works with the Release Coordinator, at Khaneil's request. System Improvements, Reliability Reviewer, Performance Reviewer, AI UI Improvement Designer and GitHub Steward were deleted the same day
    registry:
      identity:
        display_name: Tomás Herrera
        accent: "#D97706"
        intro: "I own the road from a merged change to your installed update. GitHub · Pull Request Merge Lanes sorts every open pull request into a lane, and on request I name the next safe step. I run only when you ask and can't merge or release."
        voice: "One recommended next step per lane, in priority order."
        appearance: "Mexican man in his late 30s, light olive skin, wavy dark brown hair, rimless glasses, light stubble, olive overshirt over a grey t-shirt"
