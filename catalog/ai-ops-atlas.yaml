# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# AI Ops Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: ai-ops-atlas
  name: Atlas HQ
  summary: This app. A desktop command center for agents, projects and repositories. Read-only, except one approval-required action that is off by default.
  status: active
  repository: khaneilcampbell/ai-ops-atlas
  tags: [tauri, react, dashboard]
  district: ai-operations

agents:
  - id: atlas-ci
    name: Atlas CI
    purpose: Runs frontend and Rust tests and dependency audits on every pull request and push. Validated pushes to main build the macOS app; KC approves protected signing before a separate job publishes the update.
    framework: GitHub Actions
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual
    source: .github/workflows/ci.yml
    observe:
      github_workflow: ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read for the test and audit jobs'
      - 'GITHUB_TOKEN: contents write only in the artifact-only publishing job, to publish the main-build release'
      - 'Protected macos-signing environment only: TAURI_SIGNING_PRIVATE_KEY, MACOS_SIGNING_CERT, MACOS_SIGNING_CERT_PASSWORD'
    registry:
      title: Build and Release Engineer
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/ci.yml runs lint, tests, Rust checks and dependency audits; no AI model
      mission:
        problem: Keeps main releasable now that branch protection requires green checks.
        outcomes: ["Every pull request is linted, tested and audited before merge"]
        beneficiaries: [KC, Atlas contributors]
      responsibilities:
        tasks:
          - Lint and test the frontend
          - Build the web bundle
          - Rust fmt, clippy and tests
          - npm and cargo dependency audits
          - Build validated main changes, request protected signing approval, then publish
        tools: [GitHub Actions, npm, cargo]
        inputs: [Pushes and pull requests]
        outputs:
          - Check results on the pull request
          - Signed macOS app on main-build after approval; unsigned artifact for manual branch builds
      goals:
        objective: Block merges that break the app.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 2
        data_sensitivity: public
        risk: medium
        audit_log: GitHub Actions run history
        approval: KC approves the macos-signing environment for each main build
        credential_owner: KC (protected GitHub macos-signing environment)
      docs:
        technical: README.md
        runbook: docs/runbooks/ai-ops-atlas.md#atlas-ci
        known_issues:
          - Signed updates require manual environment approval; older or equal versions are rejected
          - codeql.yml and release.yml also run in this repository but are not in the catalog
        improvements:
          - Add codeql.yml and release.yml to the catalog
          - Agree a run success target for the KPI
        last_review: 2026-10-29

  - id: repo-intelligence
    name: Repository Intelligence Agent
    purpose: Reads one selected repository from GitHub (read-only) and asks Claude for a structured health report with verified facts kept separate from AI recommendations.
    framework: Claude API (Messages, structured output)
    model: claude-sonnet-5-5 by default; haiku-5-5 quick, opus-5-5 deep
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Manual from a repository's panel; optional schedule, off by default
    source: src-tauri/src/intel/mod.rs
    observe:
      atlas_intel: true
    last_run: null
    permissions:
      - 'GitHub REST API: GET only, allowlisted paths, the selected repository only'
      - Anthropic Messages API (key in the macOS Keychain)
      - Reads and writes JSON files in the app data folder
    registry:
      title: Repository Intelligence Analyst
      category: data
      subcategory: Repository intelligence
      classification:
        type: A
        confidence: verified
        evidence: src-tauri/src/intel sends collected repository facts to Claude and validates a structured report
      mission:
        problem: Repository health is spread across commits, CI, issues and alerts; this condenses it for one repository at a time.
        outcomes: [A health report with verified facts kept separate from AI recommendations]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Collect repository facts from GitHub read-only, Ask Claude for a structured assessment, Validate citations and drop ungrounded claims]
        tools: [GitHub REST API (read-only), Anthropic Messages API]
        inputs: [One selected repository, GitHub token from Keychain, Anthropic API key from Keychain]
        outputs: [Saved report shown in the Intel view]
        limitations: [Reads one repository per run, Sends repository data to Anthropic when run]
      goals:
        objective: Accurate, grounded repository reports within the spending limits.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from the app's run log
          - name: Average run duration
            kind: quality
            measure: avg_duration_minutes
            basis: Observed from the app's run log
          - name: Spend this month
            kind: cost
            target: Within the monthly budget set in Intel settings
            measure: month_spend_usd
            basis: Budget and spend come from the app's settings and run log
      execution:
        trigger_type: manual
        schedule: Optional, off by default; runs only while the app is open
        environment: Inside the desktop app (Rust side)
        stages: [Collect facts, Estimate cost and check budget, Call Claude, Validate output, Save report]
      governance:
        autonomy: 1
        autonomy_note: Writes nothing to GitHub; produces recommendations only.
        data_sensitivity: internal
        approval: Each run is started by KC, or by a schedule KC consented to
        credential_owner: KC (macOS Keychain)
        risk: low
        audit_log: Per-run trace in the app's run log
      cost:
        budget: Per-run and monthly limits in Intel settings
      docs:
        technical: docs/repository-intelligence.md
        runbook: docs/runbooks/ai-ops-atlas.md#repository-intelligence
        known_issues:
          - The schedule runs only while the app is open
          - Only manifests at the repository root are read, so monorepos get a thinner stack picture
          - Only the latest report per repository is kept, and run history keeps the latest 300 runs
          - Costs are estimates from hand-entered prices; the Anthropic Console has billed figures
        improvements:
          - A launchd worker so scheduled runs happen while the app is closed
          - Batch scheduled runs through the Message Batches API at half price
          - A Rust agent trait so the next agent reuses the queue, budgets and traces
        last_review: 2026-10-28

  - id: atlas-engineering-review
    name: Senior Engineering Reviewer
    purpose: Reviews the whole ecosystem at once (every catalog repository, its CI, dependencies and security settings, and the agents with their autonomy levels) and returns a scorecard, top risks, ranked recommendations and suggested tools. Recommends only.
    framework: Claude API (Messages, structured output)
    model: claude-sonnet-5-5 by default; haiku-5-5 quick, opus-5-5 deep
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Run review button in Intel → Engineering review; optional weekly schedule, off by default
    source: src-tauri/src/intel/review.rs
    observe:
      atlas_intel: true
      atlas_intel_runs: ecosystem
    last_run: null
    permissions: [GitHub read-only (GET through the app's allowlist), Anthropic API key from Keychain]
    registry:
      title: Senior Engineering Reviewer
      category: engineering
      subcategory: Architecture and security review
      classification:
        type: A
        confidence: verified
        evidence: src-tauri/src/intel/review.rs sends catalog and repository facts to Claude in one request and validates a structured review
      mission:
        problem: Risks and gaps repeat across repositories and agents, and reviewing each repository alone misses the patterns.
        outcomes: [A ranked list of improvements across the ecosystem, with verified facts kept separate from Claude's recommendations]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Gather facts for every catalog repository, reusing saved Repository Intelligence reports, Check Dependabot config, CODEOWNERS, branch rules and workflow files, Ask Claude for one structured review, Validate citations and drop invented repositories or agents]
        tools: [GitHub REST API (read-only), Anthropic Messages API]
        inputs: [The Atlas catalog, Saved repository reports, GitHub token from Keychain, Anthropic API key from Keychain]
        outputs: [Saved review shown in Intel → Engineering review]
        limitations: [Recommends only and changes nothing, Reads at most 30 repositories and 6 workflow files each, Sends catalog and repository facts to Anthropic when run]
      goals:
        objective: Grounded, proportionate recommendations within the spending limits.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from the app's run log
          - name: Spend this month
            kind: cost
            target: Within the monthly budget shared with Repository Intelligence
            measure: month_spend_usd
            basis: Budget and spend come from the app's settings and run log
      execution:
        trigger_type: manual
        schedule: Optional weekly, off by default; runs only while the app is open
        environment: Inside the desktop app (Rust side)
        stages: [Gather repository facts, Run deterministic checks, Estimate cost and check budget, Call Claude, Validate output, Save review]
      governance:
        autonomy: 1
        autonomy_note: Writes nothing to GitHub or anywhere else; produces recommendations only.
        data_sensitivity: internal
        approval: Each run is started by KC, or by a weekly schedule KC consented to
        credential_owner: KC (macOS Keychain)
        risk: low
        audit_log: Per-run trace in the app's run log
      cost:
        budget: Own per-run cap ($0.60 default) and the shared monthly budget in Intel settings
      docs:
        technical: docs/engineering-review.md
        runbook: docs/runbooks/ai-ops-atlas.md#senior-engineering-reviewer
        known_issues:
          - The schedule runs only while the app is open, using the catalog as it was at the last manual review
          - Reads at most 30 repositories and 6 workflow files each
          - Classic branch protection usually needs admin access, so it often shows as not assessed
        improvements:
          - Run scheduled reviews from the same launchd worker proposed for Repository Intelligence
        last_review: 2026-10-28

  - id: atlas-rerun-failed
    name: Re-run Failed Jobs
    purpose: Re-runs the failed jobs of a failed GitHub Actions run, only on repositories KC has switched on and only after KC approves each run in a native macOS dialog.
    framework: Atlas desktop action (Rust)
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Manual button next to a failed run; off by default
    source: src-tauri/src/actions/rerun.rs
    last_run: null
    permissions: [Actions write on repositories selected in the token and in Settings]
    registry:
      title: CI Recovery Specialist
      category: engineering
      subcategory: CI/CD operations
      classification:
        type: C
        confidence: verified
        evidence: src-tauri/src/actions sends one fixed request (rerun-failed-jobs) after pre-flight checks and native approval; no AI model
      mission:
        problem: Flaky CI failures need a re-run, which otherwise means leaving Atlas for GitHub.
        outcomes: [A failed run can be retried from Atlas with an audit record of who did it and what GitHub answered]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Re-read the run and refuse if it is unfinished, not failed, re-run already or older than 30 days, Ask for approval in a native dialog, Log the attempt and the result, Send one re-run request with no retries]
        tools: [GitHub REST API (one write endpoint), macOS Keychain, macOS dialog]
        inputs: [A failed run KC chose, Actions token from Keychain, Repository list in Settings]
        outputs: [A new run attempt on GitHub, Audit records in the Activity Center]
        limitations: [Off by default, Desktop only, At most one re-run per run every 10 minutes and 10 an hour]
      goals:
        objective: Retry flaky failures safely, with every write approved and recorded.
      execution:
        trigger_type: manual
        environment: Inside the desktop app (Rust side)
        stages: [Check switch and token, Re-read the run, Native approval, Audit, Send once, Audit result]
      governance:
        autonomy: 2
        autonomy_note: Prepares the re-run; nothing is sent until KC approves that specific run.
        data_sensitivity: internal
        approval: Native macOS confirmation for every re-run
        credential_owner: KC (separate fine-grained token in the macOS Keychain)
        risk: medium
        audit_log: audit.jsonl in the app data folder, shown in the Activity Center
      docs:
        technical: docs/actions.md
        runbook: docs/runbooks/ai-ops-atlas.md#re-run-failed-jobs
        known_issues:
          - No KPI is defined yet
          - Re-running a main run of ai-ops-atlas ci.yml publishes a release, so that repository should not be ticked
        improvements:
          - Measure approved re-runs that ended green, from audit.jsonl
        last_review: 2026-10-28

  - id: atlas-merge-pr
    name: Merge Pull Request
    purpose: Merges a pull request from Atlas only when GitHub reports it ready (open, not a draft, no changes requested, mergeable and clean, every required check green), on repositories KC has switched on, after KC approves it in a native macOS dialog and with Touch ID.
    framework: Atlas desktop action (Rust)
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Manual Merge button in a repository's PRs tab; off by default
    source: src-tauri/src/actions/merge.rs
    last_run: null
    permissions: [Pull requests and Contents write on one repository per token, for repositories ticked in Settings]
    registry:
      title: Pull Request Integration Coordinator
      category: engineering
      subcategory: Code review and release
      classification:
        type: C
        confidence: verified
        evidence: src-tauri/src/actions/merge.rs sends one fixed request (squash merge pinned to the approved head commit) after read-only readiness checks, native approval and Touch ID; no AI model
      mission:
        problem: Merging a reviewed, green pull request otherwise means leaving Atlas for GitHub.
        outcomes: [A ready pull request can be merged from Atlas with an audit record of who merged what and what GitHub answered]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Re-read the pull request, reviews, checks and base branch rules and refuse unless GitHub reports it ready, Ask for approval in a native dialog, Ask for Touch ID, Log the attempt and the result, Send one squash merge pinned to the head commit with no retries]
        tools: [GitHub REST API (one write endpoint), macOS Keychain, macOS dialog, Touch ID]
        inputs: [An open pull request KC chose, That repository's merge token from Keychain, Repository list in Settings]
        outputs: [A merged pull request on GitHub, Audit records in the Activity Center]
        limitations: [Off by default, Desktop only, Never on the website or iPhone, No override of checks or reviews, Never proposed or approved automatically, At most one merge per pull request every 10 minutes and 5 an hour]
      goals:
        objective: Merge ready pull requests safely, with every merge approved by KC and recorded.
      execution:
        trigger_type: manual
        environment: Inside the desktop app (Rust side)
        stages: [Check switch and token, Re-read pull request reviews checks and rules, Native approval, Touch ID, Audit, Send once, Audit result]
      governance:
        autonomy: 2
        autonomy_note: Stays at level 2 permanently. Merges are irreversible, so nothing proposes, queues or approves them; KC presses Merge and confirms every one.
        data_sensitivity: internal
        approval: Native macOS confirmation and Touch ID for every merge
        credential_owner: KC (one fine-grained token per repository in the macOS Keychain)
        risk: high
        audit_log: audit.jsonl in the app data folder, shown in the Activity Center
      docs:
        technical: docs/actions.md
        runbook: docs/runbooks/ai-ops-atlas.md#merge-pull-request
        known_issues:
          - No KPI is defined yet
          - Squash merge only; a repository with squash merging off answers 405
          - A base branch with no required checks is always refused
        improvements:
          - Count merges and refusals by reason from audit.jsonl
        last_review: 2026-10-28

  - id: atlas-github-steward
    name: GitHub Steward
    purpose: "GitHub Steward: Collects bounded read-only observations for AI Ops Atlas about CI, security alert counts and maintenance files. This is a deterministic read-only workflow with optional daily checks while Atlas is open; AI reasoning is not enabled."
    framework: Atlas read-only workflow
    runtime: Inside the desktop app (Rust side)
    status: idle
    trigger: Check now in Intel → GitHub Steward; optional daily schedule while Atlas is open
    source: src-tauri/src/steward/check.rs
    last_run: null
    permissions:
      - Existing Atlas GitHub connection, GET only
      - Saves at most 30 observation summaries in device-local storage
    registry:
      title: Repository Maintenance Analyst
      category: engineering
      subcategory: Repository operations
      classification:
        type: C
        confidence: verified
        evidence: src/steward/check.ts implements a bounded deterministic GET-only check; no AI model calls
      mission:
        problem: Atlas needs one place to check its own CI and maintenance signals without granting a new agent write access.
        outcomes: [Evidence-linked observations, Explicit unavailable checks, Bounded local run history]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Read repository and commit metadata, Sample default-branch CI, Count dependency and code scanning alerts, Check maintenance file presence]
        tools: [Atlas read-only GitHub transport]
        inputs: [Manual or daily check request, Existing GitHub read credentials when available]
        outputs: [Observation summaries in Intel → GitHub Steward]
        limitations: [One fixed repository, No model reasoning, No execution while Atlas is closed, Alert access requires appropriate read permissions, No remote writes]
      goals:
        objective: Make repository observations reviewable while preserving approval boundaries.
      execution:
        trigger_type: scheduled
        schedule: Optional daily at the selected device time while Atlas is open; off in new installations
        environment: Atlas Intel view
        stages: [Check pause state, Read bounded GitHub evidence, Classify observations and unavailable checks, Save local summary]
      governance:
        autonomy: 1
        autonomy_note: Read-only observation; manual or opt-in daily checks. No code execution, remediation or paid model calls.
        data_sensitivity: internal
        approval: KC starts a check or enables the daily schedule; repository changes are not supported
        credential_owner: KC (existing Atlas connection)
        risk: low
        audit_log: Latest 30 summaries in local storage; not immutable and not connected to registry telemetry
      cost:
        budget: No model spending; GitHub request limits apply
      docs:
        technical: docs/github-steward.md
        runbook: docs/github-steward.md
        known_issues:
          - Scope and limits are compiled into the UI collector; the CLI JSON policy is separate
          - Shared locking and persisted daily claims cover same-origin windows only; other devices and standalone collectors are independent
          - Run history is device-local and is not yet surfaced as live registry telemetry
          - Documentation quality, uptime, branch protections, billing and agent permissions are not assessed
        last_review: 2026-10-28

  - id: atlas-system-improvements
    name: Atlas System Improvements
    model: Automatic reports use no model; manual reviews use an explicitly selected Codex model
    purpose: Produces bounded reports about main-branch CI failures, floor-renderer stability risks, and source maintenance hotspots. Reuses existing CI evidence with no automatic AI model calls and never changes code. Manual Codex reviews are available on request from the OpenAI building, Floor 4, Suite 401.
    workplace: {building: OpenAI, floor: 4, room: "401"}
    framework: GitHub Actions + Codex (manual)
    runtime: GitHub-hosted Python reports; local Codex CLI for manual reviews
    status: idle
    trigger: After main-branch push CI completes, or manually from GitHub Actions on main
    source: ops/system-improvements/report.py
    observe:
      github_workflow: system-improvements.yml
    last_run: null
    permissions: [Repository contents read, Workflow runs read, Writes only the current run summary and report artifact, Manual Codex reads supplied source excerpts only]
    registry:
      title: AI Production Improvement Analyst
      version: 1.1.0
      tier: specialized
      category: engineering
      subcategory: Continuous improvement
      automation_category: maintenance
      classification:
        type: B
        confidence: verified
        evidence: Automatic reporting uses fixed checks; ops/system-improvements/codex_review.py adds a separately requested, read-only Codex review. Manual review has not been run.
      mission:
        problem: Atlas needs reviewable system improvement candidates without recurring model usage or repeated full builds.
        outcomes: [Prioritized evidence-linked improvement candidates, Explicit gaps in coverage, Zero automatic model calls]
        beneficiaries: [KC, Atlas maintainers]
      responsibilities:
        tasks: [Sample recent main-branch CI evidence, Check the assessed commit's status, Flag floor-dependent renderer remount patterns, Identify large source modules as refactoring candidates, Publish a compact report]
        tools: [Python standard library, GitHub read-only REST API, GitHub Actions summary and artifact]
        inputs: [Completed main-branch CI push run or manual request, Exact assessed commit]
        outputs: [Markdown run summary, JSON and Markdown report artifact retained 14 days]
        limitations: [At most two GitHub GET requests with no retries, At most 300 source files and 4 MiB of source, At most eight report findings, Manual Codex review uses an explicitly selected model and a two-minute timeout with no retries, No automatic AI calls or code changes, Not a security audit or visual correctness check]
      goals:
        objective: Surface small evidence-backed improvements while minimizing usage.
      execution:
        trigger_type: event
        environment: GitHub Actions for automatic reports; local Codex for requested reviews
        stages: [Read bounded source evidence, Read two bounded GitHub endpoints, Rank improvement candidates, Publish report]
      governance:
        autonomy: 1
        autonomy_note: Reports only. Does not open issues or pull requests, rerun CI, merge, deploy, or change credentials.
        data_sensitivity: internal
        approval: A maintainer reviews findings and separately authorizes any implementation.
        credential_owner: GitHub ephemeral GITHUB_TOKEN, contents and actions read only
        risk: low
        audit_log: GitHub Actions run summary and report artifact
      cost:
        budget: Automatic reports use zero model tokens; manual Codex review consumes the selected model allowance only when explicitly started; one runner job capped at three minutes, with GitHub runner and artifact usage governed by the account plan.
      docs:
        technical: docs/system-improvements.md
        runbook: docs/system-improvements.md
        last_review: 2026-10-30
