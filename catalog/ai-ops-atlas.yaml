    framework: GitHub Actions (Python, standard library)
    owned_by: atlas-health-monitor            # owning agent, added at Khaneil's request 2026-11-13
    runtime: GitHub-hosted runner
    status: active
    trigger: Every 30 minutes, or by hand
    source: ops/building-agents/agents.py
    observe:
      agent_feed: true
    alerts:
      failures: true
      report_within: 90m
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: actions read (workflow runs)'
      - 'ATLAS_FEED_TOKEN: add-only reports to /api/hooks/agents'
    registry:
      title: Signal Watch
      category: infrastructure
      subcategory: Observability
      classification:
        type: D
        confidence: verified
        evidence: ops/building-agents/agents.py signals; no AI model
      execution:
        trigger_type: scheduled
        environment: GitHub-hosted runner
      governance:
        autonomy: 1
        autonomy_note: Reads and reports only.
        risk: low
      cost:
        budget: No model calls. GitHub Actions minutes on a public repository.

  - id: dataset-census
    name: Dataset Census
