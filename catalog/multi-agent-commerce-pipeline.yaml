    trigger: Every loop cycle and every 10 minutes while the loop sleeps
    source: scripts/order_delivery.py
    observe:
      agent_feed: true
    # Emails buyers their files. The window assumes the delivery check reports on every pass,
    # even with no orders; confirm that when the pipeline is rehosted.
    alerts:
      failures: true
      report_within: 1h
      not_running: The commerce VPS was removed. The pipeline is off until it moves to the Oracle VM, so silence here is expected.
    last_run: null
    permissions:
      - 'Stripe secret key: reads checkout sessions'
      - SMTP account (EMAIL_FROM, EMAIL_SMTP_PASS)
      - Writes deliveries rows in SQLite
    registry:
