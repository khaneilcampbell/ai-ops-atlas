      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/tests.yml runs compileall, ruff, bash -n and pytest; no AI model
      mission:
        problem: Keeps the pipeline scripts from breaking before they reach the VPS.
        outcomes: ["Every pull request is linted and tested before merge"]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Compile the scripts, Lint with ruff, Check shell scripts parse, Run pytest]
        tools: [GitHub Actions, ruff, pytest]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request]
      goals:
        objective: Block merges that break the pipeline.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        risk: low
        audit_log: GitHub Actions run history
        credential_owner: KC (GitHub repository settings)
