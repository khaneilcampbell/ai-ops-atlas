# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# AI Ops Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: commerce-pipeline
  name: Multi-Agent Commerce Pipeline
  summary: >-
    Autonomous pipeline that researches a niche, builds digital products with
    Canva, sells them through Stripe on a static storefront, emails buyers
    their templates, syncs sales and keeps listing SEO fresh.
  status: active
  repository: khaneilcampbell/multi-agent-commerce-pipeline
  tags: [crewai, claude, stripe, canva, automation]
  links:
    - label: Case study
      url: https://khaneilcampbell.com/commerce-pipeline.html

agents:
  - id: commerce-loop
    name: Autonomous Loop
    purpose: >-
      Orchestrates each cycle in build, design or maintain mode, running the
      phases below on a Linux VPS under the shopify-pipeline systemd service.
    framework: Shell + systemd
    runtime: Linux VPS
    status: active
    trigger: loop.sh (systemd, hourly cycle)
    source: loop.sh
    last_run: null
    history:
      - at: 2026-10-12
        event: Service paths aligned with the project rename
    registry:
      title: Commerce Pipeline Orchestrator
      category: infrastructure
      subcategory: Workflow orchestration
      classification:
        type: C
        confidence: verified
        evidence: loop.sh is a Bash loop that picks build, design or maintain mode from counters and runs each phase script
      mission:
        problem: Runs the commerce pipeline unattended on a VPS.
        outcomes: [Each cycle runs the right phases for the week's publish budget]
      responsibilities:
        tasks: [Preflight credential check, "Choose build, design or maintain mode", Run phases 1 to 7, Log failures]
        tools: [Bash, systemd]
        inputs: [.env settings, SQLite queue, outputs folder]
        outputs: [logs/loop.log, logs/loop_errors.log]
        dependencies: [niche-scout, canva-mockups, shopify-publisher, seo-maintainer, order-delivery, health-report]
      goals:
        objective: Publish within the weekly limit and keep listings maintained.
        kpis:
          - name: Listings published per week
            kind: throughput
            target: At most 5
            basis: WEEKLY_PUBLISH_LIMIT default in loop.sh
          - name: Hours between publishes
            kind: other
            target: At least 24
            basis: PUBLISH_COOLDOWN_HOURS default in loop.sh
      execution:
        trigger_type: continuous
        schedule: Hourly cycle (SLEEP 3600); maintain mode sleeps until Monday 00:00 UTC
        environment: Linux VPS (systemd shopify-pipeline service)
        stages: [Preflight, Phase 1 brand (weekly), Phase 2 listings (weekly), Phase 3 design, Phase 5 publish, Phase 6 SEO, Phase 7 health]
      governance:
        autonomy: 3
        autonomy_note: >-
          Runs every phase unattended. New products are saved as drafts and go live only after
          ./run.sh approve (STORE_PUBLISH_STATUS=draft, the default since 2026-10-28); SEO edits,
          storefront deploys and buyer emails run without approval. Bounded by the weekly limit,
          the cooldown and a product being dropped after 3 failed attempts.
        data_sensitivity: confidential
        risk: high
        audit_log: logs/loop.log and the SQLite run_log on the VPS (not connected to Atlas)

  - id: niche-scout
