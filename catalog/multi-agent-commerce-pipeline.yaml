        confidence: verified
        evidence: CrewAI Agent in scripts/shopify_brand_crew.py with llm claude-haiku-4-5 and the Serper search tool
      responsibilities:
        tools: [CrewAI, Claude API, Serper search]
        outputs: [Contribution to outputs/brand_guide.md]
      execution:
        trigger_type: scheduled
