  - id: order-delivery
    name: Order Delivery
    purpose: >-
      Emails each buyer of a paid Stripe checkout the Canva template link for
      what they bought. It is the only way buyers receive their product.
    framework: Python script
    runtime: Linux VPS
    status: active
    trigger: Every loop cycle and every 10 minutes while the loop sleeps
    source: scripts/order_delivery.py
    last_run: null
    registry:
      category: business
      subcategory: Order fulfillment
      classification:
        type: C
        confidence: verified
        evidence: scripts/order_delivery.py reads paid checkouts from Stripe and sends email over SMTP; no AI model
      responsibilities:
        tasks: [Find paid checkouts from the last 7 days, Group undelivered products per checkout, Email the buyer the template links, Record each delivery]
        tools: [Stripe API, SMTP, SQLite]
        inputs: [Paid Stripe checkout sessions, listings with template links]
        outputs: [Buyer email, deliveries row]
        dependencies: [shopify-publisher]
        limitations: [Template links are private; a wrong link sent cannot be recalled]
      execution:
        trigger_type: continuous
        schedule: Every cycle in every mode, and every DELIVERY_INTERVAL (600 s) while idle
        environment: Linux VPS
      governance:
        autonomy: 3
        autonomy_note: >-
          Sends buyer emails without approval, because a paid order must not wait for a
          person. Each checkout line is delivered once (deliveries table); failed sends retry.
        data_sensitivity: confidential
        credential_owner: KC (STRIPE_SECRET_KEY and SMTP password in .env on the VPS)
        risk: medium
        audit_log: deliveries table in outputs/pipeline.db on the VPS (not connected to Atlas)

