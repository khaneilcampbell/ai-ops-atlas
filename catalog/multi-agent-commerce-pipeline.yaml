# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: commerce-pipeline
  name: Commerce Operations Center
  former_names: [Commerce Pipeline]
  summary: >-
    Product pipeline on n8n Cloud: Claude turns each idea into a Canva template
    and listing images, Khaneil approves it, Stripe sells it on the shop page and
    buyers get their template link by email.
  status: active
  repository: khaneilcampbell/multi-agent-commerce-pipeline
  tags: [claude, stripe, canva, n8n, automation]
  district: business-operations
  module: commerce-product-marketplace
  links:
    - label: Case study
      url: https://khaneilcampbell.com/commerce-pipeline.html

agents:
  - id: commerce-loop
    workplace: {building: Atlas Marketplace, floor: 1, room: "102"}
    name: Design Run
    purpose: >-
      n8n workflow that takes the next product idea, has Claude write the listing and a design brief,
      then has Claude make the product and six listing images in Canva and emails Khaneil an approval link.
    framework: n8n
    model: claude-sonnet-5-5
    runtime: n8n Cloud
    status: active
    trigger: Monday and Thursday 10am, at most 2 new designs per 7 days
    last_run: null
    history:
      - at: 2026-11-11
        event: Moved to n8n Cloud
    links:
      - label: n8n workflow
        url: https://khancam15.app.n8n.cloud/workflow/Pu57gD8f9Dz9gIbq
      - label: Add a product idea
        url: https://khancam15.app.n8n.cloud/form/commerce-idea
    permissions:
      - Anthropic, through the n8n credential on Claude Writes Brief and Claude Sonnet
      - 'Canva, through the Canva node and the Canva MCP connector: creates designs in Khaneil''s account'
      - 'Resend API: approval and failure emails to Khaneil only'
      - 'n8n data table commerce_products: reads ideas, writes drafts'
    registry:
      title: Commerce Operations Coordinator
      tier: coordinator
      category: business
      subcategory: Workflow orchestration
      classification:
        type: B
        confidence: verified
        evidence: The n8n workflow is a fixed schedule with two Claude steps (claude-sonnet-5-5), one writing the brief and one agent step limited to two Canva tools
      mission:
        problem: Turning a product idea into a finished Canva template and listing images takes hours by hand.
        outcomes:
          - Each idea becomes a Canva product, six listing images and a draft listing
          - Khaneil approves every product before it goes on sale
      responsibilities:
        tasks: [Pick the oldest idea or a retry, Write the listing and Canva brief with Claude, Make the product and six listing images in Canva, Save the draft, Email Khaneil an approval link, Email Khaneil when a run fails]
        tools: [n8n Cloud, Claude (claude-sonnet-5-5), Canva, n8n data tables, Resend]
        inputs: [Ideas from the Add product idea form]
        outputs: [Canva product and listing images, Draft row in commerce_products, Approval email]
      goals:
        objective: Turn each idea into a product ready for Khaneil's review.
        kpis:
          - name: New designs per week
            kind: throughput
            target: At most 2
            basis: WEEKLY_CAP in the Pick Next Idea step
      execution:
        trigger_type: scheduled
        schedule: Monday and Thursday 10am
        environment: n8n
        stages: [Pick idea, Claude brief, Canva design, Save draft, Approval email]
      governance:
        autonomy: 2
        autonomy_note: Makes designs and drafts on its own; nothing goes on sale until Khaneil approves on the approve page. A failed idea is retried up to 3 times and Khaneil gets an email each time.
        data_sensitivity: internal
        credential_owner: Khaneil (n8n credentials)
        risk: medium
        audit_log: n8n executions and the commerce_products data table
      docs:
        known_issues:
          - Atlas has no live data for it yet; results stay in n8n executions
          - Canva returns short links without thumbnails, so the approval email often has no previews
        improvements:
          - Connect n8n executions to Atlas
        last_review: 2026-11-11

  - id: niche-scout
    name: Shopify Niche Scout
    purpose: >-
      Finds the single highest-opportunity niche for a new digital product
      store from market size, competition, buyer intent and profit potential.
    framework: CrewAI
    model: Claude (Anthropic API)
    runtime: Not deployed
    status: retired
    trigger: Phase 1, at most every 7 days
    source: scripts/brand_crew.py
    observe:
      agent_feed: true
    last_run: null
    history:
      - at: 2026-11-11
        event: Retired; the n8n pipeline on n8n Cloud replaced it
    permissions:
      - Anthropic API (ANTHROPIC_API_KEY)
      - Serper search (SERPER_API_KEY)
      - Writes outputs/brand_guide.md
    registry:
      title: Product Opportunity Analyst
      category: business
      subcategory: Market research
      classification:
        type: A
        confidence: verified
        evidence: CrewAI Agent in scripts/brand_crew.py with llm claude-haiku-4-5 and the Serper search tool
      mission:
        problem: Picking a niche without data risks building products nobody searches for.
        outcomes:
          - One chosen niche with the reasons for it
      responsibilities:
        tasks:
          - Search the web for candidate niches
          - Weigh market size, competition, buyer intent and profit potential
          - Pick one niche
        tools: [CrewAI, Claude API, Serper search]
        inputs: [Serper search results]
        outputs: [Contribution to outputs/brand_guide.md]
      execution:
        trigger_type: scheduled
        schedule: Phase 1, at most once every 7 days
        environment: Not deployed
      governance:
        autonomy: 1
        autonomy_note: Writes only the local brand guide that later phases read.
        data_sensitivity: internal
        credential_owner: Khaneil (retired, no live credentials)
        risk: low
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/multi-agent-commerce-pipeline.md#retired-agents
        known_issues:
          - The catalog name still says Shopify; the pipeline sells through Stripe since commit 0f38931
          - Retired; Atlas has no live data for it
          - Runs only with the whole crew (./run.sh phase1)
          - No KPI is defined yet
        improvements:
          - Check the brand guide's structure before Phase 2 reads it
        last_review: 2026-10-28

