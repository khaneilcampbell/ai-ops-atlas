  - id: canva-mockups
    name: Canva Mockup Generator
    purpose: >-
      Generates six conversion-focused product images per listing through
      the Canva remote MCP server and queues the product for build.
    framework: Anthropic API + MCP
    model: Claude (Anthropic API)
    runtime: Linux VPS
    status: idle
    trigger: Phase 3, every build or design cycle
    source: scripts/canva_image_generator.py
    last_run: null
    registry:
      category: business
      subcategory: Workflow automation
      classification:
        type: B
        confidence: verified
        evidence: scripts/canva_image_generator.py makes a fixed Anthropic API call (claude-opus-4-5) with the Canva remote MCP server
      responsibilities:
        tasks: [Design six product images per listing in Canva, Export them as JPEG, Queue the product for build]
        tools: [Anthropic Messages API, Canva remote MCP]
        inputs: [Next undesigned product from outputs/master.txt]
        outputs: [Mockup images, Queue row]
        dependencies: [commerce-loop]
      execution:
        trigger_type: scheduled
        schedule: Phase 3, every build or design cycle
        environment: Linux VPS
      governance:
        autonomy: 3
        autonomy_note: Creates designs in the connected Canva account.
        credential_owner: KC (.env on the VPS)
        risk: medium

  - id: shopify-publisher
    name: Stripe Publisher
    purpose: >-
      Creates the Stripe product and price for each staged listing and saves it
      as a draft for KC to review, gated by the weekly publish limit and cooldown.
    framework: Python script
    runtime: Linux VPS
    status: idle
    trigger: Phase 5, gated by WEEKLY_PUBLISH_LIMIT
    source: scripts/stripe_publisher.py
    last_run: null
    registry:
      category: business
      subcategory: Workflow automation
      classification:
        type: C
        confidence: verified
        evidence: scripts/stripe_publisher.py creates a Stripe product and price and records a draft listing; scripts/approve_listing.py makes it live; no AI model
      responsibilities:
        tasks: [Load the ready listing, Refuse to publish without a template link, Create the Stripe product and price, Save storefront images, Record a draft listing in SQLite]
        tools: [Stripe API, SQLite]
        inputs: [listing.json and images in 04_Assets/ReadyToUpload]
        outputs: [Draft listing with a Stripe product and price, run_log and listings rows]
        limitations: ["With STORE_PUBLISH_STATUS=active it also creates the payment link and the product goes live without review"]
        dependencies: [canva-mockups]
      execution:
        trigger_type: scheduled
        schedule: Phase 5, gated by WEEKLY_PUBLISH_LIMIT and PUBLISH_COOLDOWN_HOURS
        environment: Linux VPS
      governance:
        autonomy: 2
        autonomy_note: >-
          Prepares each product as a draft with no payment link; KC makes it live with
          ./run.sh approve. Level 2 only while the VPS keeps STORE_PUBLISH_STATUS=draft.
        approval: KC runs ./run.sh approve "<product>" after previewing the draft
        data_sensitivity: confidential
        credential_owner: KC (STRIPE_SECRET_KEY in .env on the VPS)
        risk: medium

