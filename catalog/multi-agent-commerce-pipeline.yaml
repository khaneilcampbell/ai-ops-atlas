# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# AI Ops Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: commerce-pipeline
  name: Multi-Agent Commerce Pipeline
  summary: >-
    Autonomous pipeline that researches a niche, builds digital products with
    Canva, sells them through Stripe on a static storefront, emails buyers
    their templates, syncs sales and keeps listing SEO fresh.
  status: active
  repository: khaneilcampbell/multi-agent-commerce-pipeline
  tags: [crewai, claude, stripe, canva, automation]
  district: business-operations
  links:
    - label: Case study
      url: https://khaneilcampbell.com/commerce-pipeline.html

agents:
  - id: commerce-loop
    name: Autonomous Loop
    purpose: >-
      Orchestrates each cycle in build, design or maintain mode, running the phases below on a Linux VPS under the commerce-pipeline systemd service.
    framework: Shell + systemd
    runtime: Linux VPS
    status: active
    trigger: loop.sh (systemd, hourly cycle)
    source: loop.sh
    observe:
      agent_feed: true
    # Reports at least once a week even in maintain mode (sleeps until Monday 00:00 UTC).
    alerts:
      failures: true
      report_within: 8d
      not_running: The commerce VPS was removed. The pipeline is off until it moves to the Oracle VM, so silence here is expected.
    last_run: null
    history:
      - at: 2026-10-12
        event: Service paths aligned with the project rename
    permissions:
      - 'Every credential in .env on the VPS: Anthropic, Serper, Canva, Stripe and SMTP'
      - Storefront deploy key with write access to the storefront repository
      - Runs as root in the documented setup
    registry:
      title: Commerce Operations Coordinator
      category: infrastructure
      subcategory: Workflow orchestration
      classification:
        type: C
        confidence: verified
        evidence: loop.sh is a Bash loop that picks build, design or maintain mode from counters and runs each phase script
      mission:
        problem: Runs the commerce pipeline unattended on a VPS.
        outcomes: [Each cycle runs the right phases for the week's publish budget]
      responsibilities:
        tasks: [Preflight credential check, "Choose build, design or maintain mode", Run phases 1 to 7, Log failures]
        tools: [Bash, systemd]
        inputs: [.env settings, SQLite queue, outputs folder]
        outputs: [logs/loop.log, logs/loop_errors.log]
        dependencies: [niche-scout, canva-mockups, shopify-publisher, seo-maintainer, order-delivery, health-report]
      goals:
        objective: Publish within the weekly limit and keep listings maintained.
        kpis:
          - name: Listings published per week
            kind: throughput
            target: At most 5
            basis: WEEKLY_PUBLISH_LIMIT default in loop.sh
          - name: Hours between publishes
            kind: other
            target: At least 24
            basis: PUBLISH_COOLDOWN_HOURS default in loop.sh
      execution:
        trigger_type: continuous
        schedule: Hourly cycle (SLEEP 3600); maintain mode sleeps until Monday 00:00 UTC
        environment: Linux VPS (systemd commerce-pipeline service)
        stages: [Preflight, Phase 1 brand (weekly), Phase 2 listings (weekly), Phase 3 design, Phase 5 publish, Phase 6 SEO, Phase 7 health]
      governance:
        autonomy: 3
        autonomy_note: >-
          Runs every phase unattended. New products are saved as drafts and go live only after
          ./run.sh approve (STORE_PUBLISH_STATUS=draft, the default since 2026-10-28); SEO edits,
          storefront deploys and buyer emails run without approval. Bounded by the weekly limit,
          the cooldown and a product being dropped after 3 failed attempts.
        data_sensitivity: confidential
        credential_owner: KC (.env on the VPS)
        risk: high
        audit_log: logs/loop.log and the SQLite run_log on the VPS (not connected to Atlas)
      docs:
        technical: docs/threat-model.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/multi-agent-commerce-pipeline.md#autonomous-loop
        known_issues:
          - The manifest named the old shopify-pipeline service; the unit is commerce-pipeline.service
          - Runs as root in the documented setup
          - Backups stay on the same VPS
          - Atlas has no live data for it; results stay in logs/loop.log and the SQLite run_log on the VPS
        improvements:
          - Run under a dedicated user, as the service file recommends
          - Copy backups off the VPS
          - Send phase results to Atlas
        last_review: 2026-10-28

  - id: niche-scout
    name: Shopify Niche Scout
    purpose: >-
      Finds the single highest-opportunity niche for a new digital product
      store from market size, competition, buyer intent and profit potential.
    framework: CrewAI
    model: Claude (Anthropic API)
    runtime: Linux VPS
    status: idle
    trigger: Phase 1, at most every 7 days
    source: scripts/brand_crew.py
    observe:
      agent_feed: true
    last_run: null
    permissions:
      - Anthropic API (ANTHROPIC_API_KEY)
      - Serper search (SERPER_API_KEY)
      - Writes outputs/brand_guide.md
    registry:
      title: Product Opportunity Analyst
      category: business
      subcategory: Market research
      classification:
        type: A
        confidence: verified
        evidence: CrewAI Agent in scripts/brand_crew.py with llm claude-haiku-4-5 and the Serper search tool
      mission:
        problem: Picking a niche without data risks building products nobody searches for.
        outcomes:
          - One chosen niche with the reasons for it
      responsibilities:
        tasks:
          - Search the web for candidate niches
          - Weigh market size, competition, buyer intent and profit potential
          - Pick one niche
        tools: [CrewAI, Claude API, Serper search]
        inputs: [Serper search results]
        outputs: [Contribution to outputs/brand_guide.md]
      execution:
        trigger_type: scheduled
        schedule: Phase 1, at most once every 7 days
        environment: Linux VPS
      governance:
        autonomy: 1
        autonomy_note: Writes only the local brand guide that later phases read.
        data_sensitivity: internal
        credential_owner: KC (.env on the VPS)
        risk: low
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/multi-agent-commerce-pipeline.md#brand-builder-crew
        known_issues:
          - The catalog name still says Shopify; the pipeline sells through Stripe since commit 0f38931
          - Atlas has no live data for it; results stay in logs/loop.log and the SQLite run_log on the VPS
          - Runs only with the whole crew (./run.sh phase1)
          - No KPI is defined yet
        improvements:
