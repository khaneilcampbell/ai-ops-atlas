      category: business
      subcategory: Order fulfillment
      classification:
        type: C
        confidence: verified
        evidence: scripts/order_delivery.py reads paid checkouts from Stripe and sends email over SMTP; no AI model
      mission:
        problem: A buyer must get their template link soon after paying, without KC sending it.
        outcomes:
          - Every paid checkout line is emailed once
      responsibilities:
        tasks: [Find paid checkouts from the last 7 days, Group undelivered products per checkout, Email the buyer the template links, Record each delivery]
        tools: [Stripe API, SMTP, SQLite]
        inputs: [Paid Stripe checkout sessions, listings with template links]
        outputs: [Buyer email, deliveries row]
        dependencies: [shopify-publisher]
        limitations: [Template links are private; a wrong link sent cannot be recalled]
