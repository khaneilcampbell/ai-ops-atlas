        inputs: [listing.json and images in 04_Assets/ReadyToUpload]
        outputs: [Draft listing with a Stripe product and price, run_log and listings rows]
        limitations: ["With STORE_PUBLISH_STATUS=active it also creates the payment link and the product goes live without review"]
        dependencies: [canva-mockups]
      execution:
        trigger_type: scheduled
