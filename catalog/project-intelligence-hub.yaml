      category: data
      subcategory: Documentation
      tier: coordinator
      automation_category: maintenance
      classification:
        type: A
        confidence: verified
        evidence: Owning agent defined in the Atlas catalog on 2026-11-13; its automations name it in owned_by. It has no model of its own and no run of its own has been seen.
      mission:
        problem: Project documents drift from their Markdown sources unless rendering and checks run on every change.
        outcomes:
          - Every source renders on each change
          - Styled DOCX on request
        beneficiaries:
