      responsibilities:
        tasks: [Render project Markdown to DOCX, Check every source renders on each change, Flag a source that fails to render]
        tools: [Its automations]
        outputs: [The results of its automations]
        inputs:
          - Project Markdown sources
        dependencies:
          - docs-builder
          - hub-ci
        limitations:
          - Acts only through the automations it owns; it has no model, schedule or credentials of its own
          - DOCX rendering is still started by hand
      goals:
        objective: Keep project documents current and renderable.
        review_frequency: Quarterly
        kpis:
          - name: Owned automations healthy
            kind: reliability
            target: Every automation it owns shows healthy in Atlas
            basis: Its health is the worst of its automations'
      execution:
        trigger_type: event
        environment: Through its automations
      governance:
        autonomy: 0
        autonomy_note: Renders and checks documents only.
        risk: low
        credential_owner: Khaneil, through the credentials of each automation it owns
      cost:
        budget: No model calls of its own; each automation keeps its own cap.
      docs:
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/project-intelligence-hub.md#documentation-lead
        last_review: 2026-11-17
