    name: Documentation Lead
    purpose: >-
      Keeps every project's documents current: renders each project's Markdown to styled DOCX and checks every source renders on each change. It has no model of its own yet; it works through the automations it owns.
    framework: Atlas owning agent (runs through its automations)
    model: None of its own; each automation it owns keeps its own model and cap
    runtime: Through its automations
    status: active
    trigger: A pull request or push, or a manual render
    last_run: null
    history:
      - at: 2026-11-13
        event: Added as the owning agent of Technical Documentation Specialist, Documentation Quality Engineer, at Khaneil's request
    permissions:
      - None of its own; it acts only through the permissions listed on each automation it owns
    registry:
