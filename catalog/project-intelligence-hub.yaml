# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: intelligence-hub
  name: Agent Operations Center
  former_names: [Intelligence Hub]
  summary: >-
    Documentation for each engineering project: overview, deep dive, learning
    guide, development journal and roadmap, rendered to DOCX.
  status: active
  repository: khaneilcampbell/ai-ops-atlas
  tags: [documentation, claude]
  district: ai-engineering
  module: agent-operations-center

agents:
  - id: docs-builder
    name: Docs Builder
    purpose: Renders each project's Markdown source to styled DOCX with pandoc and python-docx.
    framework: Python script
    owned_by: documentation-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: Local
    status: idle
    trigger: Manual
    source: "docs/intelligence-hub/10 — System Administration/Automation Scripts/build_docs.py"
    last_run: null
    permissions:
      - Reads Source/ and writes DOCX files in the project folder; no network
    registry:
      title: Technical Documentation Specialist
      category: engineering
      subcategory: Documentation
      classification:
        type: C
        confidence: verified
        evidence: build_docs.py renders Markdown to DOCX with pandoc and python-docx and reads no network resources
      mission:
        problem: Keeps each project's documents readable as styled DOCX without formatting them by hand.
        outcomes:
          - One styled DOCX per Markdown source, beside Source/
      responsibilities:
        tasks: [Render each project's Markdown sources to styled DOCX, Apply the house styles to every DOCX]
        tools: [pandoc, python-docx]
        inputs: [Source/project.json and Source/*.md]
        outputs: [One DOCX per Markdown file]
        dependencies:
          - pandoc
          - python-docx
          - hub-ci
        limitations:
          - Runs only by hand
          - Uses macOS fonts; other systems substitute them
          - No AI model, so it cannot judge content; it only follows its fixed rules
      goals:
        review_frequency: Quarterly
        kpis:
          - name: Sources rendered
            kind: reliability
            target: Every project's Markdown renders to DOCX
            basis: Hub CI renders every project on each change
        objective: Turn every project's Markdown into styled DOCX on request.
      execution:
        trigger_type: manual
        environment: Local
      governance:
        autonomy: 0
        data_sensitivity: internal
        credential_owner: None needed (local files only)
        risk: low
      docs:
        technical: docs/intelligence-hub/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/project-intelligence-hub.md#docs-builder
        known_issues:
          - Shared Atlas repository health does not verify this project's live business operations
          - Styles use macOS fonts (Helvetica Neue, Avenir Next, Menlo); other systems substitute them
          - Nothing checks that the committed DOCX files match their sources
          - No KPI is defined yet
        improvements:
          - Fail CI when a rendered document differs from the committed one
        last_review: 2026-10-28

  - id: hub-ci
    name: Hub CI
    purpose: Checks every project's sources and renders all documents, with DOCX downloads on request.
    framework: GitHub Actions
    owned_by: documentation-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual
    source: .github/workflows/hub-ci.yml
    observe:
      github_workflow: hub-ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read'
      - No repository secrets
    registry:
      title: Documentation Quality Engineer
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/hub-ci.yml validates project.json and the five sources per project, then runs build_docs.py with pandoc; no AI model
      mission:
        problem: Proves every project's Markdown still renders to DOCX before it is merged.
        outcomes: ["Every pull request renders all documents before merge"]
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Lint build_docs.py, Check project.json and the five sources, Render every project to DOCX, Optional DOCX download on manual dispatch]
        tools: [GitHub Actions, pandoc, python-docx, ruff]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request, Rendered DOCX when requested]
        dependencies:
          - GitHub Actions runners
          - docs-builder
        limitations:
          - Proves the sources render, not that committed DOCX files are current
      goals:
        objective: Block merges that break a project's documents.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; target proposed 2026-11-17 from production history, Khaneil can change it
            target: At least 90% of runs succeed
        review_frequency: Monthly
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        risk: low
        audit_log: GitHub Actions run history
        credential_owner: Khaneil (GitHub repository settings)
      docs:
        technical: docs/intelligence-hub/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/project-intelligence-hub.md#hub-ci
        known_issues:
          - Shared Atlas repository health does not verify this project's live business operations
          - It proves the sources render but not that the committed DOCX are current
        improvements:
          - Compare rendered documents with the committed ones
        last_review: 2026-10-28

  - id: agent-registry-sync
    name: Agent Registry Sync
    purpose: >-
      n8n workflow that keeps the Atlas Agent Registry Google Sheet in the Benjaire Drive current:
      one row per agent and n8n workflow, with building, where it runs, status, schedule, last run,
      health, cost cap and links. Working agents are on the Registry tab; retired and removed agents
      move to the Retired tab with the date they were retired, never deleted.
      Every Sunday at 9am a second workflow reads the same Atlas data and ranks the top 10 agents worth
      building next in the sheet's Top 10 Agents tab, with one capped Claude call.
      Every morning at 7am a third workflow rewrites the sheet's Business Structure tab: who reports
      to whom, how each agent starts and its autonomy level. No model.
    framework: n8n
    owned_by: agent-operations-lead            # owning agent, added at Khaneil's request 2026-11-13
    model: claude-opus-5-5 for the weekly Sunday ranking only ($3 per 30 days); the registry sync uses no model
    runtime: n8n Cloud
    status: active
    trigger: Every 4 hours and the Agents tab's Refresh registry sheet button; Business Structure daily 7am ET; Top 10 Sundays 9am ET
    last_run: 2026-11-15T14:00:00Z
    history:
      - at: 2026-11-17
        event: Retired agents moved to their own Retired tab and off the Registry tab, at Khaneil's request (55 retired, 66 working)
      - at: 2026-11-12
        event: Published in n8n; added the daily Business Structure workflow and the Refresh registry sheet button
      - at: 2026-11-12
        event: Added the Top 10 Agent Ideas workflow (Sundays 9am, one capped Claude call) at Khaneil's request
      - at: 2026-11-12
        event: Built as an unpublished n8n draft; first real run filled the sheet with 71 rows
    links:
      - label: n8n workflow
        url: https://khancam15.app.n8n.cloud/workflow/JCjTTvb7qZLpVXhs
      - label: Registry sheet
        url: https://docs.google.com/spreadsheets/d/1OcCD-k4ob_9lwpiQN3CazE7mkgQz0ExCzqLtHXrPAQA/edit
      - label: Top 10 Agent Ideas workflow
        url: https://khancam15.app.n8n.cloud/workflow/bgebM33jnVhLPSTF
      - label: Business Structure workflow
        url: https://khancam15.app.n8n.cloud/workflow/iY7mu26VL0xYElAP
    permissions:
      - 'GitHub: public reads of catalog/*.yaml, no key'
      - 'n8n API key (read only): workflows and recent executions'
      - 'Atlas sync key (read only): GET /api/hooks/feed'
      - 'Google Sheets: reads and writes the Atlas Agent Registry sheet only'
      - 'Anthropic API: one Claude call a week for the Top 10 ranking, capped at $3 per 30 days'
    registry:
      title: Agent Registry Clerk
      category: engineering
      subcategory: Workflow automation
      automation_category: maintenance       # B since the Top 10 ranking step; keeps its place beside the registry sync's other upkeep
      classification:
        type: B
        confidence: verified
        evidence: The registry workflow compares rows in plain code with no AI model; the Top 10 Agent Ideas workflow builds its brief in plain code and makes one Claude call to rank the ideas
      mission:
        problem: There was no single list of every agent and automation with its status, schedule, health and links.
        outcomes:
          - Every agent in the Atlas catalog and every n8n workflow has one current row in the registry sheet
          - A ranked list of the 10 agents most worth building next, refreshed every Sunday
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Read the Atlas catalog, Read n8n workflows and recent runs, Read the Atlas live feed, Upsert new or changed rows by agent_id, Move retired and removed agents to the Retired tab with a date, Rank the top 10 agents to build every Sunday]
        # Framework and runtime say n8n. The tools list leaves the vendor name out on purpose: naming it
        # here would add an Automation Works kiosk to this district and reshape its land (Khaneil chose
        # to keep the map as it is, 2026-11-12).
        tools: [Scheduled workflow, Google Sheets, GitHub public reads, Atlas live feed]
        inputs: [catalog/*.yaml, n8n workflows and executions, Atlas feed events]
        outputs: [Rows in the Atlas Agent Registry sheet, Retired tab in the same sheet, Top 10 Agents tab in the same sheet, Business Structure tab in the same sheet]
        dependencies:
          - catalog/*.yaml on main
          - n8n executions
          - Atlas live feed
          - Atlas Agent Registry Google Sheet
        limitations:
          - The Atlas feed covers only about the last 6 hours
          - Finds sheet tabs by name, so renaming a tab breaks it
          - Successful runs are not saved in n8n
      goals:
        objective: One current row per agent in the registry sheet.
        review_frequency: Monthly
        kpis:
          - name: Sheet freshness
            kind: reliability
            target: No row more than 4 hours behind Atlas
            basis: Every 4 hours schedule
          - name: Top 10 spend
            kind: cost
            target: Under $3 per 30 days
            basis: Cap on the weekly ranking call
      execution:
        trigger_type: scheduled
        environment: n8n
      governance:
        autonomy: 1
        autonomy_note: Writes only to its own Google Sheet; read-only toward Atlas and n8n.
        data_sensitivity: internal
        credential_owner: Khaneil (n8n credentials)
        risk: low
        audit_log: n8n executions and the sheet's version history
      cost:
        budget: "Registry sync: no model spending. Top 10 ranking: Claude Opus 5.5, $3 and 12 runs per 30 days, checked before each call (n8n table agent_ideas_runs)"
      docs:
        known_issues:
          - The Atlas feed only covers about the last 6 hours, so on-demand agents show No recent runs until they run
          - The workflows find the sheet's tabs by name (Registry, Retired, Top 10 Agents, Business Structure), so renaming a tab breaks them
          - n8n does not keep successful scheduled runs of the registry sync, so Atlas cannot show its last run
        last_review: 2026-11-12

        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/project-intelligence-hub.md#agent-registry-sync
  - id: atlas-agent-factory
    name: Agent Factory
    purpose: >-
      Every Monday at 8am an n8n workflow looks for gaps in plain code (catalog buildings and modules
      with no agent, failing n8n workflows, quiet Atlas feed sources), ranks them, and makes one capped
      Claude call to write a spec for the single best new agent. It emails Khaneil Approve or Reject.
      Approving only records the decision; nothing is built or switched on.
    framework: n8n
    owned_by: agent-operations-lead            # owning agent, added at Khaneil's request 2026-11-13
    model: claude-opus-5-5 for one proposal a week at most ($2 per 30 days)
    runtime: n8n Cloud
    status: active
    trigger: Mondays 8am ET, at most one proposal per 7 days
    last_run: 2026-11-16T13:00:00Z
    history:
      - at: 2026-11-17
        event: Renamed in n8n from "Atlas · Agent Factory (draft)" to "Atlas · Agent Factory" at Khaneil's request (same workflow id)
      - at: 2026-11-12
        event: Published in n8n; first run proposed a Business Ops HQ Daily Rollup and emailed Khaneil
    links:
      - label: n8n workflow (Atlas · Agent Factory)
        url: https://khancam15.app.n8n.cloud/workflow/FTCanpGAYPIr3OGe
    permissions:
      - 'GitHub: public reads of catalog/*.yaml, no key'
      - 'n8n API key (read only): workflows and failed runs'
      - 'Atlas sync key (read only): GET /api/hooks/feed'
      - 'Anthropic API: one Claude call a week at most, capped at $2 per 30 days'
      - 'Resend: the proposal email to Khaneil only'
      - 'n8n data table agent_factory_proposals: writes proposals and decisions'
    registry:
      title: Agent Factory
      category: engineering
      subcategory: Agent planning
      classification:
        type: B
        confidence: verified
        evidence: Live n8n workflow FTCanpGAYPIr3OGe ranks gaps in plain code and makes one Claude call to draft the spec
      mission:
        problem: Gaps (buildings without agents, failing workflows, quiet feeds) pile up unless something looks for them every week.
        outcomes:
          - At most one ranked new-agent proposal a week
          - Khaneil approves or rejects; nothing is built automatically
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks:
          - Scan the catalog, n8n failures and the Atlas feed for gaps in plain code
          - Rank the gaps
          - Draft one agent spec with one capped Claude call
          - Email Khaneil Approve or Reject
          - Record the decision
        tools:
          - Scheduled workflow
          - Claude (claude-opus-5-5)
          - Resend
        inputs:
          - catalog/*.yaml
          - n8n failed runs
          - Atlas live feed
        outputs:
          - agent_factory_proposals row
          - Proposal email to Khaneil
        dependencies:
          - catalog/*.yaml on main
          - n8n failed runs
          - Claude (claude-opus-5-5)
          - Resend
        limitations:
          - At most one proposal per 7 days
          - Proposes only; Khaneil approves or rejects by email before anything is built
      goals:
        objective: Propose the single most useful next agent each week.
        review_frequency: Monthly
        kpis:
          - name: Proposals per week
            kind: throughput
            target: At most 1
            basis: Its own cap
          - name: Spend
            kind: cost
            target: Under $2 per 30 days
            basis: Its own cap
      execution:
        trigger_type: scheduled
        environment: n8n
      governance:
        autonomy: 1
        autonomy_note: Proposes only; Khaneil approves or rejects, and approval builds nothing.
        risk: low
        audit_log: n8n executions and the agent_factory_proposals table
        credential_owner: Khaneil (n8n credentials)
      cost:
        budget: Claude Opus 5.5, one proposal and $2 per 30 days, checked before each call

      docs:
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/project-intelligence-hub.md#agent-factory
        last_review: 2026-11-17
  - id: atlas-step-runner
    name: Atlas Step Runner
    purpose: >-
      Restricted n8n workflow that Atlas Workflow Intelligence can start for six research and planning
      steps of a live run (market, customer and competitor research, scoring, brief, plan). One model
      call per step with no tools, then a structured report back to Atlas. It cannot send email, touch
      Notion, the shop or payments, approve or publish.
    framework: n8n
    owned_by: agent-operations-lead
    model: claude-haiku-5-5 for research, claude-sonnet-5-5 for scoring, brief and plan
    runtime: n8n Cloud
    status: active
    trigger: Webhook from the Atlas site only (published)
    last_run: 2026-11-16T16:17:55Z
    history:
      - at: 2026-11-15
        event: Built as an unpublished n8n draft at Khaneil's choice of a new restricted step runner
      - at: 2026-11-15
        event: Khaneil published it after adding the bridge secrets; a test market research step ran and the site refused its report as expected because Atlas had not sent that step
    links:
      - label: n8n workflow (Step Runner)
        url: https://khancam15.app.n8n.cloud/workflow/tGYMec2rp0twZFxv
    permissions:
      - 'Webhook header auth: N8N_BRIDGE_TOKEN, held only by the Atlas site'
      - 'Anthropic API: one call per step; the Atlas site allows at most 20 steps a day'
      - 'Atlas report key (N8N_BRIDGE_CALLBACK_TOKEN): adds reports only for steps the site sent'
    registry:
      title: Workflow Step Runner
      category: engineering
      subcategory: Workflow automation
      classification:
        type: B
        confidence: verified
        evidence: n8n workflow tGYMec2rp0twZFxv (published) checks the step in plain code, makes one Claude call with no tools and posts the report to /api/hooks/n8n-report
      mission:
        problem: Workflow Intelligence needs a few research and planning steps run by a model without giving that model tools or reach.
        outcomes:
          - Each allow-listed step returns a structured report to Atlas
          - No step can send, publish or pay
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks: [Run allow-listed research and planning steps, Report each step's structured output back to Atlas, Refuse any step that is not on the allow list]
        tools: [Webhook, Claude]
        inputs: [Handoff envelopes from the Atlas site]
        outputs: [Step reports in the Atlas site's private database]
        dependencies:
          - Atlas site Workflow Intelligence
          - Claude
        limitations:
          - Runs only the six allow-listed steps
          - One model call per step, started only by the Atlas site
      goals:
        objective: Run allow-listed steps safely and report back every time.
        review_frequency: Monthly
        kpis:
          - name: Run success rate
            kind: reliability
            target: At least 95% of runs succeed
            target_value: 95
            direction: min
            basis: A failed step stalls the live run in Atlas
          - name: Steps per day
            kind: cost
            target: At most 20
            basis: The Atlas site's daily cap
      execution:
        trigger_type: event
        environment: n8n
      governance:
        autonomy: 1
        autonomy_note: Research and planning only; approvals, development and publishing stay with Khaneil and the Approve and Publish flow.
        data_sensitivity: internal
        credential_owner: Khaneil (n8n credentials and Cloudflare Pages secrets)
        risk: medium
        audit_log: n8n executions and the Atlas site's n8n_dispatch and n8n_reports tables (kept 30 days)
      cost:
        budget: At most 20 steps a day across all runs, enforced by the Atlas site before sending
      docs:
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/project-intelligence-hub.md#atlas-step-runner
        last_review: 2026-11-17

  # Owning agent (2026-11-13, Khaneil asked that every automation have one). It has no model or
  # runtime of its own: its automations, which name it in owned_by, are the steps it runs.
  - id: agent-operations-lead
    name: Agent Operations Lead
    purpose: >-
      Keeps track of every Atlas agent and what to build next: keeps the Agent Registry sheet current and proposes at most one new agent a week for Khaneil to approve or reject. Since Phase 8 it also coordinates Khaneil's executive goals in Mission Control: it turns a goal into a plan of registered agents from fixed templates, checks the plan, and after Khaneil approves it creates the plan's Task Center tasks. It has no model of its own yet; it works through the automations it owns and Atlas's own rules.
    framework: Atlas owning agent (runs through its automations)
    model: None of its own; each automation it owns keeps its own model and cap
    runtime: Through its automations
    status: active
    trigger: Its automations run every 4 hours and Mondays 8am ET
    last_run: null
    history:
      - at: 2026-11-13
        event: Added as the owning agent of Agent Registry Clerk, Agent Factory, at Khaneil's request
      - at: 2026-11-17
        event: Coordinates executive goals in Mission Control (Phase 8). Plans come from fixed templates, start only after Khaneil approves, and default to autonomy level 1
      - at: 2026-11-17
        event: Carries agent, task and goal incident tasks from Mission Control's Autonomous operations (Phase 9). Creates them on its own only at autonomy level 2 or above; at level 1 Khaneil creates them
    permissions:
      - None of its own; it acts only through the permissions listed on each automation it owns
    registry:
      title: Agent Operations Lead
      category: engineering
      subcategory: Agent planning
      tier: coordinator
      automation_category: intelligence
      classification:
        type: A
        confidence: verified
        evidence: Owning agent defined in the Atlas catalog on 2026-11-13; its automations name it in owned_by. It has no model of its own and no run of its own has been seen.
      mission:
        problem: With dozens of agents, someone must keep the registry true, decide what to build next and turn Khaneil's goals into plans.
        outcomes:
          - The registry sheet matches Atlas
          - At most one new-agent proposal a week
          - Approved goal plans become Task Center tasks
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks: [Keep the Agent Registry sheet current, Propose at most one new agent a week, Plan executive goals with registered agents, Delegate approved goal plans to the Task Center, Build executive briefings from Atlas records, "Carry agent, task and goal incident tasks"]
        tools: [Its automations]
        outputs: [The results of its automations, Executive goal plans, Executive briefings]
        inputs:
          - The catalog
          - n8n runs
          - The Atlas feed
          - Khaneil's goals and approvals
        dependencies:
          - agent-registry-sync
          - atlas-agent-factory
          - atlas-step-runner
        limitations:
          - Acts only through the automations it owns; it has no model, schedule or credentials of its own
          - New agents need Khaneil's approval
      goals:
        objective: Keep Atlas's agent workforce known, current and growing only with Khaneil's approval.
        review_frequency: Monthly
        kpis:
          - name: Owned automations healthy
            kind: reliability
            target: Every automation it owns shows healthy in Atlas
            basis: Its health is the worst of its automations'
          - name: Plans started without approval
            kind: quality
            target: Zero
            basis: Executive plans start only when Khaneil approves
      execution:
        trigger_type: scheduled
        environment: Through its automations
      governance:
        autonomy: 1
        autonomy_note: Proposes only; approving a proposal builds nothing. Executive plans start only when Khaneil approves and starts them; sensitive steps keep their own approvals.
        risk: low
        credential_owner: Khaneil, through the credentials of each automation it owns
      cost:
        budget: No model calls of its own; each automation keeps its own cap.
      docs:
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/project-intelligence-hub.md#agent-operations-lead
        last_review: 2026-11-17

  # Owning agent (2026-11-13, Khaneil asked that every automation have one). It has no model or
  # runtime of its own: its automations, which name it in owned_by, are the steps it runs.
