# yaml-language-server: $schema=./schema/atlas-v2.schema.json
schema: atlas/v2

project:
  id: skyline
  name: Skyline
  summary: >-
    Skyline residences and business district. Initial service: Benjaire
    Inquiry Assistant, a planned client intake package based on Benjaire Flow. No client workflow
    or live telemetry is connected through this registration.
  status: idle
  repository: khaneilcampbell/skyline
  district: business-operations
  tags: [business, residences, intake]
  links:
    - label: Atlas city implementation
      url: https://github.com/khaneilcampbell/ai-ops-atlas
    - label: Skyline service setup
      url: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/skyline-inquiry-assistant.md
  connections:
    - to: benjaire-site
      type: dependency
      direction: outbound
      note: Planned service reuses the documented Benjaire Flow intake design; no runtime connection is established.

agents:
  - id: skyline-inquiry-assistant
    name: Benjaire Inquiry Assistant
    purpose: Planned service that captures website inquiries, classifies requests, saves an inquiry log, alerts the owner and acknowledges the sender.
    framework: Planned n8n workflow with an AI classification step
    runtime: Not deployed
    status: idle
    trigger: Planned website form submission
    last_run: null
    permissions: []
    registry:
      title: Benjaire Inquiry Assistant
      category: business
      subcategory: Customer inquiry intake
      classification:
        type: F
        confidence: verified
        evidence: Manual-only sandbox export prepared in ops/skyline with 10 passing local checks; no n8n engine execution or client deployment verified.
      mission:
        problem: Small businesses need website inquiries organized and acknowledged without manually sorting every submission.
        outcomes:
          - Every accepted inquiry is recorded once
          - The owner receives a notification
          - The sender receives a fixed acknowledgement
        beneficiaries: [Client business owner, Website visitors]
      responsibilities:
        tasks: [Capture validated inquiries, Classify topic and urgency, Save the inquiry, Notify the owner, Acknowledge the sender]
        tools: [Planned n8n, Planned email provider, Planned AI classifier]
        inputs: [One website inquiry form]
        outputs: [Inquiry log, Owner notification, Sender acknowledgement]
        limitations:
          - CRM integrations, appointment booking and additional channels are outside the initial package
          - No authority to quote prices, promise availability or send sales follow-ups
      execution:
        trigger_type: event
        environment: Not deployed
      governance:
        autonomy: 2
        autonomy_note: Deployment and credentials require owner setup; this registration grants no runtime access.
        data_sensitivity: confidential
        credential_owner: Not configured; client-owned accounts proposed
        risk: medium
      docs:
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/skyline-inquiry-assistant.md
        known_issues:
          - No client deployment, credentials or live execution source is configured
          - Benjaire Flow live export must be reconciled before reuse
          - Sandbox import and test-table persistence await n8n workspace access
          - Duplicate protection, retention and real email retry handling remain production blockers
        improvements: [Deploy a sandbox workflow, Pass acceptance checks, Connect execution telemetry]
        last_review: 2026-10-30
