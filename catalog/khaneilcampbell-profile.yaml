        environment: n8n
      governance:
        autonomy: 3
        autonomy_note: Published 2026-11-17; commits to the profile repository on its own every 6 hours, only when something meaningful changed.
        data_sensitivity: public
        approval: Khaneil published it on 2026-11-17; no approval per run
        credential_owner: Khaneil (n8n account and GitHub OAuth credential)
        risk: low
        kill_switch: Unpublish the agent in n8n, or disable its task
      cost:
        notes: Claude Sonnet 5 with up to 5 web searches per run, 4 runs a day; prompt caching is on
      docs:
        runbook: docs/runbooks/development-hub.md#github-profile-manager
        last_review: 2026-11-17
        known_issues:
          - Commits go straight to the default branch with no pull request
        improvements:
          - Open a pull request instead of committing directly, so Khaneil reviews each profile change

