            kind: quality
            target: Within 6 hours of a meaningful change
            basis: Task schedule (every 6 hours); checked against the profile repository's commit history
          - name: Commits for trivial changes
            kind: quality
            target: '0'
            basis: The task's own rule; checked by reading its commits
      execution:
        trigger_type: scheduled
