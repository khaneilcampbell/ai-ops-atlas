# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# AI Ops Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: github-profile
  name: GitHub Profile
  summary: The profile README shown on github.com/khaneilcampbell, and the GitHub building's own agent, which keeps pull requests across the ecosystem moving to production.
  status: active
  repository: khaneilcampbell/khaneilcampbell
  tags: [profile]
  district: career-portfolio
  links:
    - label: GitHub profile
      url: https://github.com/khaneilcampbell

agents:
  - id: github-merge-flow
    name: Merge Flow
    purpose: Sorts every open pull request across KC's repositories into one lane (ready, failing, behind, conflicts and so on) and names the next move that gets it merged to production sooner. Read-only; KC still says "merge".
    framework: GitHub Actions + Claude
    model: Claude Opus 5.5 (Anthropic API), only when the triage changed
    runtime: GitHub-hosted runner
    status: active
    trigger: Every 4 hours, when a pull request's Atlas CI finishes, or manual
    source: ops/merge-flow/merge_flow.py
    repository: khaneilcampbell/ai-ops-atlas
    observe:
      github_workflow: merge-flow.yml
      agent_feed: true
    last_run: null
    capabilities:
      - Read open and recently merged pull requests of 11 repositories in one GraphQL request
      - Sort each pull request into one lane from GitHub's own merge state, review decision and checks
      - Name failing checks, stale branches and branches behind their base
      - Measure median time to merge over the last 30 days
      - Write a five-line brief of next moves, only when the triage changed and something needs action
    permissions:
      - 'GITHUB_TOKEN: contents and pull requests read on ai-ops-atlas'
      - 'MERGE_FLOW_TOKEN (optional): fine-grained, read-only Pull requests, Contents and Commit statuses on the listed repositories'
      - 'ANTHROPIC_API_KEY (optional): messages, capped at 4 briefs a day and $1 a month'
      - 'ATLAS_FEED_TOKEN (optional): add-only reports to /api/hooks/agents'
    registry:
      title: Merge Flow Coordinator
      category: engineering
      subcategory: Code review and release
      classification:
        type: B
        confidence: verified
        evidence: ops/merge-flow/merge_flow.py sorts pull requests deterministically and makes one Claude call for the brief only when the triage fingerprint changed and an actionable pull request exists
      mission:
        problem: Finished pull requests wait for days because nobody sees that they are ready, behind their base, or blocked on one failing check.
        outcomes: [Ready pull requests are named the moment they are ready, Each blocked pull request has one concrete next move, Time to merge is measured instead of guessed]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Read open pull requests and their merge state in one request, Sort them into lanes, Skip everything else when nothing changed, Ask Claude for a short brief when something needs action, Report counts publicly and details only in Atlas]
        tools: [GitHub GraphQL API (read), Anthropic Messages API, GitHub Actions cache for the last fingerprint]
        inputs: [Allowlist and caps in ops/merge-flow/policy.json, Open and recently merged pull requests]
        outputs: [Job summary on the Actions run, Optional report in Atlas's live feed]
        dependencies: [atlas-merge-pr, atlas-rerun-failed]
        limitations: [Never merges approves pushes comments or re-runs, First 20 open pull requests per repository, Private repositories need MERGE_FLOW_TOKEN, Check names are capped at 25 per pull request]
      goals:
        objective: Shorten the time from a pull request being ready to it being merged, without bypassing any check or approval.
        review_frequency: Monthly
        kpis:
          - name: Run success rate
            kind: reliability
            target: At least 95% of runs succeed
            target_value: 95
            direction: min
            basis: A missed triage hides ready work
            measure: run_success_rate
          - name: Median time to merge
            kind: throughput
            target: Under 24 hours, from the run summary
            basis: Most of KC's pull requests are small and reviewed the same day
      execution:
        trigger_type: event
        schedule: Every 4 hours at :23, plus each completed pull-request CI run in ai-ops-atlas
        environment: GitHub-hosted runner
        stages: [Restore last fingerprint, One GraphQL read, Sort into lanes, Stop when unchanged, Brief within caps, Report, Save fingerprint]
      governance:
        autonomy: 1
        autonomy_note: Runs on its own and decides what is worth saying, but only recommends. Merges stay with KC and the Merge Pull Request action; re-runs stay with Re-run Failed Jobs.
        data_sensitivity: internal
        approval: None needed to run; every change to a repository stays with KC
        credential_owner: KC (repository secrets in ai-ops-atlas)
        risk: low
        audit_log: GitHub Actions run history and job summaries; optional live feed reports
      cost:
        budget: At most 4 Claude briefs a day and $1 a month, enforced in the script before each call
        notes: Unchanged runs make one GraphQL request (about 50 KB and 5 points of the 5,000 hourly budget at 45 open pull requests) and no Claude call. Actions minutes are free on this public repository.
      docs:
        technical: ops/merge-flow/README.md
        runbook: ops/merge-flow/README.md#runbook
        known_issues:
          - Without MERGE_FLOW_TOKEN only public repositories are readable
        improvements:
          - Bring behind branches up to date automatically, once KC approves that level 3 step
        last_review: 2026-10-30
