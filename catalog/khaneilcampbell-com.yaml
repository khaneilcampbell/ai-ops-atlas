# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: portfolio-site
  name: Portfolio Web Studio
  former_names: [Portfolio Site]
  summary: >-
    Static portfolio at khaneilcampbell.com, served by GitHub Pages and built
    with Claude as a working partner.
  status: active
  repository: khaneilcampbell/khaneilcampbell.com
  tags: [portfolio, static-site, github-pages, claude]
  district: career-portfolio
  links:
    - label: Live site
      url: https://khaneilcampbell.com

agents:
  - id: site-builder
    name: Claude Site Assistant
    purpose: >-
      Drafts page copy, design changes and pull requests that KC reviews
      before merging.
    framework: Claude Code
    model: Claude
    runtime: Claude Code sessions
    status: active
    trigger: On request, through pull requests
    last_run: 2026-10-26T06:52:28Z
    history:
      - at: 2026-10-26
        event: Updated GitHub links to the khaneilcampbell username (#45)
      - at: 2026-10-24
        event: Rewrote home, About, Work and Contact copy (#36 to #43)
    permissions:
      - 'GitHub: push branches and open pull requests through Claude Code; only KC merges'
    registry:
      title: Portfolio Web Developer
      category: engineering
      subcategory: Repository maintenance
      classification:
        type: A
        confidence: verified
        evidence: Claude Code sessions draft changes and open pull requests (#36 to #45) that KC merges
      mission:
        problem: Keeps the portfolio site current without hand-editing every page.
        outcomes: ["Reviewed pull requests for copy, design and link changes"]
        beneficiaries: [KC, Site visitors]
      responsibilities:
        tasks: [Draft page copy and design changes, Open pull requests for review]
        tools: [Claude Code, Git, GitHub]
        inputs: [KC's request]
        outputs: [Pull requests]
      execution:
        trigger_type: manual
        environment: Claude Code sessions
      governance:
        autonomy: 2
        autonomy_note: Changes reach the live site only after KC merges the pull request.
        approval: KC reviews and merges every pull request
        data_sensitivity: public
        credential_owner: KC (Claude's GitHub access to the repository)
        risk: low
        audit_log: Pull request history on GitHub
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/khaneilcampbell-com.md#claude-site-assistant
        known_issues:
          - "Recent pull request titles (#20 to #45) don't use the Conventional Commits format that CONTRIBUTING.md asks for"
          - No KPI is defined yet
        improvements:
          - Use Conventional Commits titles on its pull requests
        last_review: 2026-10-28

  - id: site-audit
    name: Site Audit
    purpose: >-
      Audits static HTML pages for security headers, accessibility and link
      hygiene.
    framework: Python script
    owned_by: site-builder            # owning agent, confirmed by Khaneil 2026-11-12
    runtime: Local
    status: idle
    trigger: Manual, python scripts/site_audit.py
    source: scripts/site_audit.py
    last_run: null
    permissions:
      - Reads the site folder; writes nothing and makes no network calls
    registry:
      title: Website Quality Auditor
      category: engineering
      subcategory: Code quality
      classification:
        type: C
        confidence: verified
        evidence: scripts/site_audit.py checks headers, accessibility, links and credential-shaped strings; no AI model
      mission:
        problem: Catches missing security headers, accessibility basics, broken internal links and credential-shaped strings before a page ships.
        outcomes:
          - Findings per page and an exit code CI can block on
      responsibilities:
        tasks: [Check required security headers, Accessibility and link hygiene checks, Flag credential-shaped values]
        tools: [Python standard library]
        inputs: [Site root folder]
        outputs: [Audit findings and an exit code]
      execution:
        trigger_type: manual
        environment: Local
      governance:
        autonomy: 0
        data_sensitivity: public
        credential_owner: None needed (reads local files only)
        risk: low
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/khaneilcampbell-com.md#site-audit
        known_issues:
          - It checks the _headers file, which GitHub Pages ignores; the CSP meta tags are what is in force on the live site
          - No KPI is defined yet
        improvements:
          - Check the headers the live site actually sends
        last_review: 2026-10-28

  - id: security-check
    name: Security Check Workflow
    purpose: >-
      Checks every page for a Content Security Policy and other HTML security
      rules on each push and pull request.
    framework: GitHub Actions
    owned_by: site-builder            # owning agent, confirmed by Khaneil 2026-11-12
    runtime: GitHub-hosted runner
    status: active
    trigger: Push or pull request to main
    source: .github/workflows/security-check.yml
    observe:
      github_workflow: security-check.yml
    last_run: null
    permissions:
      - GITHUB_TOKEN with the repository's default permissions (the workflow sets none)
      - No repository secrets
    registry:
      title: Website Security Analyst
      category: security
      subcategory: Security configuration auditing
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/security-check.yml checks CSP and HTML security rules on push and pull request
      mission:
        problem: No page should ship without its Content Security Policy and basic HTML security rules.
        outcomes:
          - A failed check whenever a page misses its policy
      responsibilities:
        tasks: [Check every page for a Content Security Policy, Enforce HTML security rules]
        tools: [GitHub Actions, shell]
        inputs: [Pushes and pull requests to main]
        outputs: [Check results]
      goals:
        objective: No page ships without its security policy.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        credential_owner: KC (GitHub repository settings)
        risk: low
        audit_log: GitHub Actions run history
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/khaneilcampbell-com.md#security-check-workflow
        known_issues:
          - No permissions block, so the token gets the repository default
          - Checks only pages at the repository root
          - Requires _headers although GitHub Pages ignores that file
          - Inline event handlers only warn
        improvements:
          - 'Add permissions: contents: read'
          - Move these checks into scripts/site_audit.py so one script owns them
        last_review: 2026-10-28

  - id: site-ci
    name: Site CI
    purpose: Audits every page and the site scripts, and packages the site on request.
    framework: GitHub Actions
    owned_by: site-builder            # owning agent, confirmed by Khaneil 2026-11-12
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual
    source: .github/workflows/site-ci.yml
    observe:
      github_workflow: site-ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read'
      - No repository secrets
    registry:
      title: Portfolio Quality Engineer
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/site-ci.yml runs scripts/site_audit.py, site_inventory.py and ruff; no AI model
      mission:
        problem: Keeps headers, accessibility basics and internal links correct on every change.
        outcomes: ["Every pull request passes the site audit before merge"]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Run the site audit, Build the page inventory, Lint the Python scripts, Optional site bundle on manual dispatch]
        tools: [GitHub Actions, Python, ruff]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request, Site zip and inventory when requested]
      goals:
        objective: Block merges that break the published site.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        risk: low
        audit_log: GitHub Actions run history
        credential_owner: KC (GitHub repository settings)
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/khaneilcampbell-com.md#site-ci
        known_issues:
          - Actions are pinned by major version tag (checkout@v4, setup-python@v5), not commit
        improvements:
          - Pin actions to commit SHAs and let Dependabot bump them
        last_review: 2026-10-28

  - id: career-execution
    name: Career Execution Agent
    purpose: >-
      n8n workflow that turns a job link or pasted job description into a resume summary, cover note and
      recruiter message built only from Khaneil's confirmed facts, then emails Khaneil the drafts to review.
      It never applies or messages anyone.
    framework: n8n
    model: claude-opus-5-5 (drafts), claude-haiku-5-5 (requirements)
    runtime: n8n Cloud
    status: paused
    trigger: Job form, plus a Monday 9am summary and a daily 10am review nudge
    alerts:
      not_running: Draft. Unpublished in n8n until Khaneil confirms the facts table and approves publishing
    last_run: null
    history:
      - at: 2026-11-12
        event: Built as an unpublished n8n draft; test run on a sample job post passed with no real sending
    links:
      - label: n8n workflow
        url: https://khancam15.app.n8n.cloud/workflow/Zd379gPsiCcBQfwo
      - label: Tracker
        url: https://khancam15.app.n8n.cloud/projects/qhAhqRqO8TimFtxs/datatables/hFhMgfm236UyA8ii
    permissions:
      - Anthropic, through the n8n credential on Extract Requirements and Draft Application
      - 'Resend API: review, failure, weekly summary and nudge emails to Khaneil only'
      - 'n8n data tables: writes career_applications, reads career_verified_facts'
      - Reads public job pages with a plain GET; no logins
    registry:
      title: Career Application Coordinator
      tier: specialized
      category: business
      subcategory: Career applications
      classification:
        type: B
        confidence: verified
        evidence: Fixed n8n workflow with one Haiku extraction call and one Opus drafting call; project matching and citation checks are plain code
      mission:
        problem: Tailoring each application by hand takes time and invites claims that can't be backed up.
        outcomes:
          - Each job gets a cited draft to review, with unsupported sentences marked Unverified
          - Nothing is sent to a company or recruiter
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Read the job page or pasted description, Extract requirements, Pick the 1 to 3 strongest projects, Draft resume summary cover note and recruiter message, List missing requirements and one interview question, Save a Draft row and email Khaneil for review]
        tools: [n8n Cloud, Claude (claude-haiku-5-5 and claude-opus-5-5), n8n data tables, Resend]
        inputs: [Job form, Confirmed rows in career_verified_facts]
        outputs: [Draft row in career_applications, Review email with a .md attachment]
        limitations: [Only confirmed facts are used, Job pages that need a login need the description pasted]
      goals:
        objective: Cut tailoring time without inventing experience.
        kpis:
          - name: Applications reviewed
            kind: throughput
            basis: Tracker status Reviewed or Submitted, in the Monday summary email
          - name: Applications submitted
            kind: throughput
            basis: Tracker status Submitted, set by Khaneil after applying
          - name: Tailoring minutes
            kind: other
            basis: tailoring_minutes column, filled in by Khaneil
          - name: Interview stories practiced
            kind: other
            basis: stories_practiced column, filled in by Khaneil
      execution:
        trigger_type: event
        environment: n8n
        stages: [Spend check, Read job, Extract requirements, Match projects, Draft, Check citations, Save draft, Review email]
      governance:
        autonomy: 1
        autonomy_note: Drafts only. Khaneil reviews every draft and applies by hand. Spend cap $3 a month checked before any AI call, each step retries at most 3 times, and failures email Khaneil.
        approval: Khaneil reviews each draft; publishing the workflow needs Khaneil's OK
        data_sensitivity: confidential
        credential_owner: Khaneil (n8n credentials)
        risk: low
        audit_log: n8n executions and the career_applications data table
      docs:
        known_issues:
          - Draft until Khaneil confirms the facts in career_verified_facts and approves publishing
          - Atlas has no live data for it yet; results stay in n8n
        improvements:
          - Connect n8n executions to Atlas
        last_review: 2026-11-12
