# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# AI Ops Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: career-optimizer
  name: AI Career Application Optimization System
  summary: >-
    Human-in-the-loop workflow that turns a job posting into a tailored,
    ATS-readable resume from a verified career database, and tracks every
    application.
  status: active
  repository: khaneilcampbell/job-applications-workflow
  tags: [claude, career, human-in-the-loop]

agents:
  - id: job-analyst
    name: Job Description Analyst
    purpose: >-
      Breaks a job posting into required and preferred skills, gaps and a
      match assessment against the career database.
    framework: Claude prompt
    model: Claude
    runtime: Claude chat, run by hand
    status: idle
    trigger: Manual, per application
    source: prompts/job-analysis.md
    last_run: null
    registry:
      title: Job Requirements Analyst
      category: career
      subcategory: Job description analysis
      classification:
        type: B
        confidence: unverified
        evidence: Private repository; manifest says a Claude prompt run by hand
      responsibilities:
        inputs: [Job posting, Career database]
        outputs: [Required and preferred skills, Gaps, Match assessment]
      execution:
        trigger_type: manual
      governance:
        autonomy: 1

  - id: resume-tailor
    name: Resume Tailoring Assistant
    purpose: >-
      Re-angles verified facts into a tailored summary, bullets, projects and
      skills. It may re-angle facts but never invent them.
    framework: Claude prompt
    model: Claude
    runtime: Claude chat, run by hand
    status: idle
    trigger: Manual, after job analysis
    source: prompts/resume-tailoring-assistant.md
    last_run: null
    registry:
      category: career
      subcategory: Resume optimization
      classification:
        type: B
        confidence: unverified
        evidence: Private repository; manifest says a Claude prompt run by hand
      responsibilities:
        inputs: [Job analysis, Career database]
        outputs: ["Tailored summary, bullets, projects and skills"]
        dependencies: [job-analyst]
        limitations: [May re-angle verified facts but never invent them]
      execution:
        trigger_type: manual
      governance:
        autonomy: 1
        approval: KC approves the final resume

  - id: resume-quality-review
    name: Quality Reviewer
    purpose: >-
      Checks accuracy against the career database, ATS readability, grammar
      and formatting before human approval.
    framework: Claude prompt
    model: Claude
    runtime: Claude chat, run by hand
    status: idle
    trigger: Manual, before the final resume
    source: prompts/quality-review.md
    last_run: null
    registry:
      title: Application Quality Reviewer
      category: career
      subcategory: Application quality review
      classification:
        type: B
        confidence: unverified
        evidence: Private repository; manifest says a Claude prompt run by hand
      responsibilities:
        inputs: [Tailored resume, Career database]
        outputs: ["Accuracy, ATS, grammar and formatting review"]
        dependencies: [resume-tailor]
      execution:
        trigger_type: manual
      governance:
        autonomy: 1
        approval: Human approval before the resume is used

  - id: career-db-validator
    name: Career Database Validator
    purpose: >-
      Flags invalid JSON, TODO placeholders, unverified entries and metrics
      without a source in the career database.
    framework: Python script
    runtime: Local
    status: idle
    trigger: Manual, python scripts/validate_database.py
    source: scripts/validate_database.py
    last_run: null
    registry:
      title: Career Data Quality Validator
      category: career
      subcategory: Data validation
      classification:
        type: C
        confidence: unverified
        evidence: Private repository; manifest says a Python script that flags invalid entries
      responsibilities:
        inputs: [Career database JSON]
        outputs: ["List of invalid JSON, TODOs, unverified entries and unsourced metrics"]
      execution:
        trigger_type: manual
        environment: Local
      governance:
        autonomy: 0

  - id: career-ci
    name: Career Workflow CI
    purpose: Lints and tests the career scripts and blocks commits of personal data.
    framework: GitHub Actions
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual
    source: .github/workflows/ci.yml
    observe:
      github_workflow: ci.yml
    last_run: null
    registry:
      title: Career Workflow Continuous Integration
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/ci.yml runs ruff, pytest on templates and scripts, and fails if private/ or documents are tracked; no AI model
      mission:
        problem: Keeps the validator and tracker working and personal data out of git.
        outcomes: ["Every pull request is tested and checked for personal data before merge"]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Lint the scripts, Test templates and the database validator, Test the tracker build, Fail if personal data is tracked, Optional blank tracker on manual dispatch]
        tools: [GitHub Actions, ruff, pytest, openpyxl]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request, Blank tracker when requested]
      goals:
        objective: Block merges that break the scripts or leak personal data.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: internal
        risk: low
        audit_log: GitHub Actions run history
        credential_owner: KC (GitHub repository settings)
