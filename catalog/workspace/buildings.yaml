# Display names for the buildings the map draws itself (landmarks, Financial District towers,
# stations). Catalog project buildings are renamed in their own manifest (`project.name`).
#
# Rename a building here without touching code. The key is the building's stable id (its map
# selection key) and must never change: saved selections, interiors and integrations use it.
#   display_name   what the map plaque, inspector, navigation and search show
#   organization   who the building belongs to, kept as metadata (optional)
#   former_names   earlier names, still found by search but never shown (optional)
# Format: docs/modules.md, "Rename a building".
schema: atlas/buildings-v1

buildings:
  # Nov 24: buildings grouped with one of the eight core buildings (workspace.yaml `merged`) house no
  # module for now, so they carry a placeholder name after their core building (Khaneil: "rename
  # buildings that don't have a module, something for now"). Their earlier names stay in former_names.
  "service:benjaire-marketing":
    display_name: Product & Growth Studio
    organization: Benjaire
    former_names: [Benjaire Marketing Agency, Growth & Marketing Studio]
  # Nov 11: every Financial District building belongs to Benjaire. Each is one of Benjaire's
  # finance and operations buildings; the fictional brands they used to carry stay in former_names
  # so search still finds them. What Benjaire data each building holds: catalog/workspace/finance.yaml.
  "service:financial:residence":
    display_name: Data Intelligence Center
    organization: Benjaire
    former_names: [Aldren Insights]
  "service:financial:banks":
    display_name: Financial Operations Tower
    organization: Benjaire
    former_names: [Bayvale Bank]
  "service:financial:financial-planning":
    display_name: Knowledge & Research Center
    organization: Benjaire
    former_names: [Ravelle Advisors]
  "service:financial:budget":
    display_name: Budget & Forecasting Center
    organization: Benjaire
    former_names: [Ellery Budget Center]
  "service:financial:records":
    display_name: Governance & Compliance Center
    organization: Benjaire
    former_names: [Halden Trust]
  "service:bmw-dealership":
    display_name: Security & Infrastructure Showroom
    organization: Filler building
    former_names: [Ironwood Hall, Vantor Motors, Infrastructure Operations Hub]
  "service:financial:investments":
    display_name: Investment Operations Center
    organization: Benjaire
    former_names: [Robin Exchange, Integration Exchange]
  "service:atlas-marketplace":
    display_name: Product & Growth Arcade
    organization: Filler building
    former_names: [Seaview Arcade, Atlas Marketplace, Product Marketplace]
  "service:atlas-station":
    display_name: Workflow Automation Hub
    organization: Atlas
    former_names: [Atlas Central Station]
  # Nov 11: the rest of the map on the operational scheme. Buildings that house a module take the
  # module's name. Vendor & Supplier Hub houses Integration Exchange (workspace.yaml), whose vendor
  # catalog lists the outside services the manifests name. Nov 24: buildings with no module carry a
  # neutral filler name instead (see the note at the end of this file).
  "service:financial:harbor-residence":
    display_name: Client Success Center
    organization: Benjaire
    former_names: [Camton Hotel]
  "service:financial:circa":
    display_name: Team Residence Towers
    organization: Benjaire
    former_names: [Ellipse Residences]
  "service:financial:insurance":
    display_name: Risk & Insurance Center
    organization: Benjaire
    former_names: [Merrow Credit Union]
  "service:financial:business-finance":
    display_name: Business Finance Center
    organization: Benjaire
    former_names: [Corvane Capital]
  # Nov 24: Atlas AI Operations Center stands on the plot of the Business Finance, Risk & Insurance,
  # Knowledge & Research and Client Success towers, which are now its floors (aiOpsCenterPlan.ts).
  "service:ai-operations-center":
    display_name: Atlas AI Operations Center
    organization: Atlas
  "service:atlas-galleria":
    display_name: Business Operations HQ
    organization: Benjaire
    former_names: [Atlas Galleria, Vendor & Supplier Hub]
  "service:skyline-stadium":
    display_name: Atlas Commons Arena
    organization: Filler building
    former_names: [Oakridge Hall, Team Events Arena, Atlas Stadium]
  # Nov 18: public plaza in front of the Growth & Marketing Studio; its sign shows live automation status.
  "service:automation-plaza":
    display_name: Atlas Automation Plaza
    organization: Atlas
  # Nov 19: café pavilion on the square east of the plaza; agents visit it in their free time (simulated).
  "service:community-cafe":
    display_name: Community Pavilion & Café
    organization: Atlas
  "service:stadium-station":
    display_name: Atlas Commons Station
    organization: Filler building
    former_names: [Pinecrest Station, Events Arena Station, Stadium Station]
  "service:airport-building:terminal":
    display_name: Atlas Airport Terminal
    organization: Filler building
    former_names: [Hawthorn Hall, Passenger Terminal, Atlas · Terminal]
  "service:airport-building:tower":
    display_name: Atlas Airport Control Tower
    organization: Filler building
    former_names: [Rowan Tower, Air Traffic Control, Atlas · Air Traffic]
  "service:airport-building:cargo":
    display_name: AI Engineering Hangar
    organization: Filler building
    former_names: [Quarry House, Atlas · Cargo, Model Intelligence Lab]
  "service:airport-building:operations":
    display_name: Security & Infrastructure Office
    organization: Filler building
    former_names: [Sparrow Hall, Atlas · Operations, Observability Center]
  # Nov 24: buildings that house no module get a neutral filler name, so nobody reads a purpose into them
  # (Khaneil: "make the other buildings not in a module a random building name ... label it as a filler
  # building"). Their earlier names stay in former_names for search.
  "service:financial-station":
    display_name: Business Operations Station
    organization: Filler building
    former_names: [Birch Lane Station, Financial District Station]
  # Nov 24: filler buildings are named after the core building or place they are grouped with (workspace.yaml merged),
  # so the map reads by group: "Security & Infrastructure Showroom", "Product & Growth Arcade", "Atlas Airport Terminal".
