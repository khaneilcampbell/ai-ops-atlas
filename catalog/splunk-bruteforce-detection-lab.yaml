# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: soc-lab
  name: Security Operations Center
  former_names: [SOC Lab]
  summary: >-
    Simulates SMB brute-force activity in an isolated lab, detects it in
    Splunk and generates SOC case notes through the Splunk REST API.
  status: active
  repository: khaneilcampbell/splunk-bruteforce-detection-lab
  tags: [splunk, detection-engineering, python, soc]
  district: security-infrastructure
  module: security-operations-center
  links:
    - label: Case study
      url: https://khaneilcampbell.com/soc-automation-lab.html
    - label: Project docs
      url: https://github.com/khaneilcampbell/ai-ops-atlas/tree/main/docs/intelligence-hub

agents:
  - id: soc-case-notes
    name: SOC Case Note Automation
    purpose: >-
      Authenticates to the Splunk REST API, runs the brute-force search,
      parses results and writes a structured Markdown case note for review.
    framework: Python script
    owned_by: soc-detection-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: Lab VM (manual)
    status: idle
    trigger: Manual, python3 soc_automation.py
    source: soc_automation.py
    last_run: null
    history:
      - at: 2026-10-11
        event: Automation script restored to the repository
    permissions:
      - Splunk REST API with the lab account in SPLUNK_USER and SPLUNK_PASS
      - Writes Markdown notes to notes/
    registry:
      title: Security Case Documentation Specialist
      category: security
      subcategory: Detection analysis
      classification:
        type: C
        confidence: verified
        evidence: soc_automation.py calls the Splunk REST API and formats a Markdown note; no AI model is called
      mission:
        problem: Writing a case note from search results by hand is slow and inconsistent.
        outcomes:
          - A Markdown case note per run listing each alert with account, source and severity
      responsibilities:
        tasks: [Authenticate to the Splunk REST API, Run the brute-force search, Write a structured case note]
        tools: [Splunk REST API, Python requests]
        inputs: [SPLUNK_USER and SPLUNK_PASS environment variables]
        outputs: [Markdown case note in notes/]
        dependencies: [bruteforce-detection]
        limitations: [Lab only; Splunk at https://localhost:8089 with TLS verification disabled]
      execution:
        trigger_type: manual
        environment: Lab VM
      governance:
        autonomy: 0
        data_sensitivity: internal
        credential_owner: KC (lab Splunk account, set as environment variables)
        risk: low
      docs:
        technical: WALKTHROUGH.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#soc-case-note-automation
        known_issues:
          - The project name says AI-assisted, which refers to how the lab was built, not to this script
          - TLS verification is off (verify=False) for the lab's self-signed certificate
          - 'Its built-in search differs from queries/brute_force_detection.spl: it rates 20 or more failures High and 10 to 19 Medium, while the file rates every hit High'
          - The search sets no time range, so it scans all indexed data
          - No KPI is defined yet
        improvements:
          - Load the search from queries/ so the two can't drift
          - Add a time range
          - Clear exit codes and a retry on network errors
        last_review: 2026-10-28

  - id: bruteforce-detection
    name: Brute Force Detection Search
    purpose: >-
      SPL search over Windows Security EventCode 4625 that flags repeated
      failed SMB logons from one source.
    framework: Splunk SPL
    owned_by: soc-detection-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: Splunk Enterprise (lab)
    status: idle
    trigger: Splunk search or alert
    source: queries/brute_force_detection.spl
    last_run: null
    permissions:
      - Splunk search on index main (WinEventLog:Security)
    registry:
      title: Threat Detection Analyst
      category: security
      subcategory: Detection analysis
      classification:
        type: C
        confidence: verified
        evidence: queries/brute_force_detection.spl flags 10 or more EventCode 4625 failures per account and source in 5 minutes
      mission:
        problem: Repeated failed SMB logons from one source are a brute-force signal buried in Windows Security logs.
        outcomes:
          - One row per account and source over the threshold, rated by severity
      responsibilities:
        tasks: [Flag repeated failed SMB logons from one source]
        tools: [Splunk SPL]
        inputs: [WinEventLog:Security in index main]
        outputs: ["Rows with account, source address, count and severity"]
      execution:
        trigger_type: manual
        environment: Splunk Enterprise (lab)
      governance:
        autonomy: 0
        data_sensitivity: internal
        credential_owner: KC (lab Splunk account)
        risk: low
      docs:
        technical: WALKTHROUGH.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#brute-force-detection-search
        known_issues:
          - Whether it runs as a scheduled Splunk alert is not in the repository
          - Fixed 5 minute buckets can split one burst across two buckets and miss it
          - No KPI is defined yet
        improvements:
          - Use a sliding window (streamstats) and save it as a scheduled alert
        last_review: 2026-10-28

  - id: soc-lab-ci
    name: SOC Lab CI
    purpose: Lints and tests the SOC automation script against a mocked Splunk API.
    framework: GitHub Actions
    owned_by: soc-detection-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual
    source: .github/workflows/ci.yml
    observe:
      github_workflow: ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read'
      - No repository secrets
    registry:
      title: Detection Quality Engineer
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/ci.yml runs ruff, compileall and pytest with Splunk mocked; no AI model
      mission:
        problem: Keeps the detection query and case note generator from breaking silently.
        outcomes: ["Every pull request is linted and tested before merge"]
        beneficiaries: [KC]
      responsibilities:
        tasks: [Lint soc_automation.py, Test the SPL detection logic, Test Splunk REST calls with a mocked API, Test case note output]
        tools: [GitHub Actions, ruff, pytest]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request]
      goals:
        objective: Catch broken detection or reporting logic before merge.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        risk: low
        audit_log: GitHub Actions run history
        credential_owner: KC (GitHub repository settings)
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#soc-lab-ci
        known_issues:
          - security-guardrails.yml (gitleaks and inline secret checks) also runs but is not in the catalog
        improvements:
          - Add security-guardrails.yml to the catalog
        last_review: 2026-10-28

  # Owning agent (2026-11-13, Khaneil asked that every automation have one). It has no model or
  # runtime of its own: its automations, which name it in owned_by, are the steps it runs.
  - id: soc-detection-lead
    name: Security Detection Lead
    purpose: >-
      Owns the brute-force detection lab: the detection search for repeated failed logons, the case notes written from its results, and the tests that keep both working. It has no model of its own yet; it works through the automations it owns.
    framework: Atlas owning agent (runs through its automations)
    model: None of its own; each automation it owns keeps its own model and cap
    runtime: Through its automations
    status: active
    trigger: Khaneil runs the detection and case notes; tests run on every change
    last_run: null
    history:
      - at: 2026-11-13
        event: Added as the owning agent of Threat Detection Analyst, Security Case Documentation Specialist, Detection Quality Engineer, at Khaneil's request
    registry:
      title: Security Detection Lead
      category: security
      subcategory: Threat detection
      tier: coordinator
      automation_category: security
      classification:
        type: A
        confidence: verified
        evidence: Owning agent defined in the Atlas catalog on 2026-11-13; its automations name it in owned_by. It has no model of its own and no run of its own has been seen.
      responsibilities:
        tasks: [Flag repeated failed logons from one source, Write case notes from the results, Test the detection and case notes on every change]
        tools: [Its automations]
        outputs: [The results of its automations]
      execution:
        trigger_type: manual
        environment: Through its automations
      governance:
        autonomy: 0
        autonomy_note: Detects and documents only; it blocks nothing.
        risk: low
      cost:
        budget: No model calls of its own; each automation keeps its own cap.
