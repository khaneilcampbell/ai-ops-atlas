# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: soc-lab
  name: Security & Infrastructure Center
  former_names: [SOC Lab, Security Operations Center]
  summary: >-
    Simulates SMB brute-force activity in an isolated lab, detects it in
    Splunk and generates SOC case notes through the Splunk REST API.
  status: active
  repository: khaneilcampbell/splunk-bruteforce-detection-lab
  tags: [splunk, detection-engineering, python, soc]
  district: security-infrastructure
  module: security-operations-center
  links:
    - label: Case study
      url: https://khaneilcampbell.com/soc-automation-lab.html
    - label: Project docs
      url: https://github.com/khaneilcampbell/ai-ops-atlas/tree/main/docs/intelligence-hub

agents:
  - id: soc-case-notes
    name: SOC Case Note Automation
    purpose: >-
      Authenticates to the Splunk REST API, runs the brute-force search,
      parses results and writes a structured Markdown case note for review.
    framework: Python script
    owned_by: soc-detection-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: Lab VM (manual)
    status: idle
    trigger: Manual, python3 soc_automation.py
    source: soc_automation.py
    last_run: null
    history:
      - at: 2026-10-11
        event: Automation script restored to the repository
    permissions:
      - Splunk REST API with the lab account in SPLUNK_USER and SPLUNK_PASS
      - Writes Markdown notes to notes/
    registry:
      title: "SOC · Write Case Notes"
      category: security
      subcategory: Detection analysis
      classification:
        type: C
        confidence: verified
        evidence: soc_automation.py calls the Splunk REST API and formats a Markdown note; no AI model is called
      mission:
        problem: Writing a case note from search results by hand is slow and inconsistent.
        outcomes:
          - A Markdown case note per run listing each alert with account, source and severity
      responsibilities:
        tasks: [Authenticate to the Splunk REST API, Run the brute-force search, Write a structured case note]
        tools: [Splunk REST API, Python requests]
        inputs: [SPLUNK_USER and SPLUNK_PASS environment variables]
        outputs: [Markdown case note in notes/]
        dependencies: [bruteforce-detection]
        limitations: [Lab only; Splunk at https://localhost:8089 with TLS verification disabled]
      goals:
        review_frequency: Quarterly
        kpis:
          - name: Case note per detection run
            kind: throughput
            target: One structured note per run
            basis: Its only output
        objective: Write a reviewable case note for every detection run.
      execution:
        trigger_type: manual
        environment: Lab VM
      governance:
        autonomy: 0
        data_sensitivity: internal
        credential_owner: Khaneil (lab Splunk account, set as environment variables)
        risk: low
      docs:
        technical: WALKTHROUGH.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#soc-case-note-automation
        known_issues:
          - The project name says AI-assisted, which refers to how the lab was built, not to this script
          - TLS verification is off (verify=False) for the lab's self-signed certificate
          - 'Its built-in search differs from queries/brute_force_detection.spl: it rates 20 or more failures High and 10 to 19 Medium, while the file rates every hit High'
          - The search sets no time range, so it scans all indexed data
          - No KPI is defined yet
        improvements:
          - Load the search from queries/ so the two can't drift
          - Add a time range
          - Clear exit codes and a retry on network errors
        last_review: 2026-10-28

  - id: bruteforce-detection
    name: Brute Force Detection Search
    purpose: >-
      SPL search over Windows Security EventCode 4625 that flags repeated
      failed SMB logons from one source.
    framework: Splunk SPL
    owned_by: soc-detection-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: Splunk Enterprise (lab)
    status: idle
    trigger: Splunk search or alert
    source: queries/brute_force_detection.spl
    last_run: null
    permissions:
      - Splunk search on index main (WinEventLog:Security)
    registry:
      title: "SOC · Brute Force Detection Search"
      category: security
      subcategory: Detection analysis
      classification:
        type: C
        confidence: verified
        evidence: queries/brute_force_detection.spl flags 10 or more EventCode 4625 failures per account and source in 5 minutes
      mission:
        problem: Repeated failed SMB logons from one source are a brute-force signal buried in Windows Security logs.
        outcomes:
          - One row per account and source over the threshold, rated by severity
      responsibilities:
        tasks: [Flag repeated failed SMB logons from one source, Rate each source's severity by failed logon count]
        tools: [Splunk SPL]
        inputs: [WinEventLog:Security in index main]
        outputs: ["Rows with account, source address, count and severity"]
        dependencies:
          - Splunk index main (WinEventLog:Security)
        limitations:
          - Fixed 5 minute buckets can split one burst and miss it
          - Whether it runs as a scheduled alert is not in the repository
      goals:
        review_frequency: Quarterly
        kpis:
          - name: Repeated failed logons flagged
            kind: quality
            target: Every source over the failed-logon threshold is flagged
            basis: The search's purpose
        objective: Flag brute-force logon attempts from one source.
      execution:
        trigger_type: manual
        environment: Splunk Enterprise (lab)
      governance:
        autonomy: 0
        data_sensitivity: internal
        credential_owner: Khaneil (lab Splunk account)
        risk: low
      docs:
        technical: WALKTHROUGH.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#brute-force-detection-search
        known_issues:
          - Whether it runs as a scheduled Splunk alert is not in the repository
          - Fixed 5 minute buckets can split one burst across two buckets and miss it
          - No KPI is defined yet
        improvements:
          - Use a sliding window (streamstats) and save it as a scheduled alert
        last_review: 2026-10-28

  - id: soc-lab-ci
    name: SOC Lab CI
    purpose: Lints and tests the SOC automation script against a mocked Splunk API.
    framework: GitHub Actions
    owned_by: soc-detection-lead            # owning agent, added at Khaneil's request 2026-11-13
    runtime: GitHub-hosted runner
    status: active
    trigger: Push, pull request or manual
    source: .github/workflows/ci.yml
    observe:
      github_workflow: ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read'
      - No repository secrets
    registry:
      title: "SOC · Lint and Test"
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/ci.yml runs ruff, compileall and pytest with Splunk mocked; no AI model
      mission:
        problem: Keeps the detection query and case note generator from breaking silently.
        outcomes: ["Every pull request is linted and tested before merge"]
        beneficiaries: [Khaneil]
      responsibilities:
        tasks: [Lint soc_automation.py, Test the SPL detection logic, Test Splunk REST calls with a mocked API, Test case note output]
        tools: [GitHub Actions, ruff, pytest]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request]
        dependencies:
          - GitHub Actions runners
        limitations:
          - Tests the detection logic, not a live Splunk instance
      goals:
        objective: Catch broken detection or reporting logic before merge.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; target proposed 2026-11-17 from production history, Khaneil can change it
            target: At least 90% of runs succeed
        review_frequency: Monthly
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        risk: low
        audit_log: GitHub Actions run history
        credential_owner: Khaneil (GitHub repository settings)
      docs:
        technical: README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#soc-lab-ci
        known_issues:
          - security-guardrails.yml (gitleaks and inline secret checks) also runs but is not in the catalog
        improvements:
          - Add security-guardrails.yml to the catalog
        last_review: 2026-10-28

  - id: connor-security-sheet
    name: Atlas Security Sheet
    purpose: >-
      n8n workflow that reads, read-only, the open Dependabot, code scanning and secret scanning alerts,
      default-branch protection and rulesets, and the last CI run of every repository in the Atlas
      catalog, writes them to the "Atlas Security Data" Google Sheet, and adds a version of that data to
      the Atlas Output Library. No AI step.
    framework: n8n
    owned_by: soc-detection-lead
    model: None (plain code, no AI step)
    runtime: n8n Cloud
    status: paused
    trigger: Daily 7:00am ET once published; unpublished draft, run by hand
    last_run: 2026-11-22T21:26:03Z
    history:
      - at: 2026-11-22
        event: Built as an unpublished n8n draft at Khaneil's request, owned by Connor Walsh
      - at: 2026-11-22
        event: Two test runs by hand (897, 898) passed; the second reused the same sheet with no duplicate rows and saved Library version 2
    links:
      - label: n8n workflow (Security sheet)
        url: https://khancam15.app.n8n.cloud/workflow/ArdLbnah1KgzAh7B
    permissions:
      - 'GitHub (n8n "GitHub account" credential): GET requests only, for repository details, alerts, branch protection, rulesets and Actions runs'
      - 'Google Sheets: creates the Atlas Security Data sheet once, then rewrites its tabs and appends its Run Log'
      - 'Atlas Output Library hook with the add-only AGENT_FEED_TOKEN: adds versions, can''t list or read anything'
    registry:
      title: "SOC · Security Data Sheet"
      category: security
      subcategory: Vulnerability management
      classification:
        type: B
        confidence: verified
        evidence: n8n workflow ArdLbnah1KgzAh7B (unpublished draft) calls only GitHub GET endpoints, Google Sheets and the Output Library hook; no AI model. Hand run 897 on 2026-11-22 read 6 repositories, wrote the sheet and stored Library version 1 (202, verified)
      mission:
        problem: Security alerts, branch protection and CI status for Atlas's repositories are spread across GitHub pages, with no single record over time.
        outcomes:
          - One sheet lists every open and past alert per repository, with severity, age and link
          - Default branches without protection and repositories with failing CI are counted
          - The Output Library keeps a dated version of the summary each run
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks: [Read open security alerts for each Atlas repository, Read default-branch protection and the last CI run, Keep the Atlas Security Data sheet current, Add each run's summary to the Output Library]
        tools: [Google Sheets, GitHub REST API (read only), Atlas Output Library]
        inputs: [The Atlas catalog repositories, GitHub alerts, branch protection and Actions runs]
        outputs: [Atlas Security Data Google Sheet (Summary, Alerts, Branch Protection, CI, Run Log), Atlas Security Data in the Output Library]
        dependencies:
          - GitHub REST API
          - Google Sheets
          - Atlas Output Library
        limitations:
          - Reads only; it never dismisses an alert or changes a repository setting
          - Reads at most 100 open alerts per repository and source per run
          - Never writes a leaked secret's value; secret scanning rows carry its type and link only
          - Runs only when started by hand until Khaneil publishes it
      goals:
        objective: Keep one current, dated record of Atlas's security posture.
        review_frequency: Monthly
        kpis:
          - name: Run success rate
            kind: reliability
            target: Every run rewrites the sheet and adds a Library version
            target_value: 100
            direction: min
            basis: A failed run leaves the sheet a day old
      execution:
        trigger_type: manual
        environment: n8n
      governance:
        autonomy: 0
        autonomy_note: Observes and records only; it opens no issues and changes nothing on GitHub.
        data_sensitivity: internal
        credential_owner: Khaneil (n8n credentials and Cloudflare Pages secrets)
        risk: low
        audit_log: n8n executions and the sheet's Run Log tab
      cost:
        budget: No model calls
      docs:
        technical: docs/output-library.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#atlas-security-sheet
        known_issues:
          - The GitHub credential is Khaneil's OAuth sign-in, which can also write; the workflow only sends GET requests. A read-only fine-grained token would be narrower
          - The Google Sheets credential can reach every sheet the account can; the workflow only touches the Atlas Security Data sheet
        last_review: 2026-11-22

  # Owning agent (2026-11-13, Khaneil asked that every automation have one). It has no model or
  # runtime of its own: its automations, which name it in owned_by, are the steps it runs.
  - id: soc-detection-lead
    name: Security Detection Lead
    purpose: >-
      Owns the brute-force detection lab: the detection search for repeated failed logons, the case notes written from its results, and the tests that keep both working. It has no model of its own yet; it works through the automations it owns.
    framework: Atlas owning agent (runs through its automations)
    model: None of its own; each automation it owns keeps its own model and cap
    runtime: Through its automations
    status: active
    trigger: Khaneil runs the detection and case notes; tests run on every change
    last_run: null
    history:
      - at: 2026-11-13
        event: Added as the owning agent of Threat Detection Analyst, Security Case Documentation Specialist, Detection Quality Engineer, at Khaneil's request
      - at: 2026-11-22
        event: Owns the Atlas Security Sheet n8n workflow (unpublished draft), which records Atlas's GitHub security alerts, branch protection and CI in a Google Sheet and the Output Library
    permissions:
      - None of its own; it acts only through the permissions listed on each automation it owns
    registry:
      identity:
        display_name: Connor Walsh
        accent: "#38BDF8"
        intro: "I own the brute-force detection lab: the Splunk search for repeated failed logons, the case notes written from its results, and the tests that keep both working. Detection and case notes are still run by hand."
        voice: "Incident-report style: source, count, window, evidence; no speculation."
        appearance: "Irish man in his early 30s, fair skin with freckles, short ginger hair, light ginger stubble, dark grey merino zip sweater over a white t-shirt"
        portrait:
          path: agents/soc-detection-lead.webp
          model: gpt_image_2_6
          job_id: a704bcd2-b729-420e-96f3-46e3a4698fd3
          prompt_version: 2
          generated_at: 2026-11-18
      title: Security Detection Lead
      category: security
      subcategory: Threat detection
      tier: coordinator
      automation_category: security
      classification:
        type: A
        confidence: verified
        evidence: Owning agent defined in the Atlas catalog on 2026-11-13; its automations name it in owned_by. It has no model of its own and no run of its own has been seen.
      mission:
        problem: The detection, its case notes and its tests need one owner so the lab stays working and documented.
        outcomes:
          - Repeated failed logons are flagged
          - Each detection run has a case note
          - Tests pass on every change
        beneficiaries:
          - Khaneil
      responsibilities:
        tasks: [Flag repeated failed logons from one source, Write case notes from the results, Test the detection and case notes on every change, Keep the Atlas Security Data sheet of GitHub alerts current]
        tools: [Its automations]
        outputs: [The results of its automations]
        inputs:
          - Windows Security events in Splunk
        dependencies:
          - bruteforce-detection
          - soc-case-notes
          - soc-lab-ci
          - connor-security-sheet
        limitations:
          - Acts only through the automations it owns; it has no model, schedule or credentials of its own
          - Detection and case notes are still run by hand
      goals:
        objective: Keep the brute-force detection lab working and documented.
        review_frequency: Quarterly
        kpis:
          - name: Owned automations healthy
            kind: reliability
            target: Every automation it owns shows healthy in Atlas
            basis: Its health is the worst of its automations'
      execution:
        trigger_type: manual
        environment: Through its automations
      governance:
        autonomy: 0
        autonomy_note: Detects and documents only; it blocks nothing.
        risk: low
        credential_owner: Khaneil, through the credentials of each automation it owns
      cost:
        budget: No model calls of its own; each automation keeps its own cap.
      docs:
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/splunk-bruteforce-detection-lab.md#soc-lab-ci
        last_review: 2026-11-17
