# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: benjaire-ops
  name: Benjaire Dashboard
  summary: >-
    Private business dashboard for Benjaire: traffic, sales, inquiries, n8n
    automation health, Cloudflare infrastructure and a manual finance ledger.
  status: active
  repository: khaneilcampbell/ai-ops-atlas
  tags: [benjaire, cloudflare, d1, dashboard]
  district: business-operations

agents:
  - id: benjaire-ops-ci
    name: Dashboard CI
    purpose: Type checks, tests and builds the dashboard and its Worker.
    framework: GitHub Actions
    runtime: GitHub-hosted runner
    status: active
    trigger: Push or pull request
    source: .github/workflows/dashboard-ci.yml
    observe:
      github_workflow: dashboard-ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read'
      - No repository secrets
    registry:
      title: Dashboard Quality Engineer
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/dashboard-ci.yml runs npm run ci, local D1 migrations and Playwright accessibility tests; no AI model
      mission:
        problem: Stops dashboard changes that break types, tests, the build or accessibility, or that commit a secret.
        outcomes:
          - Every pull request is tested before merge
        beneficiaries: [Khaneil]
      responsibilities:
        tasks:
          - Worker types and unit tests
          - Build
          - Secret scan of the build and sources
          - Apply D1 migrations locally
          - Accessibility and layout tests in light, dark, desktop and phone
        tools: [GitHub Actions, npm, Wrangler, Playwright]
        inputs: [Pushes and pull requests]
        outputs: [Check results on the pull request]
      goals:
        objective: Block merges that break the dashboard.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: internal
        credential_owner: Khaneil (GitHub repository settings)
        risk: low
        audit_log: GitHub Actions run history
      docs:
        technical: apps/benjaire-dashboard/docs/SETUP.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/benjaire-dashboard.md#dashboard-ci
        known_issues:
          - Shared Atlas repository health does not verify this project's live business operations
          - Live Cloudflare deployment linkage must be verified before retiring the source repository
        improvements:
          - Verify Cloudflare build root after repository consolidation
        last_review: 2026-10-28
