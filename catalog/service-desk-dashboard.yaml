# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: service-desk
  name: Service Desk
  summary: >-
    Streamlit dashboard that turns service desk ticket data into volume, backlog, SLA health, recurring issue and workload insight. Runs on synthetic tickets.
  status: active
  repository: khaneilcampbell/ai-ops-atlas
  tags: [itsm, dashboard]
  district: security-infrastructure

agents:
  - id: service-desk-codeql
    name: CodeQL Scan
    purpose: GitHub code scanning on pushes and pull requests, plus manually requested model-free triage of bounded Atlas and SOC Lab GitHub alerts. Unavailable security data remains unknown; no automatic repairs or alert dismissals.
    framework: GitHub Actions
    runtime: GitHub-hosted runner
    status: active
    trigger: Existing push, pull request and weekly scans; manual-only B4 alert triage
    source: .github/workflows/service-desk-codeql.yml
    observe:
      github_workflow: service-desk-codeql.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: security-events write (upload results), actions read, contents read'
      - No repository secrets
    registry:
      title: Application Security Analyst
      category: security
      subcategory: Vulnerability assessment
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/service-desk-codeql.yml runs CodeQL security-extended queries on actions and python; no AI model
      mission:
        problem: Finds security issues in the Python app and the workflows before they merge.
        outcomes:
          - Code scanning alerts for every pull request and weekly
        beneficiaries: [KC]
      responsibilities:
        tasks: [Analyze the Python code, Analyze the GitHub Actions workflows, Upload results to code scanning]
        tools: [GitHub Actions, CodeQL]
        inputs:
          - Pushes to main, pull requests, weekly schedule
        outputs: [Code scanning alerts, Check results, Manual B4 triage summary and artifact]
      goals:
        objective: Catch security issues before merge.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        schedule: Pull requests, pushes to main, and Mondays at 06:23 UTC
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        credential_owner: KC (GitHub repository settings)
        risk: low
        audit_log: GitHub Actions run history
      docs:
        technical: apps/service-desk/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/service-desk-dashboard.md#codeql-scan
        known_issues:
          - service-desk-ci.yml also runs but is not separately registered
          - Shared Atlas repository health does not verify the deployed Streamlit app
        improvements:
          - Verify hosting repository and entry path before retiring the source
        last_review: 2026-10-28
