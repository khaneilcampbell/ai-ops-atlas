      execution:
        trigger_type: scheduled
        schedule: 'Inside the monthly Product Lab run: 0 9 1 * * (America/New_York)'
        environment: n8n
      governance:
        autonomy: 1
        autonomy_note: Research and recommendation only; every claim needs a source link and estimates are labelled.
        data_sensitivity: internal
        credential_owner: Khaneil (n8n credentials)
        risk: low
      docs:
