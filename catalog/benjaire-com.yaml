# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# AI Ops Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: benjaire-site
  name: Benjaire HQ
  summary: >-
    Website for Benjaire, an Astro site on Cloudflare Workers with a contact
    Worker that forwards inquiries to the Benjaire Flow intake in n8n.
  status: active
  repository: khaneilcampbell/benjaire.com
  tags: [benjaire, astro, cloudflare, n8n]
  district: business-operations
  links:
    - label: Live site
      url: https://benjaire.com

agents:
  - id: benjaire-contact-worker
    name: Contact Form Worker
    purpose: >-
      Validates contact form submissions (Turnstile, rate limit) and forwards
      valid inquiries to the Benjaire Flow intake in n8n.
    framework: Cloudflare Worker
    runtime: Cloudflare Workers
    status: active
    trigger: POST /api/contact
    source: site/worker/index.ts
    observe:
      agent_feed: true
    # Customer-facing and unattended: a failed request alerts KC. It only runs when someone
    # posts the form, so a quiet stretch is normal and there is no silence window.
    alerts:
      failures: true
    last_run: null
    permissions:
      - 'Cloudflare Email Routing: send to verified destination addresses only'
      - 'Stripe restricted key: Checkout Sessions write (STRIPE_SECRET_KEY)'
      - Turnstile secret key (TURNSTILE_SECRET_KEY)
      - Benjaire Flow intake key, sent as x-flow-key (FLOW_INTAKE_KEY)
    registry:
      title: Inquiry Routing Coordinator
      category: business
      subcategory: Customer inquiry processing
      classification:
        type: E
        confidence: verified
        evidence: site/worker/index.ts validates the form, sends email, forwards to n8n and creates Stripe checkout sessions; no AI model
      mission:
        problem: Receives website inquiries and checkout requests safely without a separate backend.
        outcomes: [Valid inquiries reach the right inbox and Benjaire Flow, Spam and abuse are rejected]
        beneficiaries: [Benjaire customers, KC]
      responsibilities:
        tasks: [Check origin and rate limit, Verify Turnstile, Email the inquiry to the category recipient, Forward the inquiry to Benjaire Flow, Create Stripe checkout sessions]
        tools: [Cloudflare Workers, Cloudflare Turnstile, Cloudflare Email, Stripe API, n8n webhook]
        inputs: [Contact form POST, Checkout request]
        outputs: [Email to Benjaire, Webhook call to n8n, Stripe checkout redirect]
        dependencies: [benjaire-flow-intake]
      execution:
        trigger_type: event
        environment: Cloudflare Workers
      governance:
        autonomy: 3
        autonomy_note: Acts on each request within fixed rules (rate limit, allowed hosts, configured price tiers).
        data_sensitivity: confidential
        credential_owner: KC (Worker secrets in the Cloudflare dashboard)
        risk: medium
      docs:
        technical: site/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/benjaire-com.md#contact-form-worker
        known_issues:
          - The manifest purpose did not mention Stripe checkout
          - The forward to Benjaire Flow is tried once with a 10 second timeout and only logged on failure
          - Pull request previews email the same inbox as production
          - No KPI is defined yet; Atlas sees each request's result through the run feed once ATLAS_FEED_URL and ATLAS_FEED_TOKEN are set
        improvements:
          - Retry the Flow forward on 429 and 5xx with an inquiry id so n8n can drop duplicates
        last_review: 2026-10-28

  - id: benjaire-flow-intake
    name: Benjaire Flow Intake
    purpose: >-
      n8n workflow that checks the intake key, classifies each inquiry with Claude, saves it, alerts the owner and acknowledges the sender.
    framework: n8n
    model: claude-haiku-5-5
    runtime: n8n Cloud
    status: active
    trigger: Webhook from the contact Worker
    observe:
      agent_feed: true
    # Customer-facing and unattended: a failed intake alerts KC. Runs per inquiry, so no
    # silence window.
    alerts:
      failures: true
    last_run: null
    permissions:
      - 'Resend API: sending on benjaire.com only'
      - Anthropic, through the n8n credential on Classify with Claude
      - 'n8n data tables: reads flow_settings, writes flow_inquiries and flow_events'
    registry:
      title: Client Intake Specialist
      category: business
      subcategory: Workflow automation
      classification:
        type: B
        confidence: verified
        evidence: The export in benjaire-dashboard (products/flow/live-ops/workflows/1-intake.json) is a fixed n8n workflow with one Claude step (claude-haiku-5-5) that classifies the inquiry
      mission:
        problem: Website inquiries need sorting, an owner alert and a reply to the sender without someone triaging each one.
        outcomes:
          - Every valid inquiry is saved and the owner alerted
          - The sender gets an acknowledgement
        beneficiaries: [Benjaire customers, KC]
      responsibilities:
        tasks:
          - Check the x-flow-key
          - Clean and validate the fields
          - Classify topic, urgency and spam with Claude
          - Save the inquiry and log events
          - Email the owner an alert with status buttons
          - Acknowledge the sender
        tools: [n8n Cloud, Claude (claude-haiku-5-5), n8n data tables, Resend]
        inputs: [Inquiry webhook from the contact Worker]
        outputs: [flow_inquiries row, flow_events audit rows, Owner alert email, Acknowledgement email]
        dependencies: [benjaire-contact-worker]
      execution:
        trigger_type: event
        environment: n8n
      governance:
        autonomy: 3
        autonomy_note: 'Emails the owner and the sender without approval, within fixed rules: key check, validation, honeypot, and spam marked only at confidence 0.7 or more and never answered.'
        data_sensitivity: confidential
        credential_owner: KC (n8n credentials and the flow_settings table)
        risk: medium
        audit_log: flow_events data table in n8n
      cost:
        notes: About $0.0004 per inquiry for Claude Haiku; n8n Cloud Starter about €20 to €24 a month; Resend free up to 3,000 emails a month (live-ops README)
      docs:
        technical: https://github.com/khaneilcampbell/benjaire-dashboard/blob/main/products/flow/live-ops/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/benjaire-com.md#benjaire-flow-intake
        known_issues:
          - The export in benjaire-dashboard is updated by hand, so it can drift from the live workflow
          - The webhook has no rate limit of its own; it relies on the Worker in front
          - Status tokens never expire
          - No retention period is set for personal data in flow_inquiries
        improvements:
          - Expire status tokens after 90 days
          - Add a retention schedule and a privacy notice on the form
          - Connect n8n executions to Atlas
        last_review: 2026-10-28

  - id: benjaire-site-ci
    name: Site CI
    purpose: Builds and tests the Astro site on every pull request and push to main.
    framework: GitHub Actions
    runtime: GitHub-hosted runner
    status: active
    trigger: Push or pull request to main
    source: .github/workflows/site-ci.yml
    observe:
      github_workflow: site-ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read'
      - No repository secrets
    registry:
      title: Website Quality Engineer
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/site-ci.yml runs astro check, worker tests, build, link, SEO and accessibility checks
      mission:
        problem: Stops changes that break the build, links, SEO or accessibility from reaching benjaire.com.
        outcomes:
          - Every pull request to main is built and checked before merge
      responsibilities:
        tasks: [Type check the Astro site, Test the Worker, Build, Check links and SEO, Accessibility checks with Playwright]
        tools: [GitHub Actions, npm, Playwright]
        inputs: [Pushes and pull requests to main]
        outputs: [Check results]
      goals:
        objective: Block site changes that break the build, links, SEO or accessibility.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        credential_owner: KC (GitHub repository settings)
        risk: low
        audit_log: GitHub Actions run history
      docs:
        technical: site/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/benjaire-com.md#site-ci
        known_issues:
          - Actions are pinned by major version tag, not commit
        improvements:
          - Pin actions to commit SHAs, as the commerce pipeline does
        last_review: 2026-10-28
