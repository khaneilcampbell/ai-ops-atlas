# yaml-language-server: $schema=./schema/atlas-v2.schema.json
# Atlas manifest. Format: catalog/README.md
schema: atlas/v2

project:
  id: benjaire-site
  name: Business Operations HQ
  organization: Benjaire
  former_names: [Benjaire HQ]
  summary: >-
    Website for Benjaire, an Astro site on Cloudflare Workers with a contact
    Worker that forwards inquiries to the Benjaire Flow intake in n8n.
  status: active
  repository: khaneilcampbell/benjaire.com
  tags: [benjaire, astro, cloudflare, n8n]
  district: business-operations
  module: business-operations-hq
  links:
    - label: Live site
      url: https://benjaire.com

agents:
  - id: benjaire-contact-worker
    name: Contact Form Worker
    purpose: >-
      Validates contact form submissions (Turnstile, rate limit) and forwards
      valid inquiries to the Benjaire Flow intake in n8n.
    framework: Cloudflare Worker
    runtime: Cloudflare Workers
    status: active
    trigger: POST /api/contact
    source: site/worker/index.ts
    observe:
      agent_feed: true
    # Customer-facing and unattended: a failed request alerts KC. It only runs when someone
    # posts the form, so a quiet stretch is normal and there is no silence window.
    alerts:
      failures: true
    last_run: null
    permissions:
      - 'Cloudflare Email Routing: send to verified destination addresses only'
      - 'Stripe restricted key: Checkout Sessions write (STRIPE_SECRET_KEY)'
      - Turnstile secret key (TURNSTILE_SECRET_KEY)
      - Benjaire Flow intake key, sent as x-flow-key (FLOW_INTAKE_KEY)
    registry:
      title: Inquiry Routing Coordinator
      category: business
      subcategory: Customer inquiry processing
      classification:
        type: E
        confidence: verified
        evidence: site/worker/index.ts validates the form, sends email, forwards to n8n and creates Stripe checkout sessions; no AI model
      mission:
        problem: Receives website inquiries and checkout requests safely without a separate backend.
        outcomes: [Valid inquiries reach the right inbox and Benjaire Flow, Spam and abuse are rejected]
        beneficiaries: [Benjaire customers, KC]
      responsibilities:
        tasks: [Check origin and rate limit, Verify Turnstile, Email the inquiry to the category recipient, Forward the inquiry to Benjaire Flow, Create Stripe checkout sessions]
        tools: [Cloudflare Workers, Cloudflare Turnstile, Cloudflare Email, Stripe API, n8n webhook]
        inputs: [Contact form POST, Checkout request]
        outputs: [Email to Benjaire, Webhook call to n8n, Stripe checkout redirect]
        dependencies: [benjaire-flow-intake]
      execution:
        trigger_type: event
        environment: Cloudflare Workers
      governance:
        autonomy: 3
        autonomy_note: Acts on each request within fixed rules (rate limit, allowed hosts, configured price tiers).
        data_sensitivity: confidential
        credential_owner: KC (Worker secrets in the Cloudflare dashboard)
        risk: medium
      docs:
        technical: site/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/benjaire-com.md#contact-form-worker
        known_issues:
          - The manifest purpose did not mention Stripe checkout
          - The forward to Benjaire Flow is tried once with a 10 second timeout and only logged on failure
          - Pull request previews email the same inbox as production
          - No KPI is defined yet; Atlas sees each request's result through the run feed once ATLAS_FEED_URL and ATLAS_FEED_TOKEN are set
        improvements:
          - Retry the Flow forward on 429 and 5xx with an inquiry id so n8n can drop duplicates
        last_review: 2026-10-28

  - id: benjaire-flow-intake
    name: Benjaire Flow Intake
    purpose: >-
      n8n workflow that checks the intake key, classifies each inquiry with Claude, saves it, alerts the owner and acknowledges the sender.
    framework: n8n
    model: claude-haiku-5-5
    runtime: n8n Cloud
    status: active
    trigger: Webhook from the contact Worker
    observe:
      agent_feed: true
    # Customer-facing and unattended: a failed intake alerts KC. Runs per inquiry, so no
    # silence window.
    alerts:
      failures: true
    last_run: null
    links:
      - label: n8n workflow
        url: https://khancam15.app.n8n.cloud/workflow/iQdSJGMQi6TBHlar
    permissions:
      - 'Resend API: sending on benjaire.com only'
      - Anthropic, through the n8n credential on Classify with Claude
      - 'n8n data tables: reads flow_settings, writes flow_inquiries and flow_events'
    registry:
      title: Client Intake Specialist
      category: business
      subcategory: Workflow automation
      classification:
        type: B
        confidence: verified
        evidence: The export in benjaire-dashboard (products/flow/live-ops/workflows/1-intake.json) is a fixed n8n workflow with one Claude step (claude-haiku-5-5) that classifies the inquiry
      mission:
        problem: Website inquiries need sorting, an owner alert and a reply to the sender without someone triaging each one.
        outcomes:
          - Every valid inquiry is saved and the owner alerted
          - The sender gets an acknowledgement
        beneficiaries: [Benjaire customers, KC]
      responsibilities:
        tasks:
          - Check the x-flow-key
          - Clean and validate the fields
          - Classify topic, urgency and spam with Claude
          - Save the inquiry and log events
          - Email the owner an alert with status buttons
          - Acknowledge the sender
        tools: [n8n Cloud, Claude (claude-haiku-5-5), n8n data tables, Resend]
        inputs: [Inquiry webhook from the contact Worker]
        outputs: [flow_inquiries row, flow_events audit rows, Owner alert email, Acknowledgement email]
        dependencies: [benjaire-contact-worker]
      execution:
        trigger_type: event
        environment: n8n
      governance:
        autonomy: 3
        autonomy_note: 'Emails the owner and the sender without approval, within fixed rules: key check, validation, honeypot, and spam marked only at confidence 0.7 or more and never answered.'
        data_sensitivity: confidential
        credential_owner: KC (n8n credentials and the flow_settings table)
        risk: medium
        audit_log: flow_events data table in n8n
      cost:
        notes: About $0.0004 per inquiry for Claude Haiku; n8n Cloud Starter about €20 to €24 a month; Resend free up to 3,000 emails a month (live-ops README)
      docs:
        technical: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/apps/benjaire-dashboard/products/flow/live-ops/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/benjaire-com.md#benjaire-flow-intake
        known_issues:
          - The export in benjaire-dashboard is updated by hand, so it can drift from the live workflow
          - The webhook has no rate limit of its own; it relies on the Worker in front
          - Status tokens never expire
          - No retention period is set for personal data in flow_inquiries
        improvements:
          - Expire status tokens after 90 days
          - Add a retention schedule and a privacy notice on the form
          - Connect n8n executions to Atlas
        last_review: 2026-10-28

  - id: benjaire-inquiry-to-client
    name: Inquiry to Client
    purpose: >-
      Lists each benjaire.com inquiry in Mission Control, drafts a reply from a fixed template per category, and reminds KC to follow up on day 3 and day 7. KC sends every message from their own mail app.
    framework: Atlas (plain code, no model)
    runtime: AI Ops Atlas site (Cloudflare Pages + D1) and app
    status: idle
    trigger: Inquiry copied from the contact Worker to POST /api/hooks/inquiries
    source: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/src/inquiries/model.ts
    last_run: null
    permissions:
      - 'Atlas AGENT_FEED_TOKEN, add-only: the Worker can store an inquiry but never read one back'
      - 'D1 table inquiries: kept 180 days, then deleted'
    registry:
      title: Client Reply Assistant
      category: business
      subcategory: Customer inquiry processing
      classification:
        type: C
        confidence: verified
        evidence: server/inquiries.ts stores inquiries; src/inquiries/model.ts drafts replies from fixed templates and schedules follow-ups; no model call and no mail sending
      mission:
        problem: Website inquiries arrive by email with nothing to track whether each one got a reply and a follow-up.
        outcomes:
          - Every inquiry gets a reply within a day
          - Quiet leads get two follow-ups, then close
        beneficiaries: [Benjaire customers, KC]
      responsibilities:
        tasks:
          - Store each inquiry once (retried copies are ignored)
          - Show what needs a reply or a follow-up
          - Draft the reply and follow-ups from templates
          - Open the draft in KC's mail app
        tools: [Cloudflare D1, Atlas Mission Control]
        inputs: [Inquiry from the contact Worker]
        outputs: [Mission Control inbox, Reply and follow-up drafts in KC's mail app]
        dependencies: [benjaire-contact-worker]
      execution:
        trigger_type: event
        environment: AI Ops Atlas
      governance:
        autonomy: 1
        autonomy_note: Prepares drafts only. Nothing is sent from Atlas; KC reads, edits and sends each message from their own mail app.
        data_sensitivity: confidential
        credential_owner: KC (AGENT_FEED_TOKEN on the site and ATLAS_FEED_TOKEN on the Worker)
        risk: low
      cost:
        notes: No model calls. Runs inside the existing Pages site and D1 free tier, so $0 a month.
      docs:
        technical: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/inquiry-inbox.md
        known_issues:
          - Reply and follow-up progress is kept on each device, so marking a reply on the Mac doesn't show on the phone
        improvements:
          - Optional Claude Haiku polish of a draft on click, behind a monthly cap
        last_review: 2026-11-01

  - id: benjaire-site-ci
    name: Site CI
    purpose: Builds and tests the Astro site on every pull request and push to main.
    framework: GitHub Actions
    runtime: GitHub-hosted runner
    status: active
    trigger: Push or pull request to main
    source: .github/workflows/site-ci.yml
    observe:
      github_workflow: site-ci.yml
    last_run: null
    permissions:
      - 'GITHUB_TOKEN: contents read'
      - No repository secrets
    registry:
      title: Website Quality Engineer
      category: engineering
      subcategory: CI/CD
      classification:
        type: D
        confidence: verified
        evidence: .github/workflows/site-ci.yml runs astro check, worker tests, build, link, SEO and accessibility checks
      mission:
        problem: Stops changes that break the build, links, SEO or accessibility from reaching benjaire.com.
        outcomes:
          - Every pull request to main is built and checked before merge
      responsibilities:
        tasks: [Type check the Astro site, Test the Worker, Build, Check links and SEO, Accessibility checks with Playwright]
        tools: [GitHub Actions, npm, Playwright]
        inputs: [Pushes and pull requests to main]
        outputs: [Check results]
      goals:
        objective: Block site changes that break the build, links, SEO or accessibility.
        kpis:
          - name: Run success rate
            kind: reliability
            measure: run_success_rate
            basis: Observed from GitHub Actions; no target agreed yet
      execution:
        trigger_type: event
        environment: GitHub-hosted runner
      governance:
        autonomy: 0
        data_sensitivity: public
        credential_owner: KC (GitHub repository settings)
        risk: low
        audit_log: GitHub Actions run history
      docs:
        technical: site/README.md
        runbook: https://github.com/khaneilcampbell/ai-ops-atlas/blob/main/docs/runbooks/benjaire-com.md#site-ci
        known_issues:
          - Actions are pinned by major version tag, not commit
        improvements:
          - Pin actions to commit SHAs, as the commerce pipeline does
        last_review: 2026-10-28

  # Benjaire Product Lab: one first-class n8n Agent (id ruOvE7nfE713WDUL on khancam15.app.n8n.cloud),
  # read through the n8n MCP on 2026-11-04. Its five roles are skills inside the same agent run, listed
  # here so each has a desk in the Benjaire Marketing Agency. Atlas has seen no run yet, and n8n Agent
  # runs are not workflow executions, so there is no `observe` source until the agent posts reports.
  - id: benjaire-product-lab
    workplace: {building: Benjaire Marketing Agency, floor: 1, room: "1-strategy"}
    name: Benjaire Product Lab
    purpose: >-
      n8n agent that researches, scores and recommends the next best product for Benjaire each month, running five research roles in order and emailing KC the brief.
    framework: n8n Agent
    model: claude-sonnet-5-5
    runtime: n8n Cloud
    status: active
    trigger: 'Schedule: 09:00 ET on the 1st of each month (task "Monthly next-product report")'
    last_run: null
    permissions:
      - 'Gmail tool email_kc_report: sends only to benjaireco@gmail.com (n8n Gmail credential)'
      - 'Notion MCP server: creates or updates Product Lab pages (n8n Notion credential)'
      - 'Anthropic web search: at most 5 searches per run'
    registry:
      title: Product Lab Lead
      category: business
      subcategory: Product research
      classification:
        type: A
        confidence: verified
        evidence: n8n Agent config read 2026-11-04 (Sonnet 5.5, reasoning high, web search, five skills, one monthly task, Gmail and Notion tools)
      mission:
        problem: Benjaire needs an evidence-backed pick for the next product to launch, validated cheaply before money is spent.
        outcomes:
          - One top recommendation and two runners-up each month, with sources
          - Ideas are called hypotheses until real demand evidence exists
        beneficiaries: [KC]
      responsibilities:
        tasks:
          - Run Market Research, Competitor Analysis, Customer Insight, Product Scoring and Product Brief in order
          - Note what changed since last month's pick
          - Email KC the brief and save it to Notion
        tools: [n8n Agent, Claude (claude-sonnet-5-5), Anthropic web search, Gmail, Notion MCP]
        inputs: [Monthly schedule, A topic from KC in chat]
        outputs: [Monthly next-product brief by email, Notion page]
        dependencies: [benjaire-product-lab-research, benjaire-product-lab-competitors, benjaire-product-lab-customers, benjaire-product-lab-scoring, benjaire-product-lab-brief]
      execution:
        trigger_type: scheduled
        schedule: '0 9 1 * * (America/New_York)'
        environment: n8n
      governance:
        autonomy: 1
        autonomy_note: Recommends only. It emails KC and writes Notion pages without approval, never contacts anyone else and changes nothing outside KC's own inbox and Notion.
        data_sensitivity: internal
        credential_owner: KC (n8n credentials for Anthropic, Gmail and Notion)
        risk: low
      cost:
        notes: One run a month on Sonnet 5.5 with reasoning high, up to 5 web searches and n8n memory. Not measured yet; Atlas makes no model calls for it.
      docs:
        technical: https://khancam15.app.n8n.cloud
        known_issues:
          - Atlas cannot see its runs yet; n8n Agent runs are not workflow executions and the agent does not post to Atlas
          - Reasoning high plus observational memory on every run is the main cost
        improvements:
          - Post each finished brief to Atlas through POST /api/hooks/reports
        last_review: 2026-11-04

