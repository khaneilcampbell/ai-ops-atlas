version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    ignore:
      # Tauri's Linux webview (gtk/webkit2gtk 0.18) pins glib to 0.18, so the 0.20 fix
      # cannot resolve and every update attempt fails. glib is not built into the macOS
      # app. Remove this once Tauri moves to gtk-rs 0.20 or later.
      - dependency-name: glib
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
