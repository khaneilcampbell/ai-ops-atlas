name: Service Desk CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    if: github.event_name != 'workflow_dispatch'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /service-desk/language:${{ matrix.language }}

  triage:
    name: B4 Security Alert Triage
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: atlas-security-alert-triage
      cancel-in-progress: false
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/security-triage-state.json
          key: security-triage-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: security-triage-${{ github.ref_name }}-
      - name: Read bounded security evidence
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_SECURITY_TRIAGE_STOP: ${{ vars.ATLAS_SECURITY_TRIAGE_STOP || 'false' }}
        run: python3 ops/security/alert_triage.py --output "$RUNNER_TEMP/security-triage" --state "$RUNNER_TEMP/security-triage-state.json"
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/security-triage/report.md" ]; then
            cat "$RUNNER_TEMP/security-triage/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: atlas-security-triage
          path: ${{ runner.temp }}/security-triage/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: success() && steps.report.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/security-triage-state.json
          key: security-triage-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
