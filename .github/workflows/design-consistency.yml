# Design Consistency (ops/design-consistency): keeps Atlas on the tokens in src/styles/tokens.css.
# The check is plain code and free. When there is drift and no fix PR is open, it prepares one PR
# with before and after screenshots; code makes the exact swaps, Claude only the judgment calls.
# It never merges.
name: Design consistency

on:
  push:
    branches: [main]
    paths: [src/styles/**, src/components/**, src/views/**, catalog/**, ops/design-consistency/**]
  # Daily, so the backlog keeps moving and the saved state does not expire (caches unused for 7 days are evicted).
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and report only (no fix PR, no model call, no saved state)
        type: boolean
        default: false
  # On pull requests it only flags new drift, as warnings in the job summary.
  pull_request:
    paths: [src/styles/**, src/components/**, src/views/**, catalog/**, ops/design-consistency/**, .github/workflows/design-consistency.yml]

permissions:
  contents: read

concurrency:
  group: design-consistency-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
    outputs:
      fix: ${{ steps.scan.outputs.fix }}
      model: ${{ steps.scan.outputs.model }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            catalog
            ops/design-consistency
      - name: Restore saved state
        if: env.DRY_RUN != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: design-consistency-state.json
          key: design-consistency-state-${{ github.run_id }}
          restore-keys: design-consistency-state-
      - name: Check
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          ATLAS_FEED_URL: ${{ github.event_name != 'pull_request' && secrets.ATLAS_FEED_URL || '' }}
          ATLAS_FEED_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ATLAS_FEED_TOKEN || '' }}
        run: python3 ops/design-consistency/design.py scan ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.scan.outputs.fix == 'true'
        with:
          name: design-consistency-work
          path: |
            design-consistency-state.json
            design-consistency-work.json
          retention-days: 3
      - name: Save state
        if: env.DRY_RUN != 'true' && steps.scan.outputs.fix != 'true' && hashFiles('design-consistency-state.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: design-consistency-state.json
          key: design-consistency-state-${{ github.run_id }}

  # Only runs on main (never on pull requests) when the check found a batch and no fix PR is open.
  fix:
    needs: check
    if: needs.check.outputs.fix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: design-consistency/run-${{ github.run_id }}
      SHOTS_BRANCH: design-consistency-shots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A fine-grained token lets the PR run CI; without it GitHub opens the PR as github-actions.
          token: ${{ secrets.DESIGN_FIX_TOKEN || github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: design-consistency-work
      - name: Install the Claude SDK
        if: needs.check.outputs.model == 'true'
        run: python3 -m venv "$RUNNER_TEMP/design" && "$RUNNER_TEMP/design/bin/pip" install --quiet anthropic
      - name: Fix
        id: fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          py=python3; [ -x "$RUNNER_TEMP/design/bin/python" ] && py="$RUNNER_TEMP/design/bin/python"
          "$py" ops/design-consistency/design.py fix
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.fix.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Before and after screenshots
        if: steps.fix.outputs.changed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          git stash push --quiet
          DESIGN_SHOTS="$RUNNER_TEMP/shots/before" npx playwright test -c visual design.visual.ts
          git stash pop --quiet
          DESIGN_SHOTS="$RUNNER_TEMP/shots/after" npx playwright test -c visual design.visual.ts
          node ops/design-consistency/diff.mjs "$RUNNER_TEMP/shots/before" "$RUNNER_TEMP/shots/after" \
            "https://raw.githubusercontent.com/${{ github.repository }}/$SHOTS_BRANCH/run-${{ github.run_id }}" design-consistency-shots.json
      - name: Push the fix branch and screenshots
        if: steps.fix.outputs.changed == 'true'
        run: |
          git config user.name "atlas-design-consistency[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src catalog ops/design-consistency/baseline.json
          git commit --quiet -m "Design: bring drift back onto the Atlas tokens" -m "Prepared by Design Consistency (ops/design-consistency), run ${{ github.run_id }}."
          git push --quiet origin "$BRANCH"
          # Screenshots live on their own branch so they never land on main.
          if git fetch --quiet --depth 1 origin "$SHOTS_BRANCH"; then git worktree add --quiet "$RUNNER_TEMP/wt" FETCH_HEAD -b shots-local;
          else git worktree add --quiet --orphan -b shots-local "$RUNNER_TEMP/wt"; fi
          mkdir -p "$RUNNER_TEMP/wt/run-${{ github.run_id }}"
          cp -r "$RUNNER_TEMP/shots/before" "$RUNNER_TEMP/shots/after" "$RUNNER_TEMP/wt/run-${{ github.run_id }}/"
          git -C "$RUNNER_TEMP/wt" add -A
          git -C "$RUNNER_TEMP/wt" commit --quiet -m "Screenshots for design-consistency run ${{ github.run_id }}"
          git -C "$RUNNER_TEMP/wt" push --quiet origin "shots-local:$SHOTS_BRANCH"
      - name: Open the pull request
        if: steps.fix.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.DESIGN_FIX_TOKEN || github.token }}
          ATLAS_FEED_URL: ${{ secrets.ATLAS_FEED_URL }}
          ATLAS_FEED_TOKEN: ${{ secrets.ATLAS_FEED_TOKEN }}
        run: python3 ops/design-consistency/design.py pr --branch "$BRANCH" --shots design-consistency-shots.json
      - name: Save state
        if: always() && hashFiles('design-consistency-state.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: design-consistency-state.json
          key: design-consistency-state-${{ github.run_id }}-fix
