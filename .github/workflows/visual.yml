name: Visual checks

# Screenshots of the map, office and Mission Control.
# Not a required check. On a pull request it runs a quick check on one runner: the main views and
# the header, with every test's behaviour checked but screenshots only saved (not compared), so an
# intended design change can't turn it red. The screenshots are in the run's visual-results-1
# artifact. The whole set, compared pixel by pixel with visual/baselines/ci, runs by hand.
on:
  pull_request:
    paths:
      - "src/views/**"
      - "src/styles/**"
      - "src/components/**"
      - "visual/**"
  workflow_dispatch:
    inputs:
      update:
        description: Save this run's screenshots as the CI baselines, on a new branch to open a pull request from
        type: boolean
        default: false
      specs:
        description: Only these spec files, space separated (e.g. "views.visual.ts header.visual.ts"). One runner instead of six; leave empty for the whole set
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: ${{ github.event_name == 'pull_request' && 'Visual checks (quick)' || format('Visual checks (screenshots {0}/6)', matrix.shard) }}
    runs-on: ubuntu-latest
    # The whole set (about 110 tests, software WebGL) no longer fits in 45 minutes on one runner,
    # so it runs as 6 shards side by side, split by spec file. Each shard takes roughly a sixth.
    # A shard that still hits 35 minutes is a real slowdown, not noise (the blank map after #148).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'pull_request' || inputs.specs) && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Decide whether to compare or record
        id: mode
        run: |
          if [ "${{ inputs.update }}" = "true" ]; then echo "record=1" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pixels move on purpose in most pull requests; saving instead of comparing keeps an
            # intended change from failing the check. Clicks, counts and layout asserts still run.
            echo "record=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Quick check: screenshots are saved to the visual-results-1 artifact, not compared."
          elif ! ls visual/baselines/ci/*.png >/dev/null 2>&1; then
            echo "record=1" >> "$GITHUB_OUTPUT"
            echo "::notice::No CI baselines yet. Recording screenshots only; run this workflow by hand with 'update' to save them."
          fi
      - name: Pick the tests
        id: pick
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          if [ -n "$SPECS" ]; then echo "args=$SPECS" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "pull_request" ]; then echo "args=views.visual.ts header.visual.ts" >> "$GITHUB_OUTPUT";
          else echo "args=--shard=${{ matrix.shard }}/6" >> "$GITHUB_OUTPUT"; fi
      - name: Compare with baselines
        if: steps.mode.outputs.record != '1'
        env:
          ARGS: ${{ steps.pick.outputs.args }}
        run: npx playwright test -c visual $ARGS
      - name: Save screenshots (no comparison)
        if: steps.mode.outputs.record == '1'
        env:
          ARGS: ${{ steps.pick.outputs.args }}
        run: BASELINE=1 npx playwright test -c visual $ARGS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-results-${{ matrix.shard }}
          path: |
            visual/baselines/ci/
            test-results/
            playwright-report/
          retention-days: 14

  # Only the manual update run pushes, and only a new visual-baselines/* branch.
  save:
    name: Save CI baselines to a branch
    needs: visual
    if: inputs.update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: visual-results-*
          merge-multiple: true
          path: results
      - run: |
          branch="visual-baselines/run-${{ github.run_id }}"
          mkdir -p visual/baselines/ci
          cp results/visual/baselines/ci/*.png visual/baselines/ci/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add visual/baselines/ci
          git commit -m "Update CI visual baselines from run ${{ github.run_id }}"
          git push origin "$branch"
          echo "::notice::Baselines pushed to $branch. Open a pull request from it to accept them."
