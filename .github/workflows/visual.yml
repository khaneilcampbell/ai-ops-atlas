name: Visual checks

# Screenshots of the map, office and Mission Control compared with visual/baselines/ci.
# Not a required check. It runs:
#  - on a pull request only when it has the "visual" label (add the label to ask for it; later
#    pushes re-run it while the label stays), and only if the PR touches what it draws,
#  - every night on main, so a change that slipped through shows up the next morning,
#  - by hand from the Actions tab.
# Running it on every push used 6 runners for 35-60 minutes each time and queued every other check.
on:
  schedule:
    - cron: "37 7 * * *" # 02:37 New York
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "src/views/**"
      - "src/styles/**"
      - "src/components/**"
      - "visual/**"
  workflow_dispatch:
    inputs:
      update:
        description: Save this run's screenshots as the CI baselines, on a new branch to open a pull request from
        type: boolean
        default: false
      specs:
        description: Only these spec files, space separated (e.g. "views.visual.ts header.visual.ts"). One runner instead of six; leave empty for the whole set
        type: string
        default: ""

permissions:
  contents: read

# Adding some other label must not cancel a screenshot run that is already going, so those
# events get a group of their own.
concurrency:
  group: visual-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'visual' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual checks (screenshots ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # The whole set (about 110 tests, software WebGL) no longer fits in 45 minutes on one runner,
    # so it runs as 6 shards side by side, split by spec file. Each shard takes roughly a sixth.
    # A shard that still hits 35 minutes is a real slowdown, not noise (the blank map after #148).
    timeout-minutes: 35
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'visual')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.specs && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Decide whether to compare or record
        id: mode
        run: |
          if [ "${{ inputs.update }}" = "true" ]; then echo "record=1" >> "$GITHUB_OUTPUT";
          elif ! ls visual/baselines/ci/*.png >/dev/null 2>&1; then
            echo "record=1" >> "$GITHUB_OUTPUT"
            echo "::notice::No CI baselines yet. Recording screenshots only; run this workflow by hand with 'update' to save them."
          fi
      - name: Pick the tests
        id: pick
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          if [ -n "$SPECS" ]; then echo "args=$SPECS" >> "$GITHUB_OUTPUT";
          else echo "args=--shard=${{ matrix.shard }}/6" >> "$GITHUB_OUTPUT"; fi
      - name: Compare with baselines
        if: steps.mode.outputs.record != '1'
        env:
          ARGS: ${{ steps.pick.outputs.args }}
        run: npx playwright test -c visual $ARGS
      - name: Record baselines
        if: steps.mode.outputs.record == '1'
        # Start from an empty folder so this run uploads only the screenshots it recorded.
        # Otherwise every shard also uploads the old copies of the other shards' baselines, and
        # when the save job merges the uploads an old copy can overwrite a new recording.
        env:
          ARGS: ${{ steps.pick.outputs.args }}
        run: |
          rm -f visual/baselines/ci/*.png
          BASELINE=1 npx playwright test -c visual $ARGS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-results-${{ matrix.shard }}
          path: |
            visual/baselines/ci/
            test-results/
            playwright-report/
          retention-days: 14

  # Only the manual update run pushes, and only a new visual-baselines/* branch.
  save:
    name: Save CI baselines to a branch
    needs: visual
    if: inputs.update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: visual-results-*
          merge-multiple: true
          path: results
      - run: |
          branch="visual-baselines/run-${{ github.run_id }}"
          mkdir -p visual/baselines/ci
          cp results/visual/baselines/ci/*.png visual/baselines/ci/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add visual/baselines/ci
          git commit -m "Update CI visual baselines from run ${{ github.run_id }}"
          git push origin "$branch"
          echo "::notice::Baselines pushed to $branch. Open a pull request from it to accept them."
