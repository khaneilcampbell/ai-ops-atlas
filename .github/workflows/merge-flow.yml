# Merge Flow (ops/merge-flow): sorts open pull requests into lanes so ready work merges sooner.
# Read-only. A few small GraphQL reads per run; Claude only when the triage changed and something needs action.
name: Merge flow

on:
  schedule:
    - cron: "23 */4 * * *"
  # Re-triage when a pull request's CI finishes in this repository.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and count only (no brief, no feed, no saved state)
        type: boolean
        default: false
  # Tests the agent itself on pull requests that change it, in dry-run mode.
  pull_request:
    paths: [ops/merge-flow/**, .github/workflows/merge-flow.yml]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-flow-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: ops/merge-flow
      - name: Restore last triage
        if: env.DRY_RUN != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: merge-flow-state.json
          key: merge-flow-state-${{ github.run_id }}
          restore-keys: merge-flow-state-
      - name: Triage
        id: triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_FLOW_TOKEN: ${{ github.event_name != 'pull_request' && secrets.MERGE_FLOW_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          ATLAS_FEED_URL: ${{ github.event_name != 'pull_request' && secrets.ATLAS_FEED_URL || '' }}
          ATLAS_FEED_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ATLAS_FEED_TOKEN || '' }}
        run: python3 ops/merge-flow/merge_flow.py triage ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
      - name: Install the Claude SDK
        if: steps.triage.outputs.brief == 'true'
        run: python3 -m pip install --quiet --upgrade anthropic
      - name: Brief
        if: steps.triage.outputs.brief == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          ATLAS_FEED_URL: ${{ github.event_name != 'pull_request' && secrets.ATLAS_FEED_URL || '' }}
          ATLAS_FEED_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ATLAS_FEED_TOKEN || '' }}
        run: python3 ops/merge-flow/merge_flow.py brief
      - name: Save triage
        if: env.DRY_RUN != 'true' && hashFiles('merge-flow-state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: merge-flow-state.json
          key: merge-flow-state-${{ github.run_id }}
