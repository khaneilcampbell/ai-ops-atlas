name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the macOS app bundle
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request stops its older run. Every other run (main, dispatch) gets its
# own group, so builds of main and their macOS publish are never cancelled or queued.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    name: Desktop shell (Rust tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: mkdir -p dist && touch dist/index.html
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Only what ships in the app; dev tooling advisories arrive as Dependabot PRs.
      - run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  macos:
    needs: [web, rust, audit]
    name: macOS app bundle
    # Every merge to main builds the app, so an install never waits on a separate dispatch.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-latest
    # Cached builds take about 6 minutes; a cold cache takes about 25.
    timeout-minutes: 45
    permissions:
      contents: write
    # Builds from main publish in order, so the update feed never goes backwards.
    concurrency:
      group: macos-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Builds from main are signed for the in-app updater and published to the
      # rolling main-build release that installed copies of Atlas check.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # The signing secrets are set only on the two steps that sign, so third-party code in
    # the actions and npm install steps never runs with them in its environment.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Reuses compiled dependencies between builds; a cold build recompiles all of Tauri.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: macos-app
      - run: npm ci
      # The updater installs any build with a higher version, so each main build
      # gets the run number as its patch version (0.2.0 -> 0.2.<run>).
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ "$PUBLISH" = "true" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            base=$(node -p 'require("./src-tauri/tauri.conf.json").version.split(".").slice(0, 2).join(".")')
            version="$base.$GITHUB_RUN_NUMBER"
            echo "VERSION=$version" >> "$GITHUB_ENV"
            npx tauri build --bundles app --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            if [ "$PUBLISH" = "true" ]; then echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this build is not published for the in-app updater."; fi
            npx tauri build --bundles app
          fi
      - name: Sign with the Atlas certificate
        # A self-signed code-signing certificate (scripts/macos-signing-cert.sh). Signing every
        # build with the same one keeps the app's identity stable across self-updates, so the
        # Keychain's "Always Allow" keeps working. Without it builds are ad-hoc signed.
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          # Re-signing changes the app, so the updater archive is signed again too.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$MACOS_SIGNING_CERT" ]; then
            scripts/macos-resign.sh
          else
            echo "::warning::MACOS_SIGNING_CERT is not set, so this build is ad-hoc signed and the Keychain will ask again after updating."
          fi
      # upload-artifact drops file permissions, which would leave the app binary
      # non-executable, so package the bundle with ditto first.
      - name: Zip the app bundle
        run: ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/AI Ops Atlas.app" AI-Ops-Atlas-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AI-Ops-Atlas-macOS
          path: AI-Ops-Atlas-macOS.zip
      - name: Publish to the in-app updater
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="src-tauri/target/release/bundle/macos"
          cp "$dir/AI Ops Atlas.app.tar.gz" AI-Ops-Atlas.app.tar.gz
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/main-build/AI-Ops-Atlas.app.tar.gz"
          node -e '
            const fs = require("fs");
            const [version, sigFile, url, sha] = process.argv.slice(1);
            const feed = {
              version,
              notes: `Built from main at ${sha.slice(0, 7)}.`,
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": { signature: fs.readFileSync(sigFile, "utf8").trim(), url } },
            };
            fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2));
          ' "$VERSION" "$dir/AI Ops Atlas.app.tar.gz.sig" "$url" "$GITHUB_SHA"
          gh release view main-build >/dev/null 2>&1 || gh release create main-build --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build" --notes "Rolling build of main that installed copies of AI Ops Atlas update from. Not a versioned release."
          # The archive goes up before the feed that points at it.
          gh release upload main-build AI-Ops-Atlas.app.tar.gz --clobber
          gh release upload main-build latest.json --clobber
