[package]
name = "ai-ops-atlas"
version = "0.2.0"
description = "A read-only command center for AI agents, projects and GitHub repositories"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_ops_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
